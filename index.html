- **par trouble** : dyslexie, dysorthographie, dyspraxie, dyscalculie, dysphasie, TDAH, ou « tous troubles dys » ;
- **par catégorie** : aménagements en classe, évaluations et devoirs, lecture et écrit, langues vivantes, mathématiques, outils et numérique, posture enseignante, organisation et méthodologie.

Chaque fiche indique aussi son délai de mise en place : **Immédiat**, **Court terme** ou **Sur l'année**. Pratique pour repérer ce qu'on peut changer dès demain (formuler des consignes courtes, éviter la double tâche, oraliser les consignes) et ce qui se construit dans la durée (différenciation, collaboration avec les familles). Appuie sur **Lire** pour ouvrir une fiche. Les fiches sont imprimables.

Pour les professeurs de langues, plusieurs fiches sont dédiées : adapter l'anglais pour les élèves dyslexiques, approche multisensorielle des langues étrangères, limiter la confusion des mots et des sons, soutenir l'expression orale des élèves dysphasiques.

## L'adaptateur de texte

1. Colle ton texte dans la zone **Texte à adapter**.
2. Règle l'affichage : police (Atkinson Hyperlegible, Lexend, OpenDyslexic ou Arial), taille, interligne, espacement des lettres et des mots, couleur de fond, et syllabes colorées.
3. L'**aperçu adapté** s'affiche à côté du texte d'origine, pour comparer.
4. Appuie sur **Copier** pour récupérer le texte adapté.

Astuce de l'application : Atkinson Hyperlegible, interligne 1,8 et espacement des mots de 0,15 offrent un confort de lecture maximal.

## L'assistant IA

Pose une question concrète sur une situation de classe. Quelques exemples proposés par l'application :

- « Comment adapter une évaluation d'histoire pour un élève dyslexique de 5e ? »
- « Quels outils numériques pour un élève dyspraxique en cours de maths ? »
- « Comment gérer un élève TDAH qui perturbe la classe ? »
- « Idées pour faciliter l'apprentissage de l'anglais à un élève dys ? »

Précise le niveau, la discipline et le type de difficulté pour obtenir des pistes adaptées, mais jamais le nom de l'élève (voir plus bas).

## Mes élèves

Cette page permet de créer une fiche par élève avec **Nouvel élève**, pour noter ses troubles, ses aménagements et des notes de progression. Les fiches sont enregistrées localement, sur l'appareil utilisé.

## Protéger les données des élèves

Les troubles et les aménagements d'un élève sont des informations de santé, particulièrement sensibles. Quelques règles simples :

- **Dans l'assistant IA, ne donne jamais le nom ni aucun détail permettant de reconnaître un élève.** Tes questions sont envoyées à un service d'intelligence artificielle en ligne pour produire les réponses. Décris la situation de façon générale : « un élève dyslexique de 5e », pas son prénom.
- **Dans Mes élèves, utilise des initiales ou un pseudonyme.** Les fiches restent sur l'appareil, mais toute personne qui l'utilise peut les voir. Évite de remplir ces fiches sur un ordinateur partagé (salle des profs, CDI), et vérifie que cet usage est compatible avec les consignes de ton établissement.
- **Les fiches élèves ne suivent pas** si tu changes d'appareil ou si tu effaces les données de ton navigateur.

## Les limites de l'outil

L'assistant IA peut se tromper : l'application le rappelle elle-même. Ses réponses sont des pistes à vérifier et à adapter. Les fiches donnent des repères généraux. Dans tous les cas, le PAP ou le PPS de l'élève, et les préconisations des professionnels qui le suivent, restent la référence.

## Conseils d'utilisation

**Pour démarrer.** Filtre les fiches sur le délai « Immédiat » : tu trouveras des adaptations simples à mettre en place dès le prochain cours, comme raccourcir les consignes, oraliser les supports ou éviter de demander d'écouter et d'écrire en même temps.

**Avant une évaluation.** Passe tes consignes et tes textes dans l'adaptateur. Une police plus lisible et un interligne plus grand profitent souvent à toute la classe, et pas seulement à l'élève dys.

**Face à une situation particulière.** L'assistant IA peut t'aider à trouver des idées, à condition de décrire la situation sans identifier l'élève. Confronte ensuite ses propositions aux fiches et au PAP ou PPS.

**En équipe.** Les fiches peuvent servir de support commun en conseil pédagogique ou lors d'une équipe éducative, pour harmoniser les adaptations entre disciplines, en lien avec la famille et les professionnels qui suivent l'élève.
</script>

<script type="text/markdown" id="tuto-evars-companion">
## C'est quoi, EVARS Companion ?

EVARS Companion aide les professeurs d'anglais de collège à croiser deux programmes : les axes culturels du programme d'anglais (BO 2025) et les objectifs de l'éducation à la vie affective et relationnelle, et à la sexualité (EVARS, programme de février 2025). Pour chaque croisement, l'outil propose un dossier pédagogique prêt à adapter : une activité de 45 minutes, une séquence, des idées de supports ou une tâche d'évaluation.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne entièrement hors ligne, dans le navigateur.

Pour chaque niveau, trois objectifs EVARS sont proposés, un par axe du programme :

| Niveau | Corps | Relation | Société |
| --- | --- | --- | --- |
| 6e (A1 → A1+) | Comprendre les changements de son corps | Entrer en relation avec les autres | Trouver sa place dans un groupe |
| 5e (A1+ → A2) | Développer librement sa personnalité | Choisir ses relations | Distinguer vie publique et vie privée |
| 4e (A1+ → A2+) | La sexualité comme réalité complexe | Compréhension critique des relations | Représentations de la sexualité |
| 3e | Bonheur, émotions et sexualité | Relation réciproque et égalitaire | Sexualité et droits humains |

Ces objectifs se croisent avec les 23 axes culturels du programme d'anglais, de « Personnes et personnages » en 6e à « L'Irlande » en 4e : soit 69 dossiers différents.

## Premiers pas

1. Ouvre l'adresse dans ton navigateur. Une fois la page chargée, elle fonctionne même sans connexion.
2. Dans la colonne de gauche, choisis le **Niveau** : 6e, 5e, 4e ou 3e.
3. Choisis ensuite le **Type d'activité**, c'est-à-dire le format de travail : discussion guidée, analyse de document, production créative ou jeu de rôle.
4. La partie centrale affiche alors les axes du programme d'anglais et les objectifs EVARS du niveau choisi.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Générer un dossier pédagogique

1. Dans **📚 Axe BO anglais**, choisis l'axe culturel de ta séquence (par exemple « Sport et société » ou « Le Royaume-Uni »).
2. Dans **💬 Objectif EVARS**, choisis l'objectif à travailler. Chacun porte une étiquette de couleur : Corps, Relation ou Société.
3. Le **✦ Générateur de séquence** s'active. Choisis ce que tu veux obtenir :

| Choix | Ce que contient le dossier |
| --- | --- |
| Activité 45 min | Contexte, objectifs, déroulé minuté de la séance dans le format choisi, consignes en anglais |
| Séquence 3-4 séances | Contexte, objectifs, organisation séance par séance (découverte, approfondissement, production, bilan), supports |
| Supports | Contexte, idées de documents à exploiter, consignes en anglais |
| Évaluation | Contexte, objectifs, tâche sommative adaptée au niveau, exemple de consigne en anglais, critères d'évaluation |

4. Appuie sur **✦ Générer le dossier pédagogique**.

Le dossier rappelle en en-tête le niveau, le niveau CECRL visé, l'axe, l'objectif EVARS et le format. Il se termine toujours par un encadré **⚠️ Points de vigilance pédagogique**, propre à chaque croisement : à lire attentivement avant de mener la séance.

## Récupérer le dossier

- **🖨 Imprimer** pour une version papier ou un PDF.
- **⎘ Copier** pour coller le texte dans ton traitement de texte ou ton cahier de textes, et l'adapter.

## Bon à savoir

EVARS Companion fonctionne entièrement hors ligne : aucune IA, aucun compte, et rien n'est enregistré ni envoyé. Les dossiers sont rédigés à l'avance pour chaque croisement entre un axe du programme d'anglais et un objectif EVARS. Ils ne sont pas conservés : pense à imprimer ou copier ton dossier avant de fermer la page.

Les dossiers sont des propositions de départ. Ils sont à relire et à adapter à ta classe, à l'âge et à la maturité des élèves, et au cadre fixé par ton établissement pour l'EVARS.

## Conseils d'utilisation

**Partir de sa séquence d'anglais.** Le plus simple est de choisir l'axe culturel que tu travailles déjà avec ta classe, puis de regarder quel objectif EVARS s'y rattache naturellement. L'EVARS vient alors enrichir la séquence, sans être plaquée.

**Lire les points de vigilance avant la séance.** Ces sujets touchent à l'intime : poser un cadre clair dès le début (respect de la parole de chacun, droit de ne pas s'exprimer, pas de témoignage personnel exigé), et rester attentif aux réactions des élèves.

**Travailler en équipe.** L'EVARS est un projet d'établissement. Il est utile d'en parler avec le CPE, l'infirmier ou l'infirmière scolaire et les collègues qui interviennent sur le même niveau, pour articuler les séances et savoir vers qui orienter un élève qui aurait besoin d'en parler.

**Choisir le bon format.** La discussion guidée et l'analyse de document conviennent bien pour ouvrir un thème ; la production créative et le jeu de rôle permettent aux élèves de s'exprimer à travers un personnage, ce qui protège leur intimité.
</script>

<script type="text/markdown" id="tuto-fabrique-de-seances">
## C'est quoi, l'Atelier de Fabrique de Séances ?

L'Atelier de Fabrique de Séances est un « bureau d'études pédagogique » pour les professeurs d'anglais de collège. Il rassemble une grande banque d'activités et de modalités de travail, classées par compétence, par moment de séance et par niveau, ainsi qu'un constructeur pour assembler et minuter une séance dynamique en quelques clics.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur.

Elle s'organise en sept onglets :

| Onglet | Ce qu'on y trouve |
| --- | --- |
| 📐 Constructeur | Le canevas pour assembler, minuter et enregistrer une séance |
| 🧩 Modalités de travail | 16 façons d'organiser la classe : binômes, îlots, jigsaw, world café, débat mouvant, escape game… |
| 🎲 Banque d'activités | 264 activités : compréhension et expression orales et écrites, interaction, médiation, jeux, théâtre |
| 🏫 Classe flexible & autonome | 18 leviers : coin lecture, plan de travail, ceintures de compétences, choice board, cercles de lecture… |
| 🧭 Phases de cours | 13 phases pour structurer une séance, du rituel d'entrée au rituel de sortie |
| 📊 Compétences par niveau | La progression indicative CECRL des 6 activités langagières, de la 6e à la 3e |
| 🗂 Mes séances | Les séances enregistrées, l'import et l'export |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. L'application s'ouvre sur le **📐 Constructeur**. Les onglets du haut donnent accès aux banques de ressources.
3. Si c'est ta première visite, fais d'abord un tour dans **🧭 Phases de cours** pour découvrir la trame de séance proposée, puis reviens au Constructeur.

Sur téléphone ou tablette, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Construire une séance (onglet Constructeur)

1. **Renseigne l'en-tête** : titre de la séance, niveau (6e, 5e, 4e, 3e ou tous niveaux) et durée cible en minutes.
2. **Écris tes objectifs** : objectif communicatif ou pragmatique 🎯, objectif linguistique 🔤 et objectif culturel 🌍.
3. **Active les phases** dont tu as besoin dans le canevas. Les 13 phases vont du rituel d'entrée au rituel de sortie, en passant par la réactivation, la mise en contexte, la découverte, la compréhension, l'injection lexicale, la conceptualisation, l'entraînement et la production. Toutes ne sont pas nécessaires à chaque séance. **✅ Tout activer** et **⬜ Tout désactiver** font gagner du temps.
4. **Choisis une activité pour chaque phase.** L'application en propose une, adaptée au moment de la séance et au niveau. Tu peux la changer, chercher une activité précise avec **Remplacer l'activité d'une phase par une recherche précise**, ou écrire ta propre activité (titre et déroulé).
5. **Vérifie le minutage** : chaque activité affiche sa durée indicative, à comparer avec ta durée cible.

Pour aller vite, **🎲 Générer une proposition** construit une séance complète en un clic, que tu peux ensuite ajuster. **🔄 Réinitialiser** retire toutes les activités choisies et les redistribue au hasard.

## Puiser dans les banques

**🎲 Banque d'activités.** Les 264 activités sont classées par compétence : compréhension de l'oral et de l'écrit, expression orale en continu et en interaction, expression écrite, médiation, jeux et théâtre. Chaque fiche indique le moment de séance, les niveaux, la durée, la modalité de travail, le matériel, le déroulé, et une piste de **dynamisation**. Par exemple, l'écoute active avec grille de repérage peut devenir un bingo à cocher.

**🧩 Modalités de travail.** 16 façons d'organiser la classe, de la classe entière au projet de groupe long, en passant par les ateliers tournants, le jigsaw, le speed dating pédagogique ou le tournoi par équipes.

**🏫 Classe flexible & autonome.** 18 dispositifs d'organisation de l'espace, d'autonomie et de différenciation, à combiner avec les activités : coin lecture, plan de travail individualisé, ceintures de compétences, protocole « 3 avant moi », cercles de lecture… Plusieurs sont pensés pour la lecture suivie d'une œuvre longue, quel que soit le livre.

**🧭 Phases de cours.** Pour chaque phase : son objectif, la part de temps conseillée, des points de vigilance, les modalités adaptées et des exemples d'activités.

**📊 Compétences par niveau.** Une synthèse indicative de la progression CECRL, de la 6e à la 3e, pour les 6 activités langagières : à ajuster selon le profil réel de chaque classe.

## Enregistrer, imprimer, partager

Une séance doit comporter au moins une phase active avec une activité pour être enregistrée, imprimée ou exportée.

- **💾 Enregistrer cette séance** la range dans l'onglet **🗂 Mes séances**, où tu peux la recharger ou la supprimer.
- **🖨 Imprimer / PDF** produit une fiche de séance à garder dans ton classeur ou à partager avec ton tuteur.
- **⬇ Exporter JSON** crée un petit fichier contenant la séance. Avec **⬆ Importer un fichier JSON**, dans Mes séances, tu peux la récupérer sur un autre ordinateur ou l'échanger avec un collègue.

À savoir : les séances enregistrées restent dans le navigateur de l'appareil utilisé. Pour les conserver durablement ou changer d'ordinateur, exporte-les en JSON ou imprime-les en PDF.

## Conseils d'utilisation

**Partir de l'objectif.** Remplis d'abord les trois objectifs de la séance, puis choisis les phases et les activités qui y mènent vraiment. La génération automatique est un bon point de départ, mais une séance cohérente se construit autour de ce que les élèves doivent savoir faire à la fin.

**Varier les modalités.** Alterner travail individuel, binômes, groupes et classe entière garde la séance dynamique. Les pistes de dynamisation de chaque activité donnent souvent l'idée qui transforme un exercice classique en moment plus engageant.

**Ne pas tout activer.** Une séance de 55 minutes ne peut pas contenir les 13 phases. Choisis-en quatre à six selon le moment de la séquence : découverte en début de séquence, entraînement et production plus tard.

**Pour les stagiaires et leurs tuteurs.** La fiche imprimée montre clairement la structure de la séance, les objectifs et le minutage : un bon support pour préparer ensemble une séance, ou pour en discuter après une observation. Le fichier JSON permet aussi au tuteur de partager une séance modèle.
</script>

<script type="text/markdown" id="tuto-grammar-arena">
## C'est quoi, Grammar Arena ?

Grammar Arena (« Level up your English! ») est une arène de combat où chaque boss incarne un point de grammaire anglaise. Avant chaque combat, l'élève s'échauffe en découvrant la règle par lui-même, puis il affronte le boss en répondant juste. Il choisit son combattant, débloque des pouvoirs, collectionne les cartes des boss vaincus et monte en niveau.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle propose 15 boss principaux, et 9 boss bonus :

| Boss | Point de grammaire | Niveau |
| --- | --- | --- |
| Inferno | Present simple | Collège |
| Frost Queen | Present continuous | Collège |
| Chronos | Past simple | Collège |
| Shadowstrike | Past continuous | Collège |
| Sir Perfecto | Present perfect | Collège / Lycée |
| Mistress Modal | Modal verbs | Collège / Lycée |
| Future Jack | Future forms | Collège |
| Lady Relativa | Relative pronouns | Collège / Lycée |
| The Comparison King | Comparatives & superlatives | Collège |
| Mr. Question | Wh- questions | Collège |
| Captain Negation | Negatives | Collège |
| The Three Forms | Irregular verbs | Collège |
| Sir Conditional | Conditionals | Collège / Lycée |
| The Preposition Genie | Prepositions | Collège |
| The Final Boss | Reported speech | Lycée |

Les boss bonus reprennent d'autres notions : present simple ou continuous, voix passive, articles, pronoms, pluriels, quantifieurs, gérondif ou infinitif, wish et if only, inversion.

## Premiers pas

1. Ouvre l'adresse dans ton navigateur, puis appuie sur **Choisir mon combattant**.
2. Choisis ton combattant parmi six : Léa, Sam, Lou, Noah, Iris… ou Le Prof. Chacun a ses qualités et son propre coup spécial.
3. Écris un pseudo si tu veux (par exemple « Captain Verbs »), puis appuie sur **Combattre avec** ton combattant. Ton profil garde ton niveau et tes victoires.
4. Choisis ton mode : **Entraînement**, à ton rythme, ou **Combat chrono**, avec 20 secondes par question.
5. Dans la liste des adversaires, filtre par **Collège** ou **Lycée**, puis choisis ton boss.

En haut de l'écran, tu retrouves ton niveau et ta barre d'expérience. Les boutons permettent de revenir à l'**Accueil**, d'ouvrir **Ma collection**, de couper ou d'activer le son, et de **changer de combattant**.

## Étape 1 : s'échauffer (découvrir la règle)

Sur la fiche d'un boss, appuie sur **S'échauffer**. Tu observes quelques phrases d'exemple, certaines **correctes**, d'autres **incorrectes**, avec une courte note (par exemple « she play the piano » → incorrect, « he / she / it → -S obligatoire »). Puis tu choisis la règle qui explique ces exemples, et tu valides avec **Valider ma réponse**. Quand tu es prêt, appuie sur **Entrer dans l'arène**. Le bouton **Voir la règle** permet aussi de la relire à tout moment.

## Étape 2 : le combat

Un combat se joue en 8 rounds. Ta barre de vie et celle du boss s'affichent en haut. Chaque round est une question, de l'un de ces quatre types :

| Type | Ce que tu fais |
| --- | --- |
| Choisis | Choisir la bonne réponse parmi quatre propositions |
| Complète | Écrire la forme qui manque dans la phrase |
| Corrige | Réécrire la phrase sans erreur |
| Transforme | Réécrire la phrase selon une consigne |

Après chaque réponse, la règle s'affiche avec un mot d'encouragement. Une bonne réponse frappe le boss, une erreur te fait perdre des points de vie. À partir de 3 bonnes réponses d'affilée, tu enchaînes un **combo** : tes coups deviennent plus forts et rapportent plus de points.

## Le coup spécial

Chaque bonne réponse remplit ta **jauge de coup spécial**. Quand elle est pleine, arme ton coup spécial, puis réponds juste : ton combattant déclenche son attaque, plus puissante qu'un coup normal (par exemple le « Solar Uppercut » ou le « Wink Tornado »). Au niveau 6, il devient encore plus fort.

## Les pouvoirs

Au fil de tes niveaux, tu débloques cinq pouvoirs, utilisables une fois par combat :

| Pouvoir | Niveau | Effet |
| --- | --- | --- |
| Indice du coach | 1 | Retire deux mauvaises réponses, ou montre le début de la réponse. La question rapporte moitié moins de points |
| Bouclier | 2 | Ta prochaine erreur ne te coûte aucun point de vie |
| Potion | 3 | Te rend 30 points de vie |
| Sablier | 4 | En combat chrono, ajoute 10 secondes au round |
| Double coup | 5 | Ta prochaine bonne réponse fait deux fois plus de dégâts |

## Progression, collection et badges

Chaque combat rapporte de l'expérience : tous les 200 points, tu montes d'un niveau. Tes titres évoluent de **Recrue** à **Légende de la grammaire**, en passant par Apprenti·e, Challenger, Combattant·e, Champion·ne et Grand·e champion·ne.

Chaque boss vaincu te donne sa **carte**, à retrouver dans **Ma collection**. Des **badges** récompensent tes exploits : premier combat gagné, combat sans faute, K.O. parfait, combo ×5, premier coup spécial, victoire en mode chrono, revanche sur un boss qui t'avait battu, règle trouvée du premier coup lors des échauffements, collection de cartes, combats bonus… et le titre de **Grammar Champion** quand tu as les 15 cartes. Certains badges débloquent des cadres pour ton profil : Or, Flamme, Glace, Holo et Royal.

Ton profil (combattant, niveau, victoires, cartes, badges) est enregistré automatiquement dans le navigateur de ton appareil. Il ne suit pas si tu changes d'appareil ou si tu effaces les données de navigation, et rien n'est envoyé sur internet.

## Conseils d'utilisation

**Pour les élèves.** Ne saute jamais l'échauffement : c'est là que tu comprends la règle avant de te battre. Commence en mode Entraînement, et lis bien la règle affichée après chaque réponse. Passe au Combat chrono quand tu te sens prêt. Si un boss te bat, prends ta revanche : il y a même un badge pour ça !

**En classe.** L'échauffement se prête très bien à un travail collectif : on projette les exemples, la classe dit ce qui est correct ou incorrect, formule une hypothèse sur la règle, puis on vérifie ensemble. Le combat peut ensuite se jouer en binômes, ou en équipes au tableau. Le Combat chrono permet de réactiver une notion en fin de séquence.

**À la maison.** L'élève peut réviser seul, à son rythme : les règles et les corrections sont expliquées en français, et sa progression est gardée d'une fois sur l'autre.
</script>

<script type="text/markdown" id="tuto-la-frise">
## C'est quoi, La Frise vivante ?

La Frise vivante est une machine à remonter le temps pour l'histoire au collège, de la Préhistoire à aujourd'hui. On fait défiler une grande frise chronologique, un compteur indique l'année où l'on se trouve, et chaque événement s'ouvre sur une courte explication. Autour de la frise, des défis, des ateliers et des fiches de révision permettent de s'entraîner.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle rassemble 128 événements, de 6e à 3e, dont 44 repères du programme à connaître, et s'organise en cinq onglets :

| Onglet | Ce qu'on y fait |
| --- | --- |
| La frise | Voyager dans le temps et ouvrir les événements |
| Défis | Cinq jeux pour s'entraîner à se repérer dans le temps |
| Ateliers | 27 activités autour des thèmes du programme, de la 6e à la 3e |
| Mes repères | Réviser les repères à connaître, comme des cartes mémoire |
| Ma frise | Ajouter ses propres événements à la frise |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur : tu arrives directement sur **La frise**.
2. Fais défiler la page : le compteur t'indique l'année où tu te trouves, de 300 000 ans avant notre ère jusqu'à aujourd'hui.
3. Les onglets du haut donnent accès aux **Défis**, aux **Ateliers**, à **Mes repères** et à **Ma frise**.
4. En haut de l'écran, deux boutons adaptent l'affichage : **Thème** pour passer du clair au sombre, et **Lecture facilitée** pour une présentation plus confortable à lire.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Voyager dans la frise

Les événements s'affichent de part et d'autre de la ligne du temps, avec une couleur par grande période. Chaque carte indique la date, le niveau de classe (6e, 5e, 4e ou 3e) et, s'il s'agit d'un repère du programme, une étiquette **repère**.

- **Zoome** avec les boutons **−** et **+** pour resserrer ou étirer la frise ; **×1** revient au zoom normal.
- **Filtre** les événements par niveau, ou n'affiche que les repères à connaître.
- **Touche une carte** pour ouvrir la fiche de l'événement : quand il s'est produit (siècle, ou « il y a… » pour la Préhistoire), le thème du programme auquel il se rattache, et une courte explication. Par exemple, la fiche du Code de Hammurabi explique que le roi de Babylone fait graver près de 300 lois sur une stèle.

## S'entraîner avec les défis

Choisis les niveaux, puis un défi. Ton meilleur score est gardé sur l'appareil.

| Défi | Ce que tu fais |
| --- | --- |
| Remets dans l'ordre | Classer cinq événements du plus ancien au plus récent |
| Avant ou après ? | Dire lequel de deux événements s'est produit en premier |
| Quel siècle ? | Retrouver le siècle à partir d'une date, en évitant les pièges |
| Quelle période ? | Ranger chaque événement dans la bonne grande période |
| Le bon repère | Retrouver la date des grands repères à connaître |

## Les ateliers

Les 27 ateliers suivent les thèmes du programme, de « La longue histoire de l'humanité » en 6e au « Monde depuis 1945 » en 3e. Chacun commence par une courte mise en situation, puis propose une activité interactive :

- **classer** des éléments dans des catégories (par exemple « Nomade ou sédentaire ? », ou « Qui vote à l'Ecclésia ? ») ;
- **remettre dans l'ordre** les étapes d'un processus ;
- **répondre à des questions** sur un document ;
- **repérer des zones** sur une carte ou une image (« Enquête dans une ville romaine ») ;
- **placer un curseur** sur une échelle.

Un court texte de conclusion fait le lien avec la frise.

## Réviser ses repères (onglet Mes repères)

Les repères du programme se révisent comme des cartes mémoire : lis l'événement, cherche sa date dans ta tête, retourne la carte, puis indique si tu la connaissais ou si elle est **À revoir**. Choisis les niveaux à réviser, et passe en mode liste pour avoir tous les repères sous les yeux. Ta progression est gardée sur l'appareil, et peut être remise à zéro.

## Créer sa propre frise (onglet Ma frise)

Ajoute tes propres événements : une date (ou une période, avec une date de début et de fin), un titre et une description, puis appuie sur **Ajouter à ma frise**. Tes événements apparaissent dans la grande frise avec l'étiquette « Ma frise », au milieu des autres. Pratique pour situer un événement étudié en cours, l'histoire de sa ville, ou une œuvre vue dans une autre matière.

## Bon à savoir

Tes scores, tes repères révisés, tes événements personnels et tes réglages sont enregistrés automatiquement dans le navigateur de l'appareil. Ils ne suivent pas si tu changes d'appareil ou si tu effaces les données de navigation. L'application n'envoie rien sur internet et ne demande aucun compte.

Les fiches de la frise sont de courtes synthèses pour se repérer : elles complètent le cours et le manuel, sans les remplacer.

## Conseils d'utilisation

**Pour les élèves.** Commence par faire défiler la frise de ton niveau pour situer ce que tu étudies en cours. Avant un contrôle, révise les repères dans **Mes repères**, puis vérifie-toi avec le défi **Le bon repère**. Les défis « Quel siècle ? » et « Avant ou après ? » sont parfaits pour ne plus se tromper sur les siècles et les dates avant notre ère.

**En classe.** On peut projeter la frise en début de chapitre pour situer la période étudiée, ou en fin de chapitre pour faire le lien avec ce qui précède. Les ateliers se prêtent bien à un travail en binômes, et les défis à un petit rituel de révision en début d'heure.

**Entre disciplines.** La frise et l'onglet **Ma frise** peuvent servir dans d'autres matières : situer une œuvre en français, en arts plastiques ou en éducation musicale, un personnage étudié en anglais, ou une découverte scientifique. C'est une belle occasion de projets communs entre collègues.

**À la maison.** L'élève peut réviser en autonomie, et les familles peuvent jouer aux défis avec lui.
</script>

<script type="text/markdown" id="tuto-le-fichier">
## C'est quoi, Le Fichier ?

Le Fichier est un outil de suivi individuel des élèves en anglais, inspiré des fiches Bristol cartonnées d'autrefois. Chaque élève a sa fiche, avec sa photo, quelques informations utiles et surtout le suivi de sa progression dans les six activités langagières du CECRL, de l'A1 au B2. On y garde aussi un journal d'observations datées et des tampons de réussite.

L'application est gratuite, sans inscription, et fonctionne dans le navigateur. Tout est enregistré sur l'appareil : rien n'est envoyé sur internet.

Chaque fiche s'organise en trois onglets :

| Onglet | Ce qu'on y trouve |
| --- | --- |
| Infos | Photo, classe, date de naissance, LV2, particularités, contact référent, notes libres |
| Progression | Le niveau dans chaque activité langagière, le niveau global, un graphique radar et l'historique des évolutions |
| Notes & tampons | Le journal d'observations datées et les tampons de réussite |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur, de préférence sur ton ordinateur ou ta tablette personnels.
2. Pour remplir le fichier rapidement, appuie sur **Importer une liste** et colle ta liste d'élèves, une ligne par élève, au format `Nom Prénom` ou `Nom Prénom, Classe`. Appuie sur **Importer** : les fiches sont créées d'un coup.
3. Tu peux aussi créer une fiche à la main avec **+ Nouvelle fiche**.
4. Les fiches s'affichent comme des cartes de catalogue. En haut, tu peux :
   - chercher un élève par son nom ;
   - filtrer par classe avec **Toutes les classes** ;
   - trier par nom, par niveau global ou par date de mise à jour.
5. Touche une carte pour ouvrir la fiche de l'élève. **Échap** ou la croix la referme.

## Remplir une fiche

En haut de la fiche, tu peux modifier le nom, choisir la classe (ou en créer une nouvelle avec **＋ Nouvelle classe…**) et ajouter une photo avec le bouton ✎.

**Onglet Infos.** Date de naissance, LV2 ou autre langue, particularités (PAP, PPRE, dys, allergies…), contact référent et notes libres. Tout s'enregistre automatiquement.

**Onglet Progression.** Pour chacune des six activités langagières, choisis le niveau atteint, de l'A1 au B2 en passant par les niveaux intermédiaires (A1+, A2+, B1+) :

| Code | Activité langagière |
| --- | --- |
| CO | Compréhension orale |
| CE | Compréhension écrite |
| EOC | Expression orale en continu |
| EOI | Expression orale en interaction |
| EE | Expression écrite |
| MED | Médiation |

Tu peux ajouter un commentaire à chaque niveau. Le **niveau global** se calcule à partir des six compétences, et un **graphique radar** montre d'un coup d'œil les points forts et les points à travailler. L'**historique des évolutions** garde la trace de chaque changement de niveau, avec sa date : on voit ainsi le chemin parcouru dans l'année.

**Onglet Notes & tampons.** Le **journal d'observations** permet de noter, date à l'appui, ce que tu remarques : une belle participation, une difficulté, un progrès. Écris ton observation, puis appuie sur **Ajouter au journal**. Les **tampons de réussite** valorisent les réussites de l'élève : écris le nom du tampon (par exemple « Premier exposé » ou « Verbes irréguliers maîtrisés »), puis appuie sur **＋ Ajouter un tampon**.

**Imprimer la fiche** produit une version papier, utile pour un conseil de classe ou une rencontre avec la famille. **Supprimer cette fiche** l'efface définitivement, après confirmation.

## Sauvegarder et protéger les données

- **Exporter** crée un fichier de sauvegarde (.json) contenant toutes les fiches.
- **Restaurer** recharge une sauvegarde. Attention : la restauration **remplace** toutes les fiches actuelles par celles du fichier.

Les fiches sont enregistrées dans le navigateur de l'appareil utilisé. Elles ne suivent pas si tu changes d'ordinateur ou si tu effaces les données de navigation : pense à exporter régulièrement, par exemple à chaque fin de trimestre.

**Le Fichier contient des données personnelles, et parfois sensibles.** Les particularités (PAP, PPRE, troubles dys, allergies) sont des informations de santé, et les photos relèvent du droit à l'image. Quelques précautions :

- utilise l'application uniquement sur un appareil personnel ou professionnel protégé par un mot de passe, jamais sur un poste partagé (salle des profs, CDI) ;
- ne note que ce qui est utile à ton enseignement, en restant factuel et bienveillant : une famille peut demander à consulter ce qui est écrit sur son enfant ;
- n'ajoute des photos que si c'est conforme aux règles de ton établissement ;
- garde les fichiers de sauvegarde en lieu sûr, et ne les partage pas ;
- en cas de doute, vérifie avec ta direction que cet usage est compatible avec les consignes de l'établissement.

## Conseils d'utilisation

**En début d'année.** Importe tes listes de classes, puis complète les fiches petit à petit. Les photos aident à retenir les prénoms, et un premier niveau estimé dans chaque activité langagière donne un point de départ pour mesurer les progrès.

**Au fil de l'année.** Quelques mots dans le journal après une séance marquante suffisent : à la fin du trimestre, tu disposes d'observations précises pour rédiger les appréciations, plutôt que de t'appuyer uniquement sur les notes. Mettre à jour les niveaux après chaque évaluation fait vivre l'historique des évolutions.

**En conseil de classe ou avec les familles.** La fiche imprimée, avec son graphique radar et ses tampons, permet de parler concrètement des points forts et des axes de progrès de l'élève. Les tampons de réussite sont aussi une belle façon de valoriser des progrès qui ne se voient pas toujours dans les moyennes.

**Avec les fiches de positionnement.** Le niveau atteint dans chaque activité langagière peut s'appuyer sur des grilles de positionnement de fin de semestre, pour garder une cohérence d'une évaluation à l'autre.
</script>

<script type="text/markdown" id="tuto-le-kit-de-survie-en-maths">
## C'est quoi, le Kit de Survie en Maths ?

Le Kit de Survie en Maths est une boîte à outils pour les maths au collège, de la 6e à la 3e. On y trouve des fiches de survie sur les notions essentielles, des méthodes pour se débloquer, des outils qui détaillent les calculs étape par étape, du calcul mental chronométré et un formulaire. Les contenus suivent le programme de cycle 3 en vigueur depuis la rentrée 2025 et le programme de cycle 4 publié au BO du 5 mars 2026.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle s'organise en cinq onglets, en bas de l'écran :

| Onglet | Ce qu'on y trouve |
| --- | --- |
| 🎒 Mon kit | 64 fiches de survie, rangées par classe et par domaine |
| 🆘 SOS | Six méthodes pas à pas pour se débloquer, et le vocabulaire qui fait peur |
| 🧰 Outils | Huit outils de calcul qui détaillent chaque étape |
| ⏱️ Automatismes | Dix questions de calcul mental chronométrées |
| 📋 Formulaire | Les formules à connaître jusqu'à sa classe |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Dans **🎒 Mon kit**, choisis ta classe : 6e, 5e, 4e ou 3e. Les fiches, les automatismes et le formulaire s'adaptent à ce choix.
3. Utilise la barre du bas pour passer d'un onglet à l'autre.
4. Le bouton ⚙️, en haut, ouvre les **Réglages** : thème clair ou sombre, taille du texte (de A− à A++) et espacement élargi pour faciliter la lecture.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Les fiches de survie (onglet Mon kit)

Les fiches de ta classe sont rangées par compartiment, un par domaine du programme :

| Domaine | Exemples de fiches |
| --- | --- |
| 🔢 Nombres et calculs | Nombres décimaux, fractions, priorités opératoires, calcul littéral |
| 📈 Proportionnalité et fonctions | Quatrième proportionnelle, pourcentages, fonctions |
| 📏 Grandeurs et mesures | Conversions d'unités, durées |
| 📐 Espace et géométrie | Angles, symétrie, Pythagore, Thalès, trigonométrie |
| 🎲 Données et probabilités | Moyenne, médiane, probabilités |
| 🧩 Pensée informatique | Instructions, boucles, programmes Scratch |

Une barre de recherche, **Chercher une notion**, permet de retrouver une fiche par un mot (« médiane », « fraction », « Thalès »…).

Chaque fiche est organisée de la même façon :

1. **L'essentiel** : les règles et définitions à retenir.
2. **Exemple guidé** : un exercice résolu pas à pas.
3. **⚠️ Piège à éviter** : l'erreur la plus fréquente (par exemple croire que 3,65 > 3,7 « parce que 65 > 7 »).
4. **💡 Mon réflexe** : l'habitude à prendre pour ne pas se tromper.
5. **Je me teste** : deux ou trois questions corrigées tout de suite.

En bas de la fiche, indique où tu en es : **À revoir**, **En cours** ou **Je maîtrise**. Les boutons **‹ Fiche précédente** et **Fiche suivante ›** permettent d'enchaîner. Le nombre de fiches maîtrisées s'affiche en haut du kit : quand tout est maîtrisé, ton sac est complet.

## Se débloquer (onglet SOS)

Six trousses de secours, avec des étapes à suivre dans l'ordre :

- 🧭 Je bloque sur un problème
- Je rédige une preuve
- Je vérifie mon résultat
- J'utilise ma calculatrice
- Je révise un contrôle
- Je lis un graphique

En dessous, **📖 Le vocabulaire qui fait peur** explique seize mots souvent mal compris : somme, différence, produit, quotient, opposé, inverse, terme, facteur, conjecture, image, antécédent, issue, évènement…

## Vérifier un calcul (onglet Outils)

Huit outils détaillent chaque résultat étape par étape : l'objectif est de recopier la **méthode**, pas seulement la réponse.

| Outil | Ce qu'il fait |
| --- | --- |
| 🍕 Fractions | Additionner, soustraire, multiplier, diviser et simplifier |
| ⚖️ Quatrième proportionnelle | Compléter un tableau de proportionnalité |
| ％ Pourcentages | Calculer un pourcentage, exprimer une proportion, appliquer une hausse ou une baisse |
| 📏 Conversions | Longueurs, aires, volumes, masses, contenances, durées |
| 🔍 Diviseurs | Diviseurs, nombres premiers, PGCD |
| 📐 Pythagore | Calculer une longueur ou vérifier qu'un triangle est rectangle |
| 📐 Trigonométrie | Calculer un côté ou un angle dans un triangle rectangle |
| 📊 Statistiques | Moyenne, médiane, étendue, quartiles d'une série |

Les outils des classes suivantes sont signalés, pour ne pas utiliser une méthode pas encore étudiée.

## S'entraîner au calcul mental (onglet Automatismes)

Dix questions de calcul mental, chronométrées, sans calculatrice. Écris un nombre (la virgule est acceptée) ou une fraction comme 3/4. À partir de la 5e, une partie des questions reprend les classes précédentes, pour entretenir ses acquis. Ton record (score et temps) est gardé pour ta classe.

## Retrouver une formule (onglet Formulaire)

Le formulaire rassemble les formules à connaître jusqu'à ta classe : périmètres, aires, volumes, contenances, vitesse, triangle rectangle, calcul littéral, évolutions en pourcentage, sphère et boule. **Voir aussi les formules des classes suivantes** permet de prendre de l'avance.

## Ta progression et tes réglages

Ta classe, l'état de tes fiches (à revoir, en cours, maîtrisée), tes records d'automatismes et tes réglages sont enregistrés automatiquement dans le navigateur de ton appareil. Ils ne suivent pas si tu changes d'appareil ou si tu effaces les données de navigation. Rien n'est envoyé sur internet.

Dans les **Réglages**, le bouton **Vider mon sac (tout recommencer)** efface toute ta progression, par exemple pour repartir de zéro à la rentrée.

## Conseils d'utilisation

**Pour les élèves.** Avant un contrôle, ouvre les fiches du chapitre, relis surtout le piège et le réflexe, puis fais le test. Quand tu bloques sur un exercice, commence par la trousse SOS « Je bloque sur un problème ». Utilise les outils pour **vérifier** un résultat que tu as d'abord cherché seul, et recopie les étapes dans ton cahier. Quelques minutes d'automatismes par jour suffisent pour rester en forme.

**En classe.** Les automatismes chronométrés font un bon rituel de début d'heure. Une fiche projetée peut servir de point d'appui pour une remédiation, en s'attardant sur le piège à éviter. Les outils pas à pas aident en autonomie, à condition de demander aux élèves de justifier chaque étape.

**En lien avec les autres disciplines.** Pourcentages, conversions, lecture de graphiques et statistiques servent aussi en sciences, en géographie ou en technologie : les fiches et les outils peuvent être utilisés par d'autres collègues.

**À la maison.** Les familles retrouvent des méthodes claires, à jour avec les programmes, pour accompagner leur enfant sans réexpliquer « à l'ancienne ».
</script>

<script type="text/markdown" id="tuto-make-me-read">
## C'est quoi, Make Me Read ?

Make Me Read t'entraîne à lire en anglais avec méthode. Tu choisis un texte à ton niveau, tu le lis avec un glossaire à portée de clic, puis tu t'exerces à une stratégie de lecture : survoler, chercher une information, déduire ce qui est sous-entendu… Un retour et des pistes t'aident à progresser.

L'application est gratuite et sans inscription, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle propose 58 textes de 3 niveaux et 6 genres :

| Niveau | Ce que ça veut dire | Textes |
| --- | --- | --- |
| A2 | Basique : phrases simples et sujets familiers | 20 |
| B1 | Intermédiaire : opinions et expérience personnelle | 20 |
| B2 | Avancé : textes complexes et abstraits | 18 |

Les genres : Fantasy, Science Fiction, Thriller & Suspense, Crime & Detective, Horror & Suspense, Contemporary Fiction. On y trouve des textes originaux, mais aussi des extraits adaptés de grands classiques (Sherlock Holmes, Frankenstein, Dracula, The Tell-Tale Heart…).

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Sur l'accueil, la bibliothèque présente les textes de deux façons : **Par niveau** (A2, B1, B2) ou **Par genre**. Choisis l'onglet qui te convient.
3. Chaque carte indique le titre, le genre, le niveau, la durée de lecture, le nombre de mots et le début du texte. Appuie sur un texte pour l'ouvrir.
4. Pour revenir à la liste, appuie sur **← Biblio** en haut de l'écran.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

Tes réglages de lecture sont enregistrés automatiquement sur ton appareil.

## Lire un texte et utiliser le glossaire

1. **Lis le texte.** En haut, tu retrouves son genre, sa source, sa durée de lecture et son nombre de mots.
2. **Touche un mot souligné** quand il te bloque. Le **Glossaire**, à côté du texte (ou en dessous sur téléphone), affiche sa prononciation, sa nature (nom, verbe…), une définition simple en anglais et un exemple. Pour certains mots concrets, une petite image s'affiche aussi.
3. Sous le glossaire, la liste **Vocabulaire clé** rassemble tous les mots importants du texte : touche-les pour revoir leur définition.

## S'entraîner avec une stratégie de lecture

Sous le texte, **Choisis une stratégie de lecture**. Chacune t'apprend une façon différente de lire :

| Stratégie | Ce que tu fais |
| --- | --- |
| 📰 Survoler | Lire vite pour comprendre le sujet général, puis le résumer en 2 ou 3 phrases |
| 🔍 Chercher | Retrouver une information précise (un nom, une date, un lieu) et dire comment tu l'as repérée |
| Déduire | Trouver ce que le texte sous-entend, et citer les indices qui te le font penser |
| Deviner les mots | Deviner le sens d'un mot grâce au contexte, avant de vérifier dans le glossaire |
| Analyser le texte | Décrire le rôle de chaque paragraphe et repérer où le ton change |
| L'auteur | Repérer un choix de l'auteur (un mot, une phrase, un détail) et son effet sur le lecteur |

Pour chaque stratégie :

1. Lis la consigne et les conseils.
2. Écris ta réponse dans la zone de texte, en français ou en anglais. Il faut au moins 5 mots pour continuer.
3. Appuie sur **Voir le feedback** : tu reçois un retour et des pistes de réflexion propres au texte.
4. Appuie ensuite sur **Voir la solution** pour comparer avec des réponses modèles.

Astuce : commence par **Survoler**, puis **Chercher**. Garde **Déduire**, **Analyser le texte** et **L'auteur** pour une deuxième lecture.

## Adapter la lecture (bouton DYS)

Le bouton **DYS**, en haut de l'écran, ouvre une barre d'outils pour lire plus confortablement. Tes choix sont gardés pour les prochaines fois.

| Outil | Effet |
| --- | --- |
| OpenDyslexic | Une police conçue pour les lecteurs dyslexiques |
| ↔ Espacement | Plus d'espace entre les lettres et les mots |
| Taille (A− / A+) | Agrandir ou réduire le texte |
| Fond | Choisir une couleur de fond moins éblouissante |
| 📏 Règle | Une bande de lecture qui suit ton doigt ou ta souris, pour ne pas perdre la ligne |
| ▮ Masque | Assombrit le reste de la page pour ne laisser visible que la zone que tu lis |
| 🌈 Syllabation | Les syllabes des mots sont mises en valeur, pour mieux les découper |

L'application ne garde pas de score : l'objectif est de lire et de comprendre, à ton rythme.

## Conseils d'utilisation

**Pour les élèves.** Choisis un texte à ton niveau dans un genre que tu aimes. Lis-le une première fois sans t'arrêter, puis fais la stratégie **Survoler**. Ne touche les mots soulignés que s'ils t'empêchent vraiment de comprendre : essaie d'abord de deviner leur sens.

**En classe.** On peut projeter un texte et travailler une stratégie ensemble, puis laisser les élèves l'appliquer seuls à un autre texte du même niveau. Il est aussi possible de différencier facilement : chaque groupe lit un texte de son niveau, avec la même stratégie, puis on met en commun. Les outils DYS rendent la lecture accessible à tous sans changer de support.

**À la maison.** L'élève peut lire en autonomie : les consignes, les retours et les solutions sont en français.

**À savoir.** L'application ne demande aucune inscription et n'enregistre que les réglages de lecture, dans le navigateur de l'appareil. Pour afficher les images du glossaire, elle interroge Wikipédia : l'appareil a donc besoin d'une connexion internet pour les voir.
</script>

<script type="text/markdown" id="tuto-mind-the-mistake">

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. La page d'accueil affiche les 22 fiches, chacune avec son numéro (01 à 22) et son titre.
3. Appuie sur la fiche qui correspond au numéro noté sur ta copie.
4. La fiche s'ouvre avec trois onglets : **Règle & exemples**, **Quiz** et **Corrige la phrase**.
5. Pour revenir aux 22 fiches, appuie sur **← Retour à la liste**.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Étape 1 : lire la règle (onglet Règle & exemples)

C'est l'onglet qui s'affiche en premier. Il contient trois parties :

- **La règle**, expliquée en français, avec les mots-clés à retenir.
- **Exemples** : des phrases fausses (✗) et leur correction (✓), pour bien voir la différence.
- **Pièges fréquents** : les erreurs que font souvent les élèves sur ce point.

Prends le temps de lire, puis compare avec la phrase de ta copie : tu dois pouvoir dire pourquoi elle était fausse. Quand tu es prêt, appuie sur **Faire le quiz →**.

## Étape 2 : vérifier sa compréhension (onglet Quiz)

1. Lis la question et choisis une réponse parmi les propositions.
2. Tu sais tout de suite si c'est juste (« Correct ! ») ou non (« Pas tout à fait »), avec une courte explication. Lis-la, même quand tu as bon.
3. Appuie sur **Question suivante**, puis sur **Voir le score** à la fin.

Ton score s'affiche avec un message :

| Score | Message |
| --- | --- |
| 100 % | Score parfait, la règle est maîtrisée |
| 75 % ou plus | Très bien, la règle est presque maîtrisée |
| 50 % ou plus | Pas mal, encore quelques révisions |
| Moins de 50 % | Encore un effort : relis la règle et retente |

Si ton score est faible, retourne dans **Règle & exemples**, puis appuie sur **Refaire le quiz**.

## Étape 3 : corriger soi-même (onglet Corrige la phrase)

Cette fois, c'est toi qui corriges. L'application te montre une phrase qui contient une erreur liée à la règle de la fiche.

1. Lis la phrase marquée ✗.
2. Réécris-la entièrement, corrigée, dans la zone « Réécris la phrase corrigée ici... ».
3. Appuie sur **Vérifier**.
4. Si c'est juste, tu vois « Correct ! ». Sinon, l'application affiche ta phrase (✗) au-dessus de la bonne réponse (✓) : compare-les mot par mot.
5. Appuie sur **Phrase suivante** pour continuer. À la fin, ton score s'affiche ; **Recommencer l'exercice** permet de refaire la série.

Bon à savoir : les majuscules et le point final ne sont pas comptés comme des erreurs. Fais quand même attention à l'orthographe de chaque mot.

## Quand tu récupères ta copie

Voici la routine à suivre pour chaque numéro noté dans la marge :

1. Repère le numéro et la phrase soulignée sur ta copie.
2. Ouvre la fiche qui porte ce numéro dans Mind the Mistake!.
3. Lis la règle, puis explique en une phrase pourquoi ta phrase était fausse.
4. Fais le quiz, puis l'exercice « Corrige la phrase ».
5. Recopie ta phrase corrigée sur ta copie ou dans ton cahier, au stylo vert si ton professeur le demande.

Astuce : si le même numéro revient sur plusieurs copies, c'est ta priorité. Refais cette fiche quelques jours plus tard pour bien la retenir.

## Pour les enseignants

**Sur les copies.** Soulignez l'erreur et notez simplement le numéro de la fiche dans la marge (par exemple 04 pour Present Perfect vs Past Simple). Le tableau des 22 codes ci-dessus peut être collé dans le cahier des élèves.

**En classe.** Une séance de remédiation de 20 à 30 minutes fonctionne bien au retour d'une évaluation : chaque élève traite ses deux ou trois numéros les plus fréquents, puis recopie ses phrases corrigées. Les élèves qui ont terminé peuvent aider un camarade sur une fiche qu'ils maîtrisent.

**En autonomie.** L'application convient aux devoirs, au CDI, à l'AP ou à devoirs faits. Un élève peut aussi la parcourir avant un contrôle pour réviser un point de grammaire.

**À savoir.** Les scores ne sont pas enregistrés : pour garder une trace, on peut demander aux élèves de noter leur score au quiz et à l'exercice à côté du numéro sur leur copie.
</script>

<script type="text/markdown" id="tuto-mochi-check">
## C'est quoi, Mochi Check ?

Mochi Check est un carnet d'auto-évaluation pour les collégiens, dans toutes les matières. Avec Mochi, un petit compagnon kawaii, l'élève fait régulièrement son « check » : il choisit une matière, dit comment il se sent, se situe sur une ou plusieurs compétences et note ce qui l'a aidé ou bloqué. Ses efforts font grandir **Mochi Village** : un petit monde avec un jardin des compétences, une maison à décorer, des missions et des lieux à débloquer grâce aux feuilles gagnées.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, idéalement sur téléphone.

Elle couvre douze domaines : français, mathématiques, anglais, LV2, histoire-géographie et EMC, SVT, physique-chimie, technologie, arts plastiques, éducation musicale, EPS, et méthodes et attitude. Pour chacun, les compétences proposées dépendent de la classe, de la 6e à la 3e.

Les quatre niveaux d'auto-évaluation correspondent à ceux du livret scolaire :

| Niveau dans l'appli | Équivalent au livret scolaire |
| --- | --- |
| 🌱 Pas encore | Maîtrise insuffisante |
| En chemin | Maîtrise fragile |
| C'est bon | Maîtrise satisfaisante |
| Je peux l'expliquer | Très bonne maîtrise |

## Premiers pas

1. Ouvre l'adresse sur ton téléphone, et ajoute-la à ton écran d'accueil pour la retrouver comme une vraie appli :
   - iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil » ;
   - Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».
2. Écris ton prénom ou un pseudo, choisis ta classe, puis ton compagnon parmi vingt animaux (chat roux, lapin, panda roux, renard, koala, licorne, hérisson…).
3. Tu arrives dans ton **village**. En haut, tu vois tes feuilles 🍃, ton nombre de checks, le bouton **✏️ Mon profil** et le bouton **?**, qui explique le fonctionnement du village.
4. La barre du bas permet de naviguer : **Village**, **Jardin**, **Missions**, **Collection** et **Maison**.

## Faire son check

Dans le village, appuie sur **🌷 Faire mon check** (tu peux aussi le lancer depuis une plante du jardin), puis :

1. **Choisis une matière** : le cours dont tu veux faire le point.
2. **Dis comment tu te sens** dans cette matière en ce moment : 😣 Galère, 😕 Bof, 😐 Ça va, 🙂 Bien ou 🤩 Au top.
3. **Situe-toi sur une ou plusieurs compétences** de ta classe (par exemple en français, en 6e : « Lire à voix haute de façon fluide » ou « Comprendre un texte et le reformuler ») : Pas encore, En chemin, C'est bon, ou Je peux l'expliquer. Sois honnête : personne ne te note ici, et dire « Pas encore », c'est le début du progrès.
4. **Écris un mot pour toi-même**, si tu veux : ce qui t'a aidé, ce qui te bloque, et ce que tu vas faire la prochaine fois.

Chaque check te rapporte des étoiles ⭐ (un peu plus si tu as écrit une note), une pochette de stickers 🎁, et une **feuille 🍃** pour ton village (une par matière et par jour). Il fait aussi grandir ta série de jours, et Mochi te donne une astuce pour la matière, par exemple en français : « Après chaque lecture, résume en 3 phrases ce que tu as compris. »

## Explorer son village (onglet Village)

La carte du village rassemble des lieux à visiter : **Ma maison**, **Mon jardin**, **Les missions** et **La boutique**. Trois autres terrains sont à débloquer avec tes feuilles : le **Bois des idées** (4 feuilles), une forêt de conseils pour apprendre, l'**Étang paisible** (7 feuilles), pour regarder le chemin parcouru, et la **Prairie fleurie** (9 feuilles). Touche un lieu pour t'y promener.

Tu gagnes des feuilles en faisant des checks, en accomplissant les étapes de tes missions et en obtenant des badges. Il n'y a ni classement, ni pénalité en cas d'absence : les récompenses encouragent les efforts, pas les notes. En bas de la carte, **Retrouver mon ancien fil de souvenirs** affiche tous tes checks, du plus récent au plus ancien.

## Mon jardin des compétences (onglet Jardin)

Choisis une matière : chaque compétence y est une plante, qui pousse selon ton dernier ressenti, de **À découvrir** à **Je maîtrise**, en passant par Je débute, J'avance et Je progresse. Ces plantes représentent ce que tu ressens, pas une note, et elles ne fanent jamais : tu peux refaire ton check quand tu veux pour les faire évoluer. Touche une plante pour revoir ton dernier ressenti ou lancer un nouveau check.

## Ma maison et la boutique (onglet Maison)

Décore ta chambre avec des objets à collectionner : plante matcha, champignon rose, livres illustrés, peluche chat, bubble tea, tipi de lecture, caneton jaune… Déplace-les avec la souris, le doigt ou les flèches, et range-les quand tu veux. La **boutique** propose quinze objets, de 2 à 7 feuilles.

## Se fixer des objectifs (onglet Missions)

Les missions sont tes petits objectifs personnels. Crée une mission en choisissant une matière (et, si tu veux, une compétence) : Mochi te propose des idées adaptées à ta classe, par exemple « Lire à voix haute 10 minutes par jour » ou « Refaire les exercices que j'ai ratés ». Choisis une échéance (dans une semaine, ou une date précise), découpe ta mission en étapes, puis coche chaque étape quand c'est fait : chacune te rapporte une feuille. Une mission accomplie rapporte aussi des étoiles et un badge.

## Collectionner (onglet Collection)

La collection rassemble les objets que tu as découverts pour ta maison, et ton **album** de stickers et de badges. Tu gagnes des **pochettes** de stickers 🎁 : une par check, une par badge, et deux par mission accomplie. Il y a 75 stickers à collectionner, communs, rares et légendaires, et un doublon te rapporte des étoiles. Les **badges** récompensent la régularité, l'honnêteté et les efforts : Premier pas, Petite flamme (3 jours d'affilée), Regard lucide (oser dire « Pas encore »), Tour du collège (toutes les matières), Objectif atteint…

## Mon profil et mes données

Le bouton **✏️ Mon profil**, en haut de l'écran, permet de changer ton prénom, ta classe ou ton compagnon. Depuis ton profil, tu retrouves aussi ton carnet d'aventures, pour **imprimer un bilan** de tes auto-évaluations (pour ton professeur ou tes parents) et faire une **sauvegarde** : un code à copier, que tu peux ensuite coller pour restaurer tes données, par exemple sur un autre appareil.

Tout est enregistré dans le navigateur de ton appareil : rien n'est envoyé sur internet. Si tu changes de téléphone ou si tu effaces les données de navigation, seule ta sauvegarde te permet de retrouver tes checks, tes missions et ton album. Attention : la décoration de ta maison et les lieux débloqués dans le village ne sont pas inclus dans ce code de sauvegarde.

## Conseils d'utilisation

**Pour les élèves.** Un check rapide après un cours ou une évaluation suffit : quelques secondes pour te situer, et une phrase pour noter ce qui t'a aidé ou bloqué. Sois honnête avec toi-même : c'est en repérant ce qui n'est « pas encore » acquis que tu sais quoi travailler. Fixe-toi un seul objectif à la fois, avec des étapes simples.

**En classe.** Quelques minutes de check en fin de séance aident les élèves à prendre du recul sur ce qu'ils viennent d'apprendre. Comme les niveaux correspondent à ceux du livret scolaire, l'auto-évaluation de l'élève peut être comparée à l'évaluation du professeur, ce qui ouvre un échange précieux. Le bilan imprimé est aussi un bon support pour un entretien individuel ou une rencontre avec la famille.

**Entre disciplines.** Toutes les matières sont couvertes, ainsi que les méthodes et l'attitude : l'outil peut être présenté par le professeur principal, et utilisé dans plusieurs cours.

**À la maison.** L'élève garde une trace de ses progrès dans toute l'année, et les objectifs l'aident à s'organiser pour réviser.
</script>

<script type="text/markdown" id="tuto-my-survival-kit">
## C'est quoi, My Survival Kit ?

My Survival Kit, c'est ta trousse de survie pour le cours d'anglais : les consignes à comprendre, les petits mots qui bloquent, les bases de grammaire et les phrases utiles pour te débrouiller à l'oral. Plus de 230 expressions, chacune avec sa traduction, un emoji et une astuce pour la retenir.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle est organisée en quatre thèmes :

| Thème | Ce qu'on y trouve |
| --- | --- |
| Classroom English | Mots d'action (circle, underline…), vie de classe, consignes à l'oral, devoirs et matériel |
| Mots qui bloquent | Mots interrogatifs, verbes courants, connecteurs, articles et quantité, l'heure, les chiffres en -teen / -ty, la date |
| Grammaire | Pronoms, temps et aspects (simple, continu, parfait), modaux, prépositions de lieu |
| Survival Phrases | Phrases de survie (« Can you repeat, please? ») et boîte à sentiments pour dire comment tu te sens |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. En haut de l'accueil, l'**Expédition du jour** te propose 5 mots tirés au hasard dans toutes les fiches.
3. Juste en dessous, ta barre d'XP indique ton niveau, et ta série de jours d'affilée.
4. Plus bas, **Choisis un thème** : appuie sur l'un des quatre thèmes pour l'ouvrir.
5. Tout en bas, **Tes badges** : touche un badge pour savoir comment le débloquer.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

Ta progression est enregistrée automatiquement sur ton appareil.

## Choisir un thème et une activité

1. Ouvre un thème, puis choisis une partie avec les onglets du haut, ou **Tout** pour travailler sur le thème entier.
2. Choisis ensuite une activité :

| Activité | Ce que tu fais |
| --- | --- |
| Fiches & tips | Lire tranquillement chaque expression, sa traduction et son astuce |
| Flashcards | Lire l'anglais, chercher la traduction dans ta tête, puis **Retourner la carte**. Réponds ensuite **😎 Facile** ou **😅 Pas encore** |
| Quiz éclair | Un QCM rapide, avec la correction après chaque réponse |
| Memory | Retrouver les paires anglais / français |
| Carte mentale | Tout le thème récapitulé en un coup d'œil. Touche une branche pour la mettre en avant |

Pour la partie **Dire l'heure**, une activité en plus t'attend : le **Cadran interactif**. Touche une heure pour voir les aiguilles bouger, consulte le mémo des expressions (o'clock, quarter past, half past…), puis entraîne-toi avec **⚡ Entraînement** : « How do you say this time in English? ».

À la fin de chaque activité, un écran te montre ton résultat et les XP gagnés. Tu peux **Recommencer** ou revenir avec **Retour à l'accueil**.

## L'expédition du jour

C'est le petit défi quotidien : 5 mots tirés au hasard dans toutes les fiches, sous forme de fiches ou de quiz. Appuie sur **Partir en expédition** et va jusqu'au bout pour gagner un bonus d'XP et garder ton feu de camp allumé, c'est-à-dire ta série de jours d'affilée.

## Suivre sa progression

Chaque activité te rapporte des XP : 2 XP par fiche vue, 5 XP par bonne réponse au quiz, 10 XP par memory terminé (et 10 de plus sans erreur), 20 XP par expédition du jour réussie. En accumulant des XP, tu montes de niveau :

| Niveau | XP nécessaires |
| --- | --- |
| 1. Apprenti des lettres | 0 |
| 2. Explorateur de mots | 50 |
| 3. Bâtisseur de phrases | 150 |
| 4. Aventurier confiant | 300 |
| 5. Champion du quotidien | 500 |
| 6. Maître de l'ABC | 800 |

Les badges sont rangés par familles :

- **Niveaux d'expédition** : ta première activité, puis chaque nouveau niveau.
- **Artefacts** : toutes les fiches d'un thème vues, un quiz ou un memory sans faute sur un thème.
- **Carnet de bord** : revenir 3, 5, 7, 14 ou 30 jours d'affilée.
- **Épreuves** : des séries de bonnes réponses au quiz, des memory parfaits, 10 parties de memory.
- **Expéditions** : 5, 10 ou 25 expéditions du jour réussies.

## Conseils d'utilisation

**Pour les élèves.** Commence par **Classroom English** et **Survival Phrases** : ce sont les expressions dont tu as besoin dès le premier cours. Fais l'expédition du jour chaque soir, en quelques minutes : c'est la meilleure façon de garder ton feu de camp allumé, et de retenir les mots sans t'en rendre compte.

**En classe.** En début d'année, l'application aide à installer les consignes et les phrases de survie : quelques minutes de flashcards ou de quiz éclair en début de cours suffisent. Quand une consigne bloque, on peut renvoyer l'élève vers la bonne fiche. La boîte à sentiments est aussi un bon point de départ pour un rituel d'accueil (« How do you feel today? »).

**À la maison.** Chaque expression a sa traduction et une astuce en français : les parents peuvent faire réviser leur enfant sans parler anglais.

**À savoir.** Aucune donnée n'est envoyée sur internet : tout reste dans le navigateur de l'appareil. Si l'élève change d'appareil ou efface les données de navigation, sa progression ne suit pas.
</script>

<script type="text/markdown" id="tuto-objectif-devoirs">
## C'est quoi, Objectif devoirs ?

Objectif devoirs t'aide à organiser ton travail à la maison, à savoir comment t'y prendre et à réviser. Tout est réuni dans une seule application, gratuite, sans inscription ni collecte de données.

L'application s'organise en cinq onglets, en bas de l'écran :

| Onglet | À quoi il sert |
| --- | --- |
| Planning | Noter tes devoirs et lancer un minuteur de travail |
| Fiches aide | Trouver une méthode pour chaque matière |
| Je révise | Flashcards, quiz et tes propres cartes de révision |
| MindMap | Créer des cartes mentales |
| Profil | Ton prénom, ton niveau, tes badges et ta série de jours |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur, sur ordinateur, tablette ou téléphone.
2. Va dans l'onglet **Profil** et écris ton prénom dans le champ « Ton prénom ». Tu peux aussi choisir la couleur de ton avatar.
3. Si tu lis plus facilement avec une police adaptée, appuie sur le bouton **Dys** en haut de l'écran.
4. Sur téléphone, ajoute l'application à ton écran d'accueil pour la retrouver comme une vraie appli :
   - iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
   - Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

Ton travail est enregistré automatiquement sur ton appareil. Utilise toujours le même appareil et le même navigateur pour retrouver tes devoirs et ta progression.

## Noter ses devoirs (onglet Planning)

1. Choisis la **matière** concernée.
2. Écris ce qu'il faut faire dans le champ « Description » (par exemple : Exercice 5 p.42).
3. Sous « Pour le jour », sélectionne le jour où le devoir est à rendre.
4. Appuie sur **Ajouter**.

Tes devoirs s'affichent dans la liste de la semaine. Quand un devoir est terminé, coche-le : un petit message t'encourage et tu gagnes des points d'expérience (XP).

Astuce : note tes devoirs le jour même, dès que tu rentres du collège. Commence ensuite par ce qui est à rendre le plus tôt.

## Travailler avec le minuteur Pomodoro

La méthode Pomodoro consiste à travailler concentré pendant un temps court, puis à faire une vraie pause. Le minuteur se trouve dans l'onglet **Planning**.

1. Choisis une durée de travail : **25 min**, **45 min**, **1h**, ou une durée personnalisée.
2. Appuie sur **Démarrer**. Pendant ce temps, téléphone retourné et une seule tâche à la fois.
3. Quand le temps est écoulé, lance **Pause 5** (5 minutes). Après plusieurs séances, prends une pause plus longue avec **Pause 15**.
4. Les boutons **Pause** et **Reset** permettent d'interrompre ou de remettre le minuteur à zéro.

Conseil : en 6e et 5e, 25 minutes suffisent largement. Augmente la durée petit à petit si tu te sens à l'aise.

## Trouver une méthode (onglet Fiches aide)

L'onglet **Fiches aide** contient 114 fiches méthode. Elles ne refont pas le cours : elles t'expliquent comment t'y prendre.

1. Choisis une matière : maths, français, anglais, espagnol, SVT, physique-chimie, histoire-géo et EMC, technologie, arts plastiques, éducation musicale ou EPS.
2. Appuie sur la fiche qui correspond à ton devoir (par exemple « Pourcentages », « Rédiger un texte » ou « Temps verbaux anglais »).
3. Lis les étapes et les conseils, puis applique-les à ton exercice.
4. Utilise **← Retour** pour revenir à la liste.

Certaines fiches sont utiles dans toutes les matières : organiser ses devoirs, prendre des notes, mémoriser efficacement, la veille d'un contrôle, la stratégie le jour du contrôle. Lis-les en premier si tu ne sais pas par où commencer.

## Réviser (onglet Je révise)

L'onglet **Je révise** propose quatre espaces : Flashcards, Quiz, Mes cartes et Progrès.

**Flashcards.** Choisis un paquet, par exemple les verbes irréguliers anglais. Lis la question, essaie de répondre dans ta tête, puis retourne la carte. Appuie sur **Je savais** si tu avais la bonne réponse, ou sur **À revoir** dans le cas contraire. Reviens surtout sur les cartes à revoir.

**Quiz.** Choisis une matière, puis réponds aux questions à choix multiples. La bonne réponse s'affiche tout de suite. Appuie sur **Suivant** pour continuer, et sur **Rejouer** pour recommencer.

**Mes cartes.** Crée tes propres cartes de révision : écris une question et sa réponse, puis appuie sur **Ajouter**. C'est idéal pour le vocabulaire, les dates ou les définitions de ta leçon.

**Progrès.** Retrouve le bilan de tes révisions.

Astuce : mieux vaut réviser 10 minutes plusieurs jours de suite qu'une heure la veille du contrôle.

## Créer une carte mentale (onglet MindMap)

Une carte mentale résume une leçon autour d'une idée centrale. C'est très efficace pour mémoriser.

1. Appuie sur **+ Nouvelle** et donne un nom à ta carte (par exemple : Photosynthèse).
2. Sélectionne une bulle, puis :
   - **+ Enfant** ajoute une idée qui dépend de la bulle sélectionnée ;
   - **+ Même niveau** ajoute une idée à côté, au même niveau ;
   - **Modifier** change le texte et la couleur de la bulle ;
   - **↑ Parent** remonte à la bulle du dessus ;
   - **Supprimer** (corbeille) efface la bulle sélectionnée.
3. Utilise une couleur par grande partie de la leçon : ta carte sera plus lisible.
4. Appuie sur **PNG** pour enregistrer ta carte en image, à imprimer ou à envoyer.

Tes cartes restent rangées dans « Mes cartes mentales » ; appuie sur **Ouvrir** pour en reprendre une.

## Suivre sa progression (onglet Profil)

Chaque devoir terminé, chaque quiz et chaque révision te rapporte des XP. En accumulant des XP, tu montes de niveau :

| Niveau | XP nécessaires |
| --- | --- |
| Recrue | 0 |
| Apprenti·e | 100 |
| Étudiant·e | 250 |
| Expert·e | 500 |
| Champion·ne | 1000 |

Le Profil affiche aussi ta **série** : le nombre de jours d'affilée où tu as travaillé (🔥), ainsi que les badges que tu as débloqués. Essaie de ne pas casser ta série !

Attention : le bouton **Réinitialiser tout** efface définitivement tes devoirs, tes cartes et ta progression. Ne l'utilise que si tu veux vraiment repartir de zéro.

## Pour les enseignants et les familles

**En classe.** Une courte présentation de 15 minutes suffit : faire créer le profil, ajouter un vrai devoir, ouvrir une fiche de sa matière. On peut ensuite renvoyer vers une fiche précise en écrivant son titre au tableau ou dans le cahier de textes.

**En accompagnement.** En devoirs faits ou en AP, l'élève choisit une fiche méthode, l'applique à son exercice, puis termine par 10 minutes de flashcards ou de quiz.

**À la maison.** Les parents peuvent demander à l'enfant de leur montrer son planning de la semaine, ou de leur expliquer une carte mentale qu'il a créée. C'est souvent un bon point de départ pour parler du travail sans tension.

**À savoir.** Aucune donnée n'est envoyée sur internet : tout reste dans le navigateur de l'appareil utilisé. Si l'élève change d'appareil ou efface les données de navigation, sa progression ne suit pas.
</script>

<script type="text/markdown" id="tuto-past-masters">
## C'est quoi, Past Masters ?

Past Masters transforme les verbes irréguliers anglais en créatures à collectionner, les **Morphs**. Chaque Morph est un verbe : on le capture en donnant sa base, puis on le fait évoluer en retrouvant son prétérit et son participe passé. Les Morphs capturés reviennent ensuite à intervalles espacés pour être mémorisés durablement, et peuvent combattre dans l'arène.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle rassemble 96 verbes irréguliers, répartis selon la classe (5e, 4e, 3e), et rangés en 17 familles qui partagent la même façon de changer, chacune avec son astuce mnémotechnique :

| Famille | Modèle | Exemple |
| --- | --- | --- |
| Roc | A = A = A | cut → cut → cut |
| Écho | -ought / -aught | bring → brought → brought |
| Courant | finale en -t | keep → kept → kept |
| Boomerang | A B A | come → came → come |
| Mélodie | i → a → u | sing → sang → sung |
| Vent | -ew → -n | grow → grew → grown |
| Givre | o → o + en | speak → spoke → spoken |
| Tempête | i → o → i + en | write → wrote → written |
| Marée | -ake → -ook → -aken | take → took → taken |
| Légende | A B C | go → went → gone |

S'y ajoutent les familles Paye (pay → paid), Conteur (sell → sold), Debout (stand → stood), Solitaire, Morsure (bite → bit → bitten), Épine (wear → wore → worn) et Don (give → gave → given).

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Écris ton prénom ou un pseudo, puis choisis **ta classe** : 5e, 4e ou 3e. Elle fixe la liste des verbes à collectionner ; tu pourras la changer plus tard.
3. Choisis ton Morph de départ.
4. Les cinq onglets du bas permettent de naviguer : **Explorer**, **Morphdex**, **Labo**, **Arène** et **Dresseur**.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Capturer des Morphs (onglet Explorer)

Choisis une zone : une par type de Morph, ou toutes les zones mélangées. Un Morph sauvage apparaît avec la traduction française du verbe : donne sa **base** en anglais pour le capturer (par exemple « couper » → cut). Un bouton 🔊 fait entendre la prononciation anglaise.

## Retrouver ses Morphs (onglet Morphdex)

Le Morphdex rassemble tous les Morphs de ta classe. Filtre-les par type, par famille ou par statut (capturé, à capturer), ou cherche un verbe. Touche un Morph pour voir ses trois formes, sa traduction et l'astuce de sa famille.

## Faire évoluer et mémoriser (onglet Labo)

Chaque Morph a trois stades, qui correspondent aux trois formes du verbe : **Base**, **Évolution 1** (le prétérit) et **Évolution 2** (le participe passé). Dans le Labo, retrouve la forme demandée pour faire évoluer ton Morph.

Ensuite, les Morphs reviennent pour des **rappels**, à intervalles de plus en plus longs, jusqu'à trois semaines. Un rappel réussi au stade final et le Morph est **maîtrisé**. C'est le principe de la répétition espacée : revoir un verbe juste au moment où on allait l'oublier.

## Combattre (onglet Arène)

Forme une équipe avec tes Morphs et affronte un adversaire : chaque attaque est une question sur un verbe, et une bonne réponse permet aussi de **parer** les attaques ennemies. Trois niveaux :

| Niveau | Ce que tu fais |
| --- | --- |
| Entraînement | Choisir la réponse parmi quatre propositions, en 20 secondes |
| Défi | Taper la réponse, en 15 secondes |
| Championne Lexa | Ses Légendaires sont au stade final. Tu tapes la réponse en 10 secondes |

## Ton profil de dresseur (onglet Dresseur)

Cet onglet affiche ton niveau, tes XP, tes victoires et tes badges, classés en cinq catégories : collection, familles au complet, évolution et mémoire, arène, régularité et défis. Tu peux y changer de classe, choisir de répondre en tapant ou par choix multiple, activer ou couper la lecture audio, et exporter un code de sauvegarde pour retrouver ta collection sur un autre appareil.

## Bon à savoir

Ta collection, tes évolutions, tes rappels et tes badges sont enregistrés automatiquement dans le navigateur de ton appareil. Ils ne suivent pas si tu changes d'appareil ou si tu effaces les données de navigation : pense au code de sauvegarde de l'onglet Dresseur. Rien n'est envoyé sur internet.

La prononciation utilise la voix anglaise installée sur ton appareil. Si aucune voix n'est disponible, l'écoute ne fonctionne pas, mais tout le reste oui.

## Conseils d'utilisation

**Pour les élèves.** Une petite session par jour vaut mieux qu'une longue de temps en temps : capture quelques Morphs, fais tes évolutions, et ne rate pas les rappels du Labo. Apprends les verbes par famille plutôt qu'un par un : une seule astuce t'aide à en retenir plusieurs. Écoute la prononciation et répète à voix haute.

**En classe.** L'Arène, en mode Entraînement, fait un bon rituel de début de cours, projetée au tableau. Les familles et leurs astuces peuvent servir de point de départ à une séance sur les verbes irréguliers : on fait découvrir le modèle, puis chacun capture les Morphs de cette famille. Pour aller plus loin, on peut organiser un défi de classe contre la Championne Lexa.

**Avec Verb Dojo.** Les deux applis se complètent : Verb Dojo pour s'entraîner avec des quiz et un memory, Past Masters pour mémoriser durablement grâce aux rappels espacés et à la collection.
</script>

<script type="text/markdown" id="tuto-mind-the-sound">
## C'est quoi, Mind the Sound! ?

Mind the Sound! (« Beatbox City ») est une aventure de prononciation anglaise, sur le même principe que Mind the Mistake! pour l'écrit. Après une production orale, le professeur note un **code court** (par exemple **P11**) pour signaler une erreur de prononciation. L'élève saisit ce code dans l'application et part en mission : il écoute, découvre la règle par lui-même, la comprend, s'entraîne, puis peut s'enregistrer pour comparer son essai au modèle.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone. Les enregistrements restent sur l'appareil et ne sont envoyés nulle part.

Elle propose 32 codes, répartis dans les quatre quartiers de Beatbox City :

| Quartier | Contenu | Codes | Exemples |
| --- | --- | --- | --- |
| Vowel Street | Voyelles et diphtongues | P01 à P10 | ship / sheep, full / fool, le schwa /ə/ |
| Consonant Corner | Consonnes et articulation | P11 à P20 | think / sink, hat / at, vine / wine |
| Rhythm Square | Terminaisons -ED et -S | P21 à P26 | walked, played, wanted ; likes, plays, watches |
| Intonation Avenue | Rythme et intonation | P27 à P32 | a PREsent / to preSENT, formes faibles, intonation des questions, liaisons |

Chaque code indique un niveau indicatif : A1, A2 ou B1.

## Premiers pas

1. Ouvre l'adresse dans ton navigateur : tu arrives dans **La ville**, avec ses quatre quartiers.
2. Si ton professeur t'a donné un code, tape-le dans la recherche (par exemple **P11**) et appuie sur Entrée : la mission correspondante s'ouvre. Tu peux aussi chercher un son ou un mot (« TH », « ship »…).
3. Sinon, choisis un quartier et une mission, puis appuie sur **Découvrir →**.
4. La barre de navigation donne accès à trois espaces : **La ville**, **Mes progrès** et **Codes prof**.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Une mission en cinq étapes

Chaque mission suit les mêmes étapes, avec un membre de l'équipe pour te guider : Echo le chien, Maya ou Jay.

1. **Listen (Écoute).** Écoute les deux mots ou les deux phrases de la mission (par exemple think et sink) autant de fois que tu veux, et cherche une différence, sans regarder la règle.
2. **Discover (Découvre).** Réponds à une question qui t'aide à trouver la règle par toi-même. Par exemple : « Dans sheep, le son au milieu est… plus court et relâché, plus long et plus tendu, ou identique à celui de ship ? » Si tu te trompes, réécoute : la réponse se trouve dans la différence que tu entends.
3. **Understand (Comprends).** La règle s'affiche, avec un conseil pour placer ta langue, tes lèvres ou ta voix. Par exemple : « Pour /iː/, étire un peu les lèvres et la voyelle. Pour /ɪ/, relâche la langue et prononce plus brièvement. »
4. **Practise (Entraîne-toi).** Écoute un mot caché, puis choisis celui que tu as entendu. Pour l'accent de phrase, choisis le mot à accentuer selon l'intention de celui qui parle (« Tu veux corriger la COULEUR du stylo »).
5. **Record (Enregistre-toi).** Si tu le souhaites, enregistre-toi, réécoute ton essai et compare-le au modèle. Appuie sur **● Recommencer** pour refaire un essai.

À la fin, Echo te félicite, et la mission est marquée **✓ Mission terminée**.

## Suivre ses progrès (onglet Mes progrès)
