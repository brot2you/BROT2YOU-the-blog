Les cartes sont des fiches (295), des quiz (276), des méthodes (46), des pièges (9), des repères (5) et des conseils (2). L'application s'organise en quatre onglets : **Fil**, **Explorer**, **Évals** et **Moi**.

## Premiers pas

1. Ouvre l'adresse sur ton téléphone, puis ajoute-la à ton écran d'accueil pour la retrouver comme une vraie appli :
   - iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil » ;
   - Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».
2. Au premier lancement, choisis **ta classe** : 6e, 5e, 4e ou 3e. Les cartes, les évaluations et le niveau visé s'adaptent à ce choix.
3. Tu peux aussi ajouter les **années d'avant**, pour revoir ce que tu as appris les années précédentes, ou rester sur ta seule classe.
4. La barre du bas permet de passer d'un onglet à l'autre : **Fil**, **Explorer**, **Évals** et **Moi**.

Tu pourras changer de classe à tout moment, depuis l'onglet **Moi**.

## Faire défiler le Fil

Le Fil présente une carte par écran, adaptée à ta classe. En haut, des étiquettes permettent de choisir un thème (Grammaire, Vocabulaire, Prononciation, Culture, Comprendre, S'exprimer, Méthode), ou de tout garder. Les mots en anglais peuvent être écoutés avec une voix anglaise.

Sur le côté de chaque carte, trois boutons :

| Bouton | À quoi il sert |
| --- | --- |
| ❤ J'aime | Garder une trace des cartes que tu as trouvées utiles |
| 🔖 À revoir | Mettre la carte de côté pour la réviser plus tard |
| Partager | Copier ou envoyer la carte à quelqu'un |

Les **quiz** se jouent directement dans le fil, avec la correction et une courte explication. Une erreur envoie la carte dans « À revoir ». Quand tu as vu toutes les cartes de ta classe, le fil recommence avec celles que tu n'as pas encore comprises.

## Chercher une notion (onglet Explorer)

Tape un mot (par exemple « present perfect », « irregular verbs » ou « Thanksgiving ») ou filtre par thème. Chaque carte indique si elle est **✓ acquise** ou **à revoir**.

## Se préparer aux évaluations (onglet Évals)

L'onglet rappelle le niveau visé en fin d'année pour ta classe (par exemple A1+ en 6e), puis présente les formats d'évaluation, un par activité langagière :

| Évaluation | Durée d'entraînement |
| --- | --- |
| Compréhension de l'oral | 25 min |
| Compréhension de l'écrit | 30 min |
| Expression écrite | 35 min |
| Prendre la parole en continu | 15 min |
| Interaction orale | 15 min |
| Médiation | 20 min |
| Oral du brevet, partie en anglais (3e) | 15 min |

Pour chacune : ce qu'on attend de toi, les étapes de la méthode, les erreurs qui coûtent des points, et un bouton **Lancer le chrono d'entraînement** qui te guide partie par partie (par exemple pour la compréhension de l'oral : découvrir le document, première écoute, prise de notes, détails, compte rendu). Un compte à rebours indique le nombre de jours avant les vacances d'été, ou avant le brevet en 3e.

## S'entraîner et suivre ses progrès (onglet Moi)

**Le défi chrono.** 10 questions de 20 secondes sur le programme de ta classe. Il faut 8 bonnes réponses sur 10 pour valider. Chaque erreur part dans « À revoir ».

**La révision du jour.** Les cartes « À revoir » reviennent le lendemain, puis après 3, 7, 15 et 30 jours si tu les réussis. Avant de retourner une carte, dis à voix haute ou écris ce que tu sais.

**Ton profil.** Choisis un pseudo, suis tes XP et ton niveau (de « Nouveau compte » à « Légende de l'anglais »), ta série de jours d'affilée et le nombre de cartes acquises. Tu peux aussi **te positionner** dans chaque activité langagière, de l'A1 au B1+, pour voir où tu en es par rapport au niveau visé.

**Les réglages.** Change de classe, ajoute ou retire les années d'avant, choisis l'accent de la voix et sa vitesse, active une police adaptée à la dyslexie, agrandis le texte, et bascule entre l'ambiance jour et l'ambiance nuit.

## Bon à savoir

Ta progression (classe, pseudo, XP, cartes aimées et à revoir, défis, positionnement, réglages) est enregistrée automatiquement dans le navigateur de ton téléphone. Elle ne suit pas si tu changes d'appareil ou si tu effaces les données de navigation. Il n'y a pas de compte, et rien n'est envoyé sur internet.

La voix anglaise est celle installée sur ton appareil : son accent et sa qualité peuvent varier d'un téléphone à l'autre. Si aucune voix anglaise n'est disponible, l'écoute ne fonctionne pas, mais tout le reste oui.

## Conseils d'utilisation

**Pour les élèves.** Quelques minutes par jour suffisent : commence par la révision du jour, puis fais défiler le fil dans le thème que tu veux renforcer. Écoute les mots à voix haute et répète-les. Avant une évaluation, ouvre sa fiche dans l'onglet **Évals** et fais un entraînement avec le chrono pour apprendre à gérer ton temps.

**En classe.** Une carte projetée en début de cours fait un bon rituel de réactivation, et le défi chrono peut se jouer collectivement. Les fiches de l'onglet Évals aident à présenter le format d'une évaluation avant de la faire passer, et le chrono d'entraînement peut rythmer une séance de préparation. Le positionnement dans les activités langagières ouvre aussi un échange sur les progrès de chacun.

**Avec les années d'avant.** Activer les années précédentes est utile en début d'année, ou pour un élève qui a des lacunes : il retrouve les bases sans changer d'outil.

**À la maison.** Les familles peuvent jouer au défi chrono avec leur enfant, ou lui demander d'expliquer une carte en français : pas besoin de parler anglais pour aider.

<script type="text/markdown" id="tuto-the-english-sequence">
## C'est quoi, The English Sequence ?

The English Sequence (« Tea · Toast · Teaching ») est un atelier propulsé par l'intelligence artificielle pour les professeurs d'anglais du collège et du lycée. On choisit son niveau, ses axes culturels, ses activités langagières et sa tâche finale, et l'IA propose une séquence complète : objectifs, séances détaillées, tâches intermédiaires, tâche finale et critères d'évaluation. Un second outil génère une planification annuelle en progression spiralaire.

L'application est gratuite et fonctionne dans le navigateur. Elle s'organise en cinq pages :

| Page | Ce qu'on y trouve |
| --- | --- |
| Atelier | Le générateur de séquences |
| Année | Le générateur de planification annuelle, en progression spiralaire |
| Bibliothèque | Six séquences modèles, de la 6e à la terminale, pour s'inspirer |
| Programmes | Les axes culturels et les niveaux CECRL visés, niveau par niveau |
| À propos | Le fonctionnement de l'outil, ses références et ses limites |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur : tu arrives sur l'**Atelier**.
2. Le menu du haut donne accès aux cinq pages : **Atelier**, **Année**, **Bibliothèque**, **Programmes** et **À propos**.
3. Si tu découvres l'outil, commence par parcourir la **Bibliothèque** : elle montre à quoi ressemble une séquence, avec son axe, son nombre de séances et sa tâche finale.

Une connexion internet est nécessaire : les séquences sont générées en ligne par l'intelligence artificielle.

## Générer une séquence (page Atelier)

Le formulaire se remplit de haut en bas. Presque toutes les rubriques acceptent plusieurs choix.

| Rubrique | Ce que tu choisis |
| --- | --- |
| Niveau(x) | De la 6e à la terminale. Le niveau CECRL visé s'affiche selon le niveau et le statut de la langue (LVA, LVB…) |
| Durée | La longueur de la séquence |
| Axes culturels | Les axes du programme pour le niveau choisi |
| Thème ou notion précise | Une ou plusieurs notions, séparées par des virgules |
| Activités langagières prioritaires | CO, CE, EOC, EOI, EE, médiation |
| Type(s) de tâche finale | Écrite, créative, orale, interaction, audiovisuelle, médiation, projet collaboratif, eTwinning… |
| Supports souhaités | Presse, extrait littéraire, discours, documentaire, film, série, chanson, image, podcast, BD, réseaux sociaux… |
| 🎲 Modalités de travail | Binômes, groupes, jigsaw, think-pair-share, îlots, ateliers tournants, classe inversée, projet… |
| Compétences psychosociales | Empathie, coopération, pensée critique, confiance en soi… |
| Parcours éducatifs | Avenir, santé, citoyen, PEAC |
| Contraintes spécifiques | Facultatif : tout ce que l'IA doit prendre en compte (nombre d'heures, matériel, profil de la classe…) |

Appuie ensuite sur **Générer la séquence**. L'IA propose une séquence complète : objectifs, séances détaillées, tâches intermédiaires, tâche finale et critères d'évaluation. Tu peux ensuite l'adapter, l'imprimer ou l'exporter en PDF.

Astuce : plus tes choix sont précis (une notion claire, une ou deux activités langagières prioritaires, une seule tâche finale), plus la proposition sera cohérente. Les contraintes spécifiques permettent de décrire ta classe en quelques mots, sans jamais nommer d'élève.

## Planifier l'année (page Année)

Cet outil génère une progression annuelle dite « spiralaire » : chaque fait de langue, champ lexical et phénomène phonologique est introduit à un moment précis, puis repris plusieurs fois dans des contextes nouveaux, de façon de plus en plus complexe.

1. Choisis le niveau, le statut de la langue, le niveau CECRL de départ et le niveau visé.
2. Indique le nombre de séquences de l'année.
3. Coche les axes culturels à couvrir. L'application conseille de tous les sélectionner pour une couverture annuelle complète.
4. Ajoute si tu le souhaites un fil rouge annuel et tes priorités ou contraintes.
5. Appuie sur **Générer la planification annuelle**.

## S'inspirer (page Bibliothèque)

La Bibliothèque propose six séquences modèles, avec leur niveau CECRL, leur axe, leur nombre de séances et leur tâche finale : A Day at a British School (6e-5e), Around the World in 80 Days (4e-3e), Voices of the Civil Rights Movement (3e-seconde), Fake News & Digital Citizens (seconde-première), Welcome to the Dystopia (première-terminale) et Can Machines Be Moral? (terminale).

## Ce qu'il faut savoir

**Les séquences sont produites par une IA.** L'application le rappelle elle-même : ce sont des points de départ, pas des fiches officielles. Relis chaque proposition, vérifie que les supports cités existent et sont adaptés à ton public, et ajuste les modalités et l'évaluation à ta classe.

**Vérifie les références aux programmes.** Pour le collège, la page Programmes reprend les axes culturels et les niveaux CECRL des programmes de 2025. Pour le lycée, compare toujours les axes proposés avec les programmes officiels publiés sur Éduscol avant de t'en servir dans une progression.

**Tes choix sont envoyés à un service d'IA en ligne** pour produire la séquence. N'écris jamais de nom d'élève ou d'informations personnelles dans les contraintes spécifiques : décris la classe de façon générale (« classe hétérogène de 4e, deux élèves dys »).

## Conseils d'utilisation

**Partir de sa propre idée.** Le plus efficace est d'avoir déjà en tête l'axe, la notion et la tâche finale, puis de laisser l'IA proposer un déroulé. On compare ensuite avec ce qu'on aurait fait soi-même, et on garde le meilleur des deux.

**Générer plusieurs propositions.** Changer un seul paramètre (le type de tâche finale, les supports, la modalité de travail) permet d'obtenir des variantes et de choisir celle qui convient le mieux à la classe.

**Pour les stagiaires et leurs tuteurs.** Une séquence générée peut devenir un support d'analyse : est-elle cohérente avec la tâche finale ? Les tâches intermédiaires y préparent-elles vraiment ? Les supports sont-ils accessibles au niveau visé ? C'est aussi une bonne occasion de développer un regard critique sur les propositions d'une IA.

**En début d'année.** La page Année peut servir de base pour construire sa progression, à confronter ensuite aux programmes officiels et aux choix de l'équipe disciplinaire.
</script>

<script type="text/markdown" id="tuto-verb-dojo">
## C'est quoi, Verb Dojo ?

Verb Dojo t'aide à maîtriser les verbes irréguliers anglais, comme un entraînement d'arts martiaux : tu comprends la règle, tu t'entraînes, et tu progresses de niveau en niveau. L'application contient 92 verbes irréguliers, avec leur traduction et leur prononciation.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle s'organise en six onglets :

| Onglet | À quoi il sert |
| --- | --- |
| 🏠 Accueil | Ton niveau, tes XP, ta série de jours et des raccourcis vers les activités |
| 📖 Règles | Comprendre les trois formes d'un verbe et les quatre familles |
| 📋 Liste | Les 92 verbes, avec recherche, filtre par famille et prononciation |
| 🧠 Memory | Retrouver les paires de cartes |
| 🎯 Quiz | Cinq modes d'entraînement |
| 🏆 Progression | Ton niveau, tes résultats par famille et tes badges |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Sur l'**Accueil**, trois boutons te lancent directement : **🎯 Lancer un quiz**, **🧠 Jouer au memory** et **📖 Voir les règles**. Si c'est la première fois, commence par les règles.
3. Les onglets en haut de l'écran te permettent de passer d'une activité à l'autre à tout moment.
4. En haut à droite, tu vois toujours ton niveau, tes XP et ta série de jours (🔥).

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

Ta progression est enregistrée automatiquement sur ton appareil. Utilise toujours le même appareil et le même navigateur pour la retrouver.

## Comprendre la règle (onglet Règles)

Un verbe irrégulier a trois formes à connaître :

- **V1, la base** : au présent et après will, can, to… (I go, to go, I will go).
- **V2, le prétérit** : pour une action terminée dans le passé (Yesterday, I went to school).
- **V3, le participe passé** : avec have / has (present perfect) et à la voix passive (I have never gone there).

Pour retenir plus facilement, l'application range les verbes en quatre familles, selon les formes qui se ressemblent :

| Famille | Ce qui se passe | Exemple | Nombre de verbes |
| --- | --- | --- | --- |
| AAA | Les 3 formes sont identiques | cut – cut – cut | 12 |
| ABA | La base et le participe passé sont identiques | come – came – come | 3 |
| ABB | Le prétérit et le participe passé sont identiques | buy – bought – bought | 40 |
| ABC | Les 3 formes sont toutes différentes | go – went – gone | 37 |

Astuce : apprends les verbes par famille plutôt que dans l'ordre alphabétique, et répète-les à voix haute, en rythme : « go, went, gone ».

## Consulter les verbes (onglet Liste)

La liste affiche les 92 verbes avec leurs trois formes et leur traduction.

- Tape un mot dans la barre de recherche pour trouver un verbe en anglais ou en français.
- Utilise les filtres pour n'afficher qu'une famille (AAA, ABA, ABB ou ABC).
- Appuie sur 🔊 pour entendre la prononciation.

## Jouer au memory (onglet Memory)

1. Choisis la taille de la grille : **6**, **8** ou **12 paires**.
2. Retourne deux cartes : il faut associer un verbe de base à sa paire prétérit / participe passé.
3. Si les deux cartes vont ensemble, elles restent visibles. Sinon, elles se retournent : essaie de te souvenir de leur place.
4. Quand la grille est terminée, ton nombre de coups et d'erreurs s'affiche. **🔄 Nouvelle partie** relance une grille.

Chaque paire trouvée rapporte 5 XP, une grille terminée 15 XP de plus, et une grille sans aucune erreur encore 15 XP de bonus (« Mémoire parfaite 💎 »).

## S'entraîner (onglet Quiz)

Choisis un mode d'entraînement. Les questions s'enchaînent toutes seules, avec la correction immédiate.

| Mode | Ce que tu fais | XP par bonne réponse |
| --- | --- | --- |
| QCM Prétérit | Choisir le prétérit d'un verbe parmi quatre propositions | 10 |
| QCM Participe | Choisir le participe passé parmi quatre propositions | 10 |
| Texte à trous (passé) | Compléter « Yesterday, She ___ (to go) » avec le prétérit, puis **Valider** | 10 |
| Texte à trous (perfect) | Compléter « She has never ___ (to go) before » avec le participe passé | 10 |
| Saisie libre | Écrire toi-même le prétérit et le participe passé d'un verbe | 15 |

En cas d'erreur, la bonne réponse s'affiche : lis-la bien avant la question suivante. Pour le verbe be, was et were sont acceptés au prétérit.

## Suivre sa progression (onglet Progression)

Toutes les 100 XP, tu passes au niveau supérieur. L'onglet **Progression** affiche ton niveau, les XP qu'il te manque pour le suivant, ton nombre de quiz réussis et tes bonnes réponses dans chaque famille.

Tu peux aussi débloquer des badges :

| Badge | Comment l'obtenir |
| --- | --- |
| 🌱 Premier pas | Faire un premier quiz ou un premier memory |
| ⭐ 🌟 🏆 100, 500, 1000 XP | Atteindre ce nombre de points |
| 🎯 25 et 75 bonnes réponses | Accumuler des bonnes réponses au quiz |
| 🔵 🟢 🟠 🟣 Maître AAA, ABA, ABB, ABC | Réussir de nombreuses questions dans une même famille |
| 🧠 Mémoire d'élite | Terminer 3 grilles de memory |
| 💎 Mémoire parfaite | Terminer une grille sans aucune erreur |
| 🔥 Série de 3 et de 7 jours | T'entraîner plusieurs jours d'affilée |

Attention : le bouton **🗑️ Réinitialiser ma progression** efface définitivement tes XP, ton niveau et tes badges. L'application te demande de confirmer avant.

## Conseils d'utilisation

**Pour les élèves.** Mieux vaut 10 minutes par jour qu'une heure la veille du contrôle. Commence par une famille, par exemple les AAA, puis passe aux ABB et aux ABC. Alterne les modes : le memory pour découvrir, les QCM pour reconnaître, la saisie libre pour vérifier que tu sais vraiment.

**En classe.** En début de cours, quelques minutes de QCM ou de texte à trous projetés au tableau font un bon rituel de réactivation. On peut aussi organiser un défi memory en binômes, ou demander aux élèves de viser un badge de famille pour la semaine.

**À la maison.** Les parents peuvent faire réciter les verbes avec la liste et le bouton 🔊, sans avoir besoin de parler anglais, ou regarder avec l'enfant les badges qu'il a débloqués.

**À savoir.** Aucune donnée n'est envoyée sur internet : tout reste dans le navigateur de l'appareil. Si l'élève change d'appareil ou efface les données de navigation, sa progression ne suit pas.

  // Anciennes rubriques regroupées : un article qui les utilise encore
  // est rangé automatiquement dans la nouvelle rubrique.
  var ALIAS_RUBRIQUES = { outils: "apps", conseils: "classe", reflexions: "classe" };

  // « rubrique » peut être un texte ("apps") ou une liste (["ia", "classe"]) :
  // la première rubrique de la liste est la rubrique principale de l'article.
  function rubriquesDe(a) {
    var brut = a.rubrique;
    var liste = Object.prototype.toString.call(brut) === "[object Array]" ? brut : [brut];
    var res = [];
    for (var i = 0; i < liste.length; i++) {
      var id = String(liste[i] || "");
      if (ALIAS_RUBRIQUES.hasOwnProperty(id)) id = ALIAS_RUBRIQUES[id];
      if (id && res.indexOf(id) === -1) res.push(id);
    }
    return res;
  }

  function rubriqueDe(a) {
    return rubriquesDe(a)[0] || "";

  /* ---------- Tutos ---------- */
  function tutoDe(a) {

  function boutonTuto(a, classe) {
    if (tutoDe(a)) return '<a class="btn ' + classe + '" href="#/tuto/' + encodeURIComponent(a.id) + '"><span aria-hidden="true">📘</span> Tuto</a>';

  function mdLigne(txt) {
    var h = echapper(txt);
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function (m, t, u) {
      return '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>";
    });
    return h;
  }

  function mdCellules(ligne) {
    var l = ligne.replace(/^\s*\|/, "").replace(/\|\s*$/, "");
    return l.split("|");
  }

  function mdListe(items, i, niveau) {
    var type = items[i].type;
    var tag = type === "ol" ? "ol" : "ul";
    var h = "<" + tag + ">";
    while (i < items.length && items[i].niveau >= niveau) {
      if (items[i].niveau > niveau) {
        var sous = mdListe(items, i, items[i].niveau);
        h = h.replace(/<\/li>$/, sous.html + "</li>");
        i = sous.i;
        continue;
      }
      if (items[i].type !== type) break;
      h += "<li>" + mdLigne(items[i].texte) + "</li>";
      i++;
    }
    return { html: h + "</" + tag + ">", i: i };
  }

  function markdown(texte) {
    var lignes = String(texte).replace(/\r/g, "").split("\n");
    var h = "", para = [], i = 0, m;
    function fermerPara() {
      if (para.length) { h += "<p>" + mdLigne(para.join(" ")) + "</p>"; para = []; }
    }
    while (i < lignes.length) {
      var l = lignes[i];
      if (/^\s*$/.test(l)) { fermerPara(); i++; continue; }
      if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) {
        fermerPara();
        var n = Math.min(Math.max(m[1].length, 2), 4);
        h += "<h" + n + ">" + mdLigne(m[2]) + "</h" + n + ">";
        i++; continue;
      }
      if (/^\s*\|/.test(l) && i + 1 < lignes.length && /^\s*\|?\s*:?-{3,}/.test(lignes[i + 1])) {
        fermerPara();
        var tete = mdCellules(l);
        h += '<div class="tableau"><table><thead><tr>';
        for (var c = 0; c < tete.length; c++) h += "<th>" + mdLigne(tete[c].replace(/^\s+|\s+$/g, "")) + "</th>";
        h += "</tr></thead><tbody>";
        i += 2;
        while (i < lignes.length && /^\s*\|/.test(lignes[i])) {
          var cel = mdCellules(lignes[i]);
          h += "<tr>";
          for (var d = 0; d < cel.length; d++) h += "<td>" + mdLigne(cel[d].replace(/^\s+|\s+$/g, "")) + "</td>";
          h += "</tr>";
          i++;
        }
        h += "</tbody></table></div>";
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        fermerPara();
        var items = [];
        while (i < lignes.length && (m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lignes[i]))) {
          items.push({ niveau: m[1].length >= 2 ? 1 : 0, type: /\d/.test(m[2]) ? "ol" : "ul", texte: m[3] });
          i++;
        }
        var pos = 0;
        while (pos < items.length) {
          var res = mdListe(items, pos, items[pos].niveau);
          h += res.html;
          pos = res.i;
        }
        continue;
      }
      para.push(l.replace(/^\s+|\s+$/g, ""));
      i++;
    }
    fermerPara();
    return h;
  }

  /* ---------- Contenus intégrés (Pearltrees, YouTube, Genially…) ---------- */
  // Seuls ces sites peuvent être intégrés dans un article.
  var SITES_INTEGRABLES = [
    "www.pearltrees.com", "pearltrees.com",
    "www.youtube-nocookie.com", "www.youtube.com",
    "view.genial.ly", "app.genial.ly",
    "padlet.com", "learningapps.org", "wordwall.net",

  ];

  function blocIntegration(params) {
    var morceaux = String(params).split("|");
    var url = (morceaux[0] || "").replace(/^\s+|\s+$/g, "");
    var titre = (morceaux[1] || "Contenu intégré").replace(/^\s+|\s+$/g, "");
    var m = /^https:\/\/([^\/?#]+)/i.exec(url);
    if (!m || SITES_INTEGRABLES.indexOf(m[1].toLowerCase()) === -1) {
      return urlSure(url) ? '<p><a href="' + echapper(url) + '" target="_blank" rel="noopener">' + echapper(titre) + "</a></p>" : "";
    }
    var lien = url.replace(/[?&]embed=[^&]*/, "").replace(/[?&]d=[^&]*/, "");
    return '<figure class="integration"><div class="integration-cadre">' +
      '<iframe src="' + echapper(url) + '" title="' + echapper(titre) + '" loading="lazy" allowfullscreen ' +
      'sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-presentation"></iframe></div>' +
      '<figcaption><a href="' + echapper(lien) + '" target="_blank" rel="noopener">↗ Ouvrir « ' + echapper(titre) + ' » dans un nouvel onglet</a></figcaption></figure>';
  }

  function vueArticle(a) {
    var r = rubrique(rubriqueDe(a)) || RUBRIQUES[0];
    var h = '<a class="retour" href="#/">← Tous les articles</a>';
    h += '<article class="lecture" style="--rubrique-couleur:' + r.couleur + '">';
    var icoA = iconeArticle(a);
    h += '<div class="lecture-tete">' + (icoA ? '<img class="icone-app" src="' + echapper(icoA) + '" alt="" width="120" height="120">' : '<img src="' + (r.img || r.vignette) + '" alt="" width="200" height="197">') + '<div>';
    h += '<a class="etiquette" href="#/rubrique/' + r.id + '">' + echapper(r.nom) + "</a>";
    h += '<p class="date">' + formaterDate(a.date) + (reglages.auteur ? ", par " + echapper(reglages.auteur) : "") + "</p></div></div>";
    h += "<h1>" + echapper(a.titre) + "</h1>";
    var c = a.contenu || [];
    for (var i = 0; i < c.length; i++) {
      var ligne = String(c[i]);
      if (ligne.indexOf("## ") === 0) h += "<h2>" + enrichir(ligne.slice(3)) + "</h2>";
      else if (/^\s*-{3,}\s*$/.test(ligne)) h += '<hr class="separateur">';
      else if (ligne.indexOf("@integrer ") === 0) h += blocIntegration(ligne.slice(10));
      else if (ligne.replace(/\s/g, "") !== "") h += "<p>" + enrichir(ligne) + "</p>";
    }
    h += blocLiens(a, r);
    h += '<div class="panneau"><span class="roundel" aria-hidden="true"></span><div class="panneau-texte">';
    h += "<p>" + (urlSure(a.appUrl) ? echapper(a.appNom || "L'application") + " est à tester ici :" : "Partager cet article :") + "</p>";
    h += '<div class="actions">' + boutonApp(a, "btn-rouge");
    h += boutonTuto(a, "btn-bleu");
    h += '<button type="button" class="btn btn-bleu" id="partager">Copier le lien de l\'article</button></div>';
    h += '<p class="partage" id="partage" role="status"></p></div></div>';
    h += "</article>";
    mainEl.innerHTML = h;
    document.getElementById("partager").addEventListener("click", function () { copier(adresseArticle(a)); });
    document.title = a.titre + " | " + (reglages.titre || "BROT2YOU");
  }

  function urlLien(u) {
    u = String(u || "");
    if (/^https?:\/\//i.test(u)) return { url: u, fichier: false };
    if (/^[a-z0-9_\-][a-z0-9_\-.\/]*$/i.test(u) && u.indexOf("..") === -1) return { url: u, fichier: true };
    return null;
  }

  function blocLiens(a, r) {
    var l = a.liens || [];
    var h = "";
    for (var i = 0; i < l.length; i++) {
      var v = urlLien(l[i] && l[i].url);
      if (!v) continue;
      var texte = echapper(l[i].texte || l[i].url);
      if (v.fichier) h += '<li><a class="btn btn-bleu" href="' + echapper(v.url) + '" download><span aria-hidden="true">⬇</span> ' + texte + "</a></li>";
      else h += '<li><a class="btn btn-bleu" href="' + echapper(v.url) + '" target="_blank" rel="noopener"><span aria-hidden="true">↗</span> ' + texte + "</a></li>";
    }
    if (!h) return "";
    var titre = r.id === "ressources" ? "À télécharger" : (r.id === "liens" ? "Les liens" : "Pour aller plus loin");
    return "<h2>" + titre + '</h2><ul class="liens">' + h + "</ul>";
  }

  function adresseArticle(a, prefixe) {
    var base = "";
    try { base = window.location.href.split("#")[0]; } catch (e) { base = ""; }
    if (!/^https?:/i.test(base)) base = "https://brot2you.github.io/articles/";
    return base + "#/" + (prefixe || "") + encodeURIComponent(a.id);
  }

  function copier(texte) {
    var msg = document.getElementById("partage");
    function ok() { msg.textContent = "Lien copié. Tu peux le coller dans un message ou sur un réseau social."; }
    function secours() {
      var zone = document.createElement("textarea");
      zone.value = texte;
      zone.setAttribute("readonly", "");
      zone.style.position = "absolute";
      zone.style.left = "-9999px";
      document.body.appendChild(zone);
      zone.select();
      var reussi = false;
      try { reussi = document.execCommand("copy"); } catch (e) { reussi = false; }
      document.body.removeChild(zone);
      if (reussi) ok(); else msg.textContent = "Copie impossible ici. Lien de l'article : " + texte;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texte).then(ok, secours);
    else secours();
  }

  function trouver(id) {
    for (var i = 0; i < articles.length; i++) if (articles[i].id === id) return articles[i];
    return null;
  }

  /* ---------- Routeur ---------- */
  var premierAffichage = true;
  var routeCourante = lireHash();

  function lireHash() {
    var h = "";
    try { h = window.location.hash || ""; } catch (e) { h = ""; }
    return h.indexOf("#/") === 0 ? h : "#/";
  }

  // Navigation interne : ne dépend pas des liens « # » du navigateur,
  // qui peuvent être bloqués dans certains aperçus ou cadres intégrés.
  function aller(route) {
    routeCourante = route || "#/";
    try {
      if (window.location.hash !== routeCourante && window.history && window.history.pushState) {
        window.history.pushState(null, "", routeCourante);
      }
    } catch (e) { /* adresse non modifiable ici : l'affichage change quand même */ }
    router();
  }

  function surNavigationNavigateur() {
    var r = lireHash();
    if (r !== routeCourante) { routeCourante = r; router(); }
  }

  document.addEventListener("click", function (ev) {
    if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    var el = ev.target;
    while (el && el !== document) {
      if (el.tagName === "A") break;
      el = el.parentNode;
    }
    if (!el || el === document) return;
    var href = el.getAttribute("href") || "";
    if (href === "#" || href.indexOf("#/") === 0) {
      ev.preventDefault();
      aller(href === "#" ? "#/" : href);
    }
  });

  function router() {
    if (articles === null) {
      construireIcones("");
      mainEl.innerHTML = '<p class="vide">Les articles ne peuvent pas s\'afficher : le bloc « articles » contient une erreur de format. Vérifie les virgules entre les blocs et les guillemets autour de chaque texte.</p>';
      return;
    }
    var hash = routeCourante;
    var page = "", rubActive = null;
    if (hash === "#/" || hash === "#" || hash === "") {
      page = recherche ? "" : "accueil";
      vueListe(null);
    } else if (hash === "#/archives") {
      page = "archives";
      vueArchives();
    } else if (hash.indexOf("#/rubrique/") === 0) {
      rubActive = decodeURIComponent(hash.slice(11));
      if (rubrique(rubActive)) vueListe(rubActive);
      else { rubActive = null; vueListe(null); }
    } else if (hash.indexOf("#/tuto/") === 0) {
      var at = trouver(decodeURIComponent(hash.slice(7)));
      if (at && tutoDe(at)) { rubActive = rubriqueDe(at); vueTuto(at); }
      else mainEl.innerHTML = '<a class="retour" href="#/">← Tous les articles</a><p class="vide">Ce tuto n\'existe pas ou a changé d\'adresse.</p>';
    } else if (hash.indexOf("#/") === 0) {
      var a = trouver(decodeURIComponent(hash.slice(2)));
      if (a) { rubActive = rubriqueDe(a); vueArticle(a); }
      else mainEl.innerHTML = '<a class="retour" href="#/">← Tous les articles</a><p class="vide">Cet article n\'existe pas ou a changé d\'adresse.</p>';
    } else {
      page = "accueil";
      vueListe(null);
    }
    construireRubriques(rubActive);
    construireIcones(page);
    document.getElementById("accueil-flottant").hidden = (hash === "#/" || hash === "#" || hash === "");
    if (!premierAffichage) {
      if (recherche && !searchEl.hidden) {
        searchInput.focus();
      } else {
        if (hash === "#/") {
          window.scrollTo(0, 0);
        } else if (hash.indexOf("#/rubrique/") !== 0) {
          var haut = mainEl.getBoundingClientRect().top + (window.pageYOffset || 0) - 10;
          window.scrollTo(0, Math.max(0, haut));
        }
        try { mainEl.focus({ preventScroll: true }); } catch (e) { mainEl.focus(); }
      }
    }
    premierAffichage = false;
  }

  var minuterie = null;
  searchInput.addEventListener("input", function () {
    var val = this.value;
    clearTimeout(minuterie);
    minuterie = setTimeout(function () {
      recherche = val.replace(/^\s+|\s+$/g, "");
      if (routeCourante !== "#/") {
        aller("#/");
      } else {
        router();
        searchInput.focus();
      }
    }, 200);
  });

  document.getElementById("footer").innerHTML =
    "Applications gratuites, sans inscription ni collecte de données. Un projet BROT2YOU.";

  window.addEventListener("hashchange", surNavigationNavigateur);
  window.addEventListener("popstate", surNavigationNavigateur);
  router();
})();
</script>
</body>
</html>
