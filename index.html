Cet onglet montre les missions terminées et tes badges. Les missions déjà faites reviennent ensuite pour des révisions espacées : la rubrique **À revoir maintenant** indique celles à refaire, et chaque mission affiche la date de sa **prochaine révision**.

Seize badges récompensent tes efforts : First Steps (une première mission), Good Listener, Sound Detective, TH Master (P11 et P12), Vowel Expert, Consonant Champ, Rhythm Hero, Intonation Star (P30 et P31), Perfect Streak (3 défis sans erreur), Sound Explorer (les 4 quartiers), Audio Creator (s'enregistrer dans 3 missions)… jusqu'à Pronunciation Master, pour les 32 missions.

## L'espace professeur (onglet Codes prof)

Cet espace rassemble les 32 codes, à noter sur une production orale. Pour chaque code : la famille, le niveau, l'erreur visée, deux exemples, la question de repérage, la règle et le conseil. Une recherche permet de retrouver un code par son numéro, son phénomène ou un mot. Tu peux copier la liste ou l'**exporter au format CSV**, pour l'imprimer ou l'intégrer à une grille de correction.

## Voix, enregistrements et données

- **Les sons** sont lus par la voix de synthèse anglaise de ton appareil. Une voix de synthèse ne peut pas rendre toutes les nuances : en cas de doute, fie-toi au modèle de ton professeur. Si aucune voix anglaise n'est installée, la lecture ne fonctionne pas.
- **Les enregistrements** restent dans la mémoire du navigateur : ils ne sont envoyés à aucun service. L'application ne juge pas automatiquement ta prononciation : c'est toi qui compares ton essai au modèle. Si le micro est refusé ou indisponible, tu peux quand même terminer la mission.
- **Ta progression** (missions terminées, badges, révisions) est enregistrée dans le navigateur de ton appareil. Elle ne suit pas si tu changes d'appareil ou si tu effaces les données de navigation.

## Conseils d'utilisation

**Pour les élèves.** Quand ton professeur note un code sur ton travail oral, fais la mission dans la semaine. Ne saute pas l'étape Discover : chercher la règle avant de la lire t'aide à mieux la retenir. Et ose t'enregistrer : en te réécoutant, tu entends des choses que tu ne remarques pas en parlant.

**En classe.** Après une évaluation orale, on peut noter un ou deux codes par élève, comme on le fait à l'écrit avec Mind the Mistake!. Une mission projetée au tableau peut aussi se faire collectivement : la classe écoute, formule une hypothèse, puis vérifie la règle. Les codes P21 à P26 tombent à pic au moment de travailler le prétérit ou le présent simple, et P31 pour les questions.

**Avec les autres applis.** Mind the Sound! complète bien Phonix : Phonix pour découvrir et collectionner les sons, Mind the Sound! pour corriger une erreur précise repérée par le professeur.

**À la maison.** L'élève peut refaire ses missions en autonomie, et les révisions espacées l'aident à ne pas oublier ce qu'il a corrigé.
</script>
<script type="text/markdown" id="tuto-geopins">
## C'est quoi, GéoPins ?

GéoPins est un jeu de localisation des repères géographiques du collège, sur carte muette. On lit le nom d'un repère (un continent, un fleuve, une métropole, une région française, un pays de l'Union européenne…) et on plante son pin là où on pense qu'il se trouve : plus on est près, plus on marque de points. Le tout se déroule dans **Terra Village**, un petit monde illustré où l'on progresse avec Plume, la chouette des cartes.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle rassemble 260 repères, répartis en 13 packs, sur trois cartes (le monde, l'Europe et la France) :

| Pack | Niveau | Carte |
| --- | --- | --- |
| Continents & océans | 6e | Monde |
| Fleuves, montagnes, déserts | 6e | Monde |
| Où vivent les humains ? | 5e | Monde |
| Métropoles du monde | 4e | Monde |
| Ports, détroits, façades | 4e | Monde |
| Régions de France | 3e | France |
| Fleuves, massifs et mers de France | 3e | France |
| Grandes villes de France | 3e | France |
| La France des outre-mer | 3e | Monde |
| Les 27 pays de l'UE | 3e | Europe |
| Capitales de l'UE | 3e | Europe |
| Drapeaux du monde | Bonus | Monde |
| Chez nous, le 66 | Bonus | France |

Chaque repère s'accompagne d'une courte information, par exemple pour l'Afrique : « 54 pays : c'est le continent qui compte le plus d'États. »

## Premiers pas

1. Ouvre l'adresse dans ton navigateur : tu arrives à **Terra Village**, accueilli par Plume, ton guide.
2. La barre de navigation donne accès à cinq espaces : **Village**, **Missions**, **Brevet**, **Collection** et **Profil**.
3. Sur le côté, tu retrouves ton niveau d'explorateur, ton expérience, ta série de jours et le **Défi du jour**.
4. Appuie sur **▶ Partir explorer** ou ouvre **Missions** pour choisir un pack de repères.
5. Le bouton **Son** active ou coupe les petits effets sonores.

Sur la carte, utilise **+** et **−** pour zoomer, **⤢** pour recentrer, et fais glisser pour te déplacer.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Planter son pin

Un repère s'affiche (par exemple « L'Afrique » ou « La Loire ») : touche la carte là où tu penses qu'il se trouve. Ton score dépend de la distance :

| Score | Message |
| --- | --- |
| 100 | Pile dedans ! |
| 80 et plus | Parfait ! |
| 50 et plus | Tout près ! |
| 20 et plus | Pas mal |
| Moins de 20 | Un peu loin |

La bonne réponse s'affiche ensuite sur la carte, avec une courte information sur le repère. Un repère manqué va dans ta liste **À revoir**. Les bonnes réponses d'affilée forment des **combos**, et une partie réussie peut valoir jusqu'à trois étoiles.

## Les modes de jeu

| Mode | Ce que tu fais |
| --- | --- |
| Mission | Placer les repères d'un pack, à ton rythme |
| Mode découverte | Explorer les repères et leurs informations, sans score |
| Mode éclair | Placer le plus de repères possible en 60 secondes |
| Drapeau → carte | Voir un drapeau et placer le pays sur la carte |
| Quiz drapeaux | Retrouver le bon drapeau parmi quatre propositions |
| Défi du jour | 10 repères du monde entier, les mêmes pour toute la classe, avec des XP doublés à la première partie |
| Révision | Rejouer les repères de ta liste « À revoir » |

## L'Académie du Brevet (onglet Brevet)

Cet espace est consacré aux repères de 3e, pour préparer le brevet :

- **Entraînement** : 15 repères de troisième, sans chrono ;
- **Grande épreuve** : 30 repères mélangeant la troisième et la quatrième ;
- **Mes points faibles** : une révision ciblée sur les lieux qui te posent encore problème.

Une jauge montre ta maîtrise des repères de troisième.

## Progression, compagnons et badges

Chaque repère placé rapporte de l'expérience, qui fait monter ton niveau d'explorateur. Au fil des XP, tu débloques de nouveaux **compagnons** (Plume, la chouette des cartes, puis Kiko, le panda roux cartographe…) et des éléments pour embellir le village. Chaque pack affiche son pourcentage de maîtrise.

La **Collection** rassemble plus de 60 badges, en cinq familles : débuts et progression (premier pin, 100, 500 puis 1 000 repères placés, niveaux), vitesse et combos, défis et révisions, drapeaux et curiosité, et packs maîtrisés. Par exemple : « Au kilomètre près » pour une ville placée à moins de 2 km, « Rattrapage » pour une session « À revoir » terminée, ou « Encyclopédie vivante » quand tous les packs sont maîtrisés à 100 %.

Dans **Profil**, tu peux activer une police plus lisible (Lexend) et effacer ta progression. Tout est enregistré dans le navigateur de ton appareil : ton niveau, tes badges et ta liste à revoir ne suivent pas si tu changes d'appareil ou si tu effaces les données de navigation, et rien n'est envoyé sur internet.

## Conseils d'utilisation

**Pour les élèves.** Commence par le mode découverte pour repérer les lieux, puis lance une mission. Ne t'inquiète pas des erreurs : chaque repère manqué part dans ta liste « À revoir », et une session de révision te permet de le retrouver. En 3e, entraîne-toi régulièrement dans l'Académie du Brevet.

**En classe.** Le Défi du jour, identique pour toute la classe, fait un excellent rituel de début d'heure ou de fin de séance. Une mission projetée au tableau peut se jouer collectivement, chacun montrant où il placerait le repère avant la réponse. Le mode éclair ajoute un peu de défi pour réactiver les repères en fin de chapitre.

**Entre disciplines.** Les cartes du monde et de l'Europe sont aussi utiles en langues vivantes, par exemple pour situer les pays anglophones ou hispanophones étudiés en cours. Le pack « Chez nous, le 66 » fait découvrir les repères des Pyrénées-Orientales.

**À la maison.** Quelques minutes par jour suffisent pour faire grandir sa série et maîtriser les repères du brevet.
</script>
<script type="text/markdown" id="tuto-dino-buddy-park">
## C'est quoi, Dino Buddy Park ?

Dino Buddy Park (« L'aventure préhistorique en anglais ») est un compagnon virtuel qui parle anglais, à la manière d'un Tamagotchi, pour les élèves de 6e et de 5e. Tout commence par un œuf : l'élève lui parle, il éclôt, puis le petit dinosaure grandit en vivant au même rythme que lui. Le matin il se lève, à midi il déjeune, le soir il dîne, la nuit il dort. Il dit en anglais ce dont il a besoin, pose des questions, raconte sa journée, et apprend à parler grâce à l'élève.

L'application est gratuite et sans inscription, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle travaille la langue de la communication quotidienne, du niveau A1 au niveau A2, en lien avec l'axe 2 de 6e (« Le quotidien : vivre, jouer, apprendre ») et l'axe 2 de 5e (« Le quotidien : lieux, rythmes, saisons ») du programme 2025 :

| Classe | Ce qui change |
| --- | --- |
| 6e | Consignes en français, phrases simples, journal au présent simple à la 3e personne |
| 5e | Consignes en anglais, formulations indirectes, réponses courtes, journal au prétérit |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur : tu arrives au **Camp des explorateurs**, ton île avec tes dinosaures.
2. Dans les **Réglages** ⚙️, indique ton prénom, ta classe (6e ou 5e), le nom de ton compagnon, s'il est un garçon (he) ou une fille (she), et son espèce.
3. Choisis ton premier compagnon parmi les **6 héros** illustrés.
4. Parle à ton œuf pour le faire éclore !
5. Les onglets permettent de naviguer : **Buddy** (ton compagnon), **Sa journée**, **Évolution**, **Journal** et **Buddydex**.

En haut de l'écran, tu vois l'heure, ta série de jours 🔥, tes livres sterling 💷 et le **Shop** 🛍️. Une petite bulle avec un pictogramme peut t'aider à comprendre ce que dit ton compagnon, et un bouton **FR** donne un coup de pouce en français.

## S'occuper de son compagnon

**Ses besoins.** Ton compagnon te dit en anglais ce dont il a besoin : il a faim, il est fatigué, il veut jouer… Comprends ce qu'il dit et donne-lui ce qu'il faut. S'il est trop triste, il grandit deux fois moins vite.

**Ses questions.** Il te pose des questions : réponds-lui correctement, en vérifiant que ta réponse va bien avec la question.

**Ses émotions.** En grandissant, il exprime des émotions plus complexes. Il faut alors lui répondre par une phrase adaptée : le consoler, le féliciter, lui donner un conseil.

## Sa journée (onglet Sa journée)

Ton compagnon suit l'heure réelle de ton appareil. Aide-le à suivre sa journée avec deux activités : **🧩 Remettre dans l'ordre** les étapes de sa routine, et le **🕐 Quiz de l'heure**.

## Le faire grandir (onglet Évolution)

Ton compagnon passe par plusieurs stades : **œuf**, **Bébé**, **Petit**, **Ado** et **Adulte**. Sa forme adulte dépend de la façon dont tu t'en occupes. Il apprend à parler avec toi : d'abord des mots isolés, puis des phrases simples, puis des phrases avec des raisons et des connecteurs, et enfin un vocabulaire plus nuancé (starving, exhausted, disappointed…).

Pour évoluer, il doit apprendre de nouvelles **tournures** : and / but, can, love + -ing, les adverbes de fréquence, because, so, was / were, le prétérit régulier et irrégulier, going to, les comparatifs, les superlatifs, should, must et donner son avis. Il en faut 2 pour devenir Ado, 6 pour devenir Adulte, et les 15 pour devenir **légendaire**. Les tournures apprises reviennent ensuite en révision : choisir la bonne phrase, corriger les erreurs du compagnon, construire une phrase.

Plus il grandit, plus c'est exigeant : écouter sans lire dès le stade Petit, construire des phrases dès le stade Ado, écrire les mots au stade Adulte, et même lui parler au micro.

## Son journal (onglet Journal)

Chaque soir, relis le journal de ton compagnon : il raconte sa journée en anglais, au présent en 6e, au passé en 5e.

## Collectionner (onglet Buddydex et Shop)

Le **Buddydex** rassemble 50 espèces à collectionner, venues de tout le monde anglophone, chacune avec son caractère (gourmand, bavard, timide, farceur…), son plat préféré, sa vitesse de croissance et une anecdote culturelle. Par exemple Corgo, de Londres, qui dit « Fancy a cup of tea? ». Les œufs se gagnent en jouant, et tu peux élever jusqu'à 8 compagnons en même temps : touche leur visage pour passer de l'un à l'autre, le ❗ indique celui qui t'attend.

Chaque bonne réponse rapporte des livres sterling 💷. Au **Shop**, achète des vêtements et des meubles pour ta chambre, à condition de bien comprendre le prix ! Tout au long de l'année, les fêtes du monde anglophone (Halloween, Bonfire Night, Christmas, Pancake Day…) apportent leurs surprises.

## Réglages, sauvegarde et données

Dans les **Réglages**, tu peux activer ou couper l'aide visuelle (pictogramme dans la bulle), la voix de ton compagnon, les petits sons et une police plus lisible (Lexend).

Tout reste dans le navigateur, sans compte. Pour changer d'appareil, utilise **Exporter** pour télécharger ta sauvegarde, puis **Importer** sur l'autre appareil. **Tout effacer** remet tout à zéro.

Deux points à connaître :

- **L'heure, le jour et la date** viennent de l'horloge de l'appareil : ton compagnon dort vraiment la nuit, et les fêtes arrivent au bon moment de l'année.
- **Parler au micro**, au stade Adulte, utilise la reconnaissance vocale du navigateur (Chrome ou Safari récent). Pour la transcrire, le navigateur envoie la voix à son service en ligne (celui de Google pour Chrome). Le reste de l'application fonctionne sans rien envoyer.

## Conseils d'utilisation

**Pour les élèves.** Passe voir ton compagnon plusieurs fois par jour, comme un vrai animal : le matin, le midi et le soir. Écoute bien ce qu'il te dit avant de répondre, et utilise le bouton FR seulement si tu bloques vraiment. Le soir, relis son journal : c'est une bonne façon de revoir les mots de la journée.

**En classe.** L'application accompagne bien les séquences sur le quotidien, les routines, l'heure et les émotions. On peut projeter le compagnon en début de cours pour une routine collective (How is Buddy today? What does he need?), ou s'appuyer sur les tournures de l'onglet Évolution au moment de les étudier en classe. Le Buddydex et les fêtes du monde anglophone ouvrent aussi sur la culture.

**À la maison.** C'est d'abord un compagnon du quotidien : quelques minutes par jour suffisent pour entretenir son anglais en s'amusant. Les familles peuvent suivre son évolution avec leur enfant.
</script>
<script type="text/markdown" id="tuto-wordup">
## C'est quoi, Word Up ?

Word Up (« Play. Learn. Level up. ») est une salle d'arcade pour enrichir son vocabulaire anglais au collège. Les mots sont rangés en « mondes » de vocabulaire, de la 6e à la 3e, inspirés des thèmes du programme d'anglais : on les découvre, on les écoute, on les écrit, puis on les réutilise dans des quêtes, des jeux, des histoires et des défis.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone. Son interface est en anglais, avec les traductions en français.

Elle rassemble plus de 110 packs et près de 3 000 entrées (mots et expressions), chacune avec sa traduction, un emoji et une phrase d'exemple :

| Niveau | Nombre de packs | Exemples de mondes |
| --- | --- | --- |
| 6e | 35 | People & Portraits, Magic & Legends, Morning to Midnight, Family |
| 5e | 29 | Identity & Personality, Discover the United Kingdom, Fantasy & Reality, Seasons & Weather |
| 4e | 25 | Sport & Society, Travel & Explorers, Science & Innovation, Irish Traditions |
| 3e | 26 | Jobs & Future Skills, Migration & Journeys, Media & Critical Thinking, The United States |

Un onglet **BONUS** regroupe des packs thématiques supplémentaires (School Life, Food & Drinks, City Explorer, Planet Earth, Digital World, Mystery Quest…), et l'enseignant peut créer ses propres packs.

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. En haut de l'écran, tu vois ton avatar, ton niveau (**LV**), tes points d'expérience (**XP**), tes badges 🏅, le bouton du son 🔊 et le bouton ✏️ du **Teacher Studio**.
3. Choisis ton niveau de classe avec les onglets **6e**, **5e**, **4e**, **3e**, **BONUS** ou **ALL**, puis un monde de vocabulaire. Tu peux aussi chercher un mot ou un thème, en anglais ou en français.
4. Choisis ensuite un mode de jeu parmi les dix proposés (voir ci-dessous).

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Les modes de jeu

| Mode | Ce que tu fais |
| --- | --- |
| 🎮 Arcade Quests | Des quêtes sur les mondes du programme : traduire, retrouver le mot anglais, compléter une phrase |
| 🧩 Crossword Lab | Des mots croisés générés à partir du monde choisi |
| 🎁 Booster Station | Ouvrir des boosters de 3 cartes de vocabulaire pour remplir son album |
| 🔠 Letter Lab | Remettre dans l'ordre les lettres d'un mot mélangé |
| 🃏 Flip Memory | Retrouver les paires mot anglais / traduction |
| 🏆 Challenge Mode | Répondre au maximum de questions en 60 secondes |
| ⚡ Practice Zone | S'entraîner à son rythme : cartes mémoire, écoute, orthographe, association de mots |
| 📖 Story Mode | Vivre une histoire en 4 scènes en répondant à des questions de vocabulaire et de grammaire |
| 👥 2-Player Battle | Un duel à deux sur le même appareil, en dix tours |
| 🕹️ Original Game Room | Les 16 jeux de la première version de Word Up |

## S'entraîner à son rythme (Practice Zone)

La Practice Zone propose quatre exercices sur le monde choisi :

- **🃏 Flashcards** : touche la carte pour révéler le sens du mot, puis marque-le **✓ I know it** quand tu le connais ;
- **🎧 Listening** : écoute le mot et écris-le ;
- **⌨️ Spelling** : écris le mot anglais à partir de sa traduction ;
- **🧩 Word Match** : associe chaque mot à sa traduction.

## Vivre une histoire (Story Mode)

Trois histoires en quatre scènes : **The Lost Treasure**, **Mystery at the Manor** et **The Space Mission**. À chaque scène, une question fait réutiliser le vocabulaire et quelques points de grammaire (« might » pour exprimer une possibilité, le past continuous, « be going to » pour un projet…), avec une courte explication après chaque réponse.

## La salle des jeux originaux (Original Game Room)

Cette salle rassemble les 16 activités de la première version de Word Up, dont plusieurs pour enrichir son vocabulaire au-delà des mots de base :

| Jeu | Ce que tu fais |
| --- | --- |
| Upgrade! | Remplacer un mot trop simple par un mot plus fort et plus précis |
| L'échelle | Ranger des synonymes du plus faible au plus fort |
| Thésaurus | Explorer des familles de synonymes |
| Labo des mots | Travailler les préfixes, suffixes, mots composés et contraires |
| Atelier de composition | Construire des mots à partir de leurs éléments |
| Idiom Quest | Découvrir des expressions idiomatiques en contexte |
| Slang Decoder | Comprendre la langue familière |
| Range-mots | Classer des mots par thème |

On y trouve aussi Speed Match, Memory, Mot mystère (dans l'esprit du Wordle), Bataille navale, Mots croisés, Entraînement libre, Boosters et collection, et le Carnet de voyage.

## Créer ses propres packs (Teacher Studio)

Le bouton ✏️ ouvre le **Teacher Studio**. Donne un nom au pack, puis écris une ligne par mot au format `anglais;français;phrase d'exemple` (la phrase est facultative). Un pack contient de 4 à 60 mots. Appuie sur **＋ CREATE MY PACK** : il apparaît avec les autres et fonctionne dans tous les modes. Le pack reste uniquement dans le navigateur de l'appareil.

## Progression, récompenses et données

Chaque bonne réponse rapporte des XP, et tous les 150 XP tu montes d'un niveau. Tes XP te donnent aussi des boosters gratuits, pour remplir ton album de cartes de vocabulaire. Neuf badges récompensent tes efforts : First Steps (première bonne réponse), Quick Learner (15 bonnes réponses), Vocabulary Hero (50), Word Wizard (100), World Explorer (3 quêtes terminées), Story Keeper (une histoire terminée), Challenge Master (un défi chrono terminé), Memory Star (10 mots marqués comme connus) et Wordup Legend (1 200 XP). Dans **Rewards & Avatar**, choisis ton avatar et débloque des compagnons : Arcade Pup, Pixel Cat, Neon Fox, Mini Dragon, Byte Bot, Wise Owl.

La **Word Library** permet de chercher, écouter et revoir tous les mots, et de marquer ceux que tu connais déjà.

Ta progression est enregistrée automatiquement dans le navigateur de ton appareil. Elle ne suit pas si tu changes d'appareil ou si tu effaces les données de navigation, et rien n'est envoyé sur internet. La prononciation utilise la voix anglaise installée sur l'appareil : si aucune n'est disponible, l'écoute ne fonctionne pas, mais tout le reste oui.

## Conseils d'utilisation

**Pour les élèves.** Commence par le monde de vocabulaire que tu étudies en classe. Découvre les mots dans la Practice Zone (regarde, écoute, écris), puis réutilise-les dans une quête ou une histoire. Pour aller plus loin, essaie Upgrade! et L'échelle : au lieu de toujours dire good, bad ou interesting, tu apprendras à choisir le mot le plus juste.

**En classe.** Le 2-Player Battle est idéal pour un travail en binômes, et le Challenge Mode peut se jouer collectivement au tableau. Avec le Teacher Studio, on peut créer en quelques minutes le pack de vocabulaire de sa séquence, et l'utiliser dans tous les jeux. Les jeux de synonymes et le Labo des mots aident à préparer une production écrite plus riche.

**À la maison.** Quelques minutes par jour suffisent : une quête, un booster à ouvrir, et la collection grandit en même temps que le vocabulaire.
</script>
<script type="text/markdown" id="tuto-phonix">
## C'est quoi, Phonix ?

Phonix (« L'anglais en toute confiance ») fait travailler la prononciation anglaise sous la forme d'un jeu de cartes magiques. Chacun des 44 sons de l'anglais devient une créature à collectionner, les grandes règles de l'oral deviennent des « ensorcellements », et les paires de sons qui se ressemblent deviennent des « pièges ». On écoute, on répète, on gagne des boosters, et on affronte des adversaires en duel.

L'application est gratuite et sans inscription, et fonctionne dans le navigateur. Pour t'enregistrer et être corrigé, il faut un navigateur récent (Chrome, Edge ou Safari) et autoriser le micro.

La collection compte 68 cartes :

| Type de carte | Ce qu'elle représente | Nombre |
| --- | --- | --- |
| Créatures | Les 44 sons de l'anglais : voyelles courtes et longues, diphtongues, consonnes | 44 |
| Ensorcellements | Les règles de l'oral : -ed, -s, accent de mot, lettres muettes, intonation, liaisons | 6 |
| Pièges | Les paires de sons qui se ressemblent, comme ship / sheep | 18 |

Elle s'organise en cinq onglets : **Grimoire**, **Cartes**, **Boosters**, **Duel** et **Règles**.

## Premiers pas

1. Ouvre l'adresse dans ton navigateur : tu arrives dans le **Grimoire**.
2. En haut, ton grade, ton niveau, tes boosters et ta poussière d'étoiles s'affichent. Les grades vont d'**Apprenti mage** à **Légende**, en passant par Mage, Sorcier, Archimage et Maître des sons.
3. Choisis l'accent de la voix anglaise : britannique, américain, australien, irlandais, sud-africain, indien, canadien ou néo-zélandais.
4. La barre de navigation permet de passer d'un onglet à l'autre : **Grimoire**, **Cartes**, **Boosters**, **Duel** et **Règles**.
5. La première fois que tu t'enregistres, ton navigateur te demande l'autorisation d'utiliser le micro : accepte-la.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## S'entraîner (onglet Grimoire)

Le Grimoire est la salle d'entraînement : « Écoute · Répète · Progresse ». Il propose trois espaces :

- **Les sons** : choisis un son, par exemple /ɪ/ (« short i »). Tu vois sa créature, son symbole phonétique, un mot-clé (ship /ʃɪp/), une astuce de prononciation (« Bouche légèrement ouverte, langue haute. Court et détendu. ») et des mots d'exemple. Étape 1 : **écoute** le mot. Étape 2 : **répète**-le au micro. Chaque bonne prononciation fait monter la maîtrise de la carte.
- **Phrase libre** : lis une phrase à voix haute et vois ce qui a été reconnu.
- **Tableau des sons** : les 44 sons de l'anglais d'un coup d'œil, pour choisir celui à travailler.

## Collectionner (onglet Cartes)

L'album rassemble toutes les cartes, rangées par famille : voyelles courtes, voyelles longues, diphtongues, consonnes, ensorcellements et pièges. Filtre-les par type, et vois combien tu en possèdes pour chaque rareté : Commune, Peu commune, Rare, Mythique et Légendaire.

Touche une carte pour l'ouvrir : son niveau de maîtrise, son astuce, ses exemples, et un bouton pour **s'entraîner** sur ce son, **faire l'exercice** de la règle, ou **aller au duel**. Une carte encore manquante peut être **fabriquée** avec de la poussière d'étoiles. Une carte travaillée gagne des étoiles de maîtrise, jusqu'à devenir **maîtrisée**.

## Ouvrir des boosters (onglet Boosters)

Un booster contient 3 cartes. Tu en gagnes un toutes les 10 bonnes réponses (dans le Grimoire, les règles ou les duels), et un cadeau t'attend chaque jour. Retourne les cartes une à une, ou d'un coup avec **Tout retourner**. Un doublon se transforme en poussière d'étoiles, pour fabriquer la carte qui te manque.

## Affronter des adversaires (onglet Duel)

Réponds juste pour attaquer avec tes cartes : plus une carte est forte et maîtrisée, plus tu frappes fort et mieux tu encaisses les erreurs. Les questions portent sur les sons, les règles et les pièges. Trois modes :

| Mode | Ce que tu fais |
| --- | --- |
| Duel rapide | Un combat express contre un adversaire |
| Combat de deck | Compose ton deck (3 à 8 cartes, dont au moins une Créature) et affronte un adversaire |
| Bestiaire | Retrouve les 12 adversaires et ceux que tu as déjà battus |

Les adversaires vont du Fantôme du Franglais (facile, « Je dis ouèsterne pour western ») au Roi des Pièges (boss), en passant par Silent K le Ninja, la Sorcière du Schwa, le Dragon TH ou le Kraken des -ED. Chacun a sa spécialité : choisis celle que tu veux travailler.

## Les règles de l'oral (onglet Règles)

Six ensorcellements, chacun avec sa règle et son exercice :

| Règle | Ce que tu apprends |
| --- | --- |
| ⏰ -ED | Quand dire /t/ (walked), /d/ (played) ou /ɪd/ (wanted) |
| -S | Quand dire /s/, /z/ ou /ɪz/ |
| Accent de mot | Trouver la syllabe accentuée |
| Lettres muettes | Repérer la lettre qu'on ne prononce pas |
| Intonation | Dire si la voix monte ↗ ou descend ↘ |
| Liaisons | Repérer où les mots s'enchaînent |

## Progression, voix et données

Ta collection, tes boosters, ta poussière d'étoiles, la maîtrise de tes cartes, ton deck et tes victoires sont enregistrés automatiquement dans le navigateur de ton appareil. Ils ne suivent pas si tu changes d'appareil ou si tu effaces les données de navigation.

Trois points à connaître :

- **La voix anglaise** est celle installée sur ton appareil. Si aucune voix anglaise n'est disponible, l'application utilise un service en ligne de Google pour lire le mot, et l'accent n'est alors pas garanti.
- **La reconnaissance de ta voix** passe par le navigateur, qui transmet l'enregistrement à son service de reconnaissance en ligne (celui de Google pour Chrome, par exemple). Elle fonctionne dans Chrome, Edge et Safari récents.
- **La reconnaissance n'est pas un professeur** : elle peut accepter un mot mal prononcé, ou refuser un mot correct, surtout avec du bruit autour.

## Conseils d'utilisation

**Pour les élèves.** Commence par les sons qui n'existent pas en français : le th, le /h/, la différence entre voyelles courtes et longues (ship / sheep). Écoute plusieurs fois avant de t'enregistrer, et exagère un peu au début. Pour gagner tes duels, entraîne-toi d'abord dans le Grimoire : plus tes cartes sont maîtrisées, plus elles sont fortes.

**En classe.** Un duel projeté au tableau, où la classe vote pour chaque réponse, fait un bon rituel de début de cours. Chaque adversaire du bestiaire cible une difficulté précise (les TH, les -ED, les lettres muettes, l'intonation…) : on peut choisir celui qui correspond à la notion du moment. L'onglet Règles tombe à pic au moment de travailler le prétérit ou le pluriel. Pour les enregistrements, mieux vaut un travail individuel au casque.

**À savoir.** Avant de faire enregistrer les élèves, vérifie que l'usage de la reconnaissance vocale en ligne est compatible avec les règles de ton établissement. Les autres activités (écoute, règles, duels) fonctionnent sans micro.
</script>

<script type="text/markdown" id="tuto-plan-de-classe">
## C'est quoi, Plan de Classe ?

Plan de Classe permet de dessiner la disposition de sa salle et d'y placer ses élèves en quelques gestes. On ajoute des tables (simples, en duo ou rondes), on les déplace librement, puis on glisse les élèves à leur place. L'outil gère plusieurs classes, permet de dupliquer un plan, de l'imprimer et de le sauvegarder.

L'application est gratuite, sans inscription, et fonctionne dans le navigateur, sur ordinateur ou tablette. Tout est enregistré automatiquement sur l'appareil : rien n'est envoyé sur internet.

| Élément | Ce qu'il permet |
| --- | --- |
| 🧑‍🎓 Élèves | La liste de la classe, avec un nom et, si on le souhaite, une photo ou un emoji |
| 🪑 Tables rectangulaires | Des tables simples ou en duo, pour une disposition en rangs |
| 🧀 Tables camembert | Des tables rondes au nombre de places réglable, pour le travail en îlots |
| Onglets de classes | Un plan différent pour chaque classe |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur, de préférence sur ordinateur ou tablette pour profiter d'un grand écran.
2. Une première classe, « Classe 1 », est créée automatiquement. Pour la renommer, **double-clique sur son onglet**.
3. Pour ajouter une autre classe, utilise le bouton d'ajout à côté des onglets et donne-lui un nom.
4. Le grand espace central représente ta salle, avec le **TABLEAU** en haut. Tant qu'il est vide, il t'invite à ajouter des tables puis à y glisser les élèves.

En haut de l'écran, l'indicateur **Enregistré** confirme que tes modifications sont bien sauvegardées.

## Construire son plan

**1. Ajouter les élèves.** Dans le panneau **🧑‍🎓 Élèves**, appuie sur **+ Ajouter un élève**, écris son nom, puis appuie sur **Ajouter**. Tu peux aussi lui associer une **Photo** (elle est automatiquement recadrée en petit carré) ou laisser l'emoji 🙂. Le compteur indique le nombre d'élèves de la classe.

**2. Ajouter les tables.**

- **🪑 Tables rectangulaires** : **+ Duo** ajoute une table de deux, **+ Simple** une table individuelle.
- **🧀 Table camembert** : règle le nombre de places avec **−** et **+**, puis appuie sur **+ Ajouter une table ronde**.
- **🎯 Disposer 6 tables camembert** installe d'un coup six îlots dans la salle. Attention : ce bouton remplace les tables déjà présentes dans la classe.

**3. Disposer la salle.** Fais glisser chaque table à sa place sur le plan, à la souris ou au doigt sur tablette, en t'aidant du tableau représenté en haut.

**4. Placer les élèves.** Glisse un élève de la liste vers une place libre. Une fois assis, il est marqué « placé » dans la liste. Pour le changer de place, il suffit de le faire glisser ailleurs.

**5. Gérer les classes.** **⧉ Dupliquer la classe** crée une copie du plan, avec ses tables et ses élèves : pratique pour préparer une disposition de travail en groupes à partir du plan habituel, ou pour une autre classe qui occupe la même salle. Chaque onglet peut être supprimé, mais il reste toujours au moins une classe.

Pour retirer un élève ou une table, utilise sa petite croix : l'application demande confirmation, surtout si la table est occupée.

## Imprimer, sauvegarder, protéger les données

- **🖨️ Imprimer le plan** produit une version papier ou un PDF, à afficher en salle ou à laisser dans le cahier d'appel pour un remplaçant.
- **⬇ Exporter (.json)** enregistre tes classes dans un fichier, pour faire une sauvegarde ou changer d'ordinateur.
- **⬆ Importer (.json)** récupère un fichier exporté.

Les plans sont enregistrés automatiquement dans le navigateur de l'appareil utilisé. Ils ne suivent pas si tu changes d'ordinateur ou si tu effaces les données de navigation : pense à exporter régulièrement. Si l'indicateur affiche « Erreur de sauvegarde (stockage plein ?) », c'est souvent que les photos prennent trop de place : en retirer quelques-unes règle le problème.

**Les noms et surtout les photos des élèves sont des données personnelles.** Quelques précautions simples :

- utilise l'application sur un appareil personnel ou professionnel, pas sur un poste partagé ;
- le prénom et l'initiale du nom suffisent souvent ;
- n'ajoute des photos que si c'est conforme aux règles de ton établissement (droit à l'image) ;
- le fichier exporté contient les noms et les photos : ne le partage pas et garde-le en lieu sûr.

## Conseils d'utilisation

**En début d'année.** Les photos aident à retenir rapidement les prénoms des élèves : c'est souvent là que l'outil rend le plus de services. Un plan imprimé et laissé dans le cahier d'appel aide aussi beaucoup les remplaçants.

**Pour varier les dispositions.** Duplique le plan habituel de la classe pour préparer une version « travail en groupes » avec des tables camembert, sans perdre la disposition en rangs. On peut ainsi passer d'une configuration à l'autre selon les séances.

**Pour constituer les groupes.** Avant une séance en îlots, glisser les élèves sur les tables rondes permet de réfléchir à l'équilibre des groupes : niveaux, affinités, élèves à séparer ou à rapprocher.

**En conseil de classe ou en équipe.** Le plan imprimé peut servir de support pour discuter de la place d'un élève, par exemple pour un élève qui a besoin d'être près du tableau ou loin d'une source de distraction.
</script>

<script type="text/markdown" id="tuto-planning-assistant">
## C'est quoi, Planning Assistant ?

Planning Assistant est un outil de planification pour les professeurs d'anglais de collège, construit à partir du programme officiel (BO du 6 février 2025). Il permet de bâtir une séquence en piochant directement dans le programme : axes culturels et objets d'étude, lexique, faits de langue, compétences par activité langagière, démarches pédagogiques. L'outil produit ensuite une fiche de séquence récapitulative, à enregistrer ou à imprimer.

L'application est gratuite, sans inscription, et fonctionne en local : aucune donnée n'est envoyée.

Elle couvre les quatre niveaux du collège, avec les niveaux CECRL visés par le programme :

| Classe | LVB | LVA |
| --- | --- | --- |
| 6e | A1 | A1+ |
| 5e | A1+ | A2 |
| 4e | A1+ | A2+ |
| 3e | A2 | B1 |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. En haut, choisis la classe : **6e**, **5e**, **4e** ou **3e**. Chaque carte rappelle les niveaux CECRL visés en LVB et en LVA.
3. Les boutons de section permettent ensuite de passer d'une étape à l'autre : **Repères culturels**, **Lexique**, **Faits de langue**, **Compétences** et **Ma séquence**. Un compteur indique combien d'éléments tu as déjà retenus dans chacune.

Chaque classe garde ses propres choix : tu peux préparer une séquence de 6e, passer en 3e, puis revenir en 6e sans rien perdre tant que la page reste ouverte.

## Construire une séquence, étape par étape

**1. Repères culturels.** L'outil rappelle ce que le programme impose pour la classe (par exemple, en 6e, les cinq axes doivent être traités dans l'année, et deux axes peuvent être associés autour d'une problématique commune). Ajoute le ou les axes de ta séquence, puis coche les objets d'étude que tu veux aborder. Tu peux aussi ajouter tes propres objets d'étude.

**2. Lexique.** Le lexique du programme est classé par catégories, à déplier. Les colonnes correspondent aux niveaux CECRL visés pour la classe. Clique sur un mot pour le valider et l'ajouter à ta séquence. Tu peux aussi ajouter tes propres mots.

**3. Faits de langue.** Coche les points de grammaire et de phonologie à travailler. Des badges indiquent le niveau correspondant, et les apports nouveaux pour la classe sont mis en couleur.

**4. Compétences.** Pour chaque activité langagière (compréhension de l'oral et de l'écrit, expression orale en continu, expression écrite, interaction, médiation, compétences psychosociales), l'outil affiche le niveau CECRL visé, les tâches et actes concrets que l'élève sera capable de réaliser, et les stratégies mobilisables. Coche ce que tu prévois de travailler.

**5. Ma séquence.** Remplis la fiche :

- le **titre de la séquence** ;
- la **problématique** : l'encart **💡 Idées de problématiques** propose des pistes selon les axes choisis, par exemple « Qu'est-ce qui rend un personnage mémorable, réel ou fictif ? » ;
- la **tâche finale envisagée** ;
- les **approches pédagogiques et l'évaluation** : perspective actionnelle, travail en binômes ou en groupes, démarche spiralaire, résolution de problèmes… ;
- les **supports envisagés**.

Un rappel des objectifs généraux du BO 2025 accompagne la fiche. En bas de page, le **Récapitulatif** rassemble tout ce que tu as retenu : axes et objets d'étude, lexique, faits de langue, compétences, approches et supports.

## Enregistrer, imprimer, retrouver ses séquences

- **💾 Enregistrer** garde la séquence dans ton navigateur. Elle apparaît dans la liste **Séquences enregistrées**, avec son titre, sa classe et sa date.
- **Charger** rouvre une séquence enregistrée pour la modifier ; **✕** la supprime.
- **🖨️ Imprimer / PDF** produit une version papier ou un PDF de la fiche, à joindre à ton cahier de textes ou à partager avec ton tuteur.
- **Réinitialiser** efface les choix en cours pour repartir de zéro.

À savoir : les séquences sont enregistrées uniquement sur l'appareil et le navigateur utilisés. Elles ne suivent pas si tu changes d'ordinateur ou si tu effaces les données de navigation. Pour les conserver durablement, imprime-les en PDF.

## Conseils d'utilisation

**Partir de la tâche finale.** Une fois les axes choisis, réfléchis d'abord à ce que les élèves seront capables de faire en fin de séquence, puis sélectionne le lexique, les faits de langue et les compétences qui y mènent. L'outil aide à garder cette cohérence.

**Ne pas tout cocher.** Le programme est riche : mieux vaut cibler quelques faits de langue et un lexique resserré, réellement réinvestis dans la tâche finale, plutôt qu'une longue liste.

**Pour les stagiaires et leurs tuteurs.** La fiche imprimée est un bon support d'échange : elle montre d'un coup d'œil les choix faits et leur lien avec le programme. On peut la construire ensemble lors d'un rendez-vous de tutorat.

**Pour toute l'équipe.** En début d'année, l'outil peut servir à répartir les axes sur l'année et à vérifier, niveau par niveau, que tous les axes obligatoires sont bien couverts.
</script>

<script type="text/markdown" id="tuto-ravensmoor">
## C'est quoi, Murder at Ravensmoor Estate ?

Murder at Ravensmoor Estate est une enquête policière interactive en anglais, pensée pour les élèves de 3e. Nous sommes en novembre 1925, un samedi soir, dans un manoir anglais : un homme a été retrouvé mort, et sept personnes étaient présentes. L'élève mène l'enquête en interrogeant chaque suspect par écrit, en anglais, pour découvrir le coupable, l'arme, la pièce et l'heure du crime.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur. Elle n'utilise pas d'intelligence artificielle : les suspects répondent à partir des mots-clés repérés dans les questions.

L'objectif linguistique est clair : employer le **past continuous** (was/were + V-ing) et le **past perfect** (had + participe passé) en contexte, pour questionner et pour justifier.

| Suspect | Rôle |
| --- | --- |
| 🎖️ Colonel Hartley | Le frère de la victime |
| Dr. Finch | Le médecin de famille |
| Miss Clara Ashford | La nièce |
| Mr. Reed | Le majordome |
| Lady Voss | L'amie de la famille |
| Joe Stubbs | Le jardinier |
| Mrs. Potts | La gouvernante |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Lis l'introduction : « It is Saturday night. You have been called to Ravensmoor Estate. A man was found dead. Seven people were present. Find out what happened. »
3. Appuie sur **Enter the Estate →** pour commencer l'enquête.
4. Le bouton **Worksheet** ouvre la fiche d'enquête à imprimer ou à remplir (voir plus bas).

Sur téléphone ou tablette, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Interroger les suspects

1. En haut de l'écran, un onglet par suspect. Touche celui que tu veux interroger.
2. Écris ta question en anglais dans la zone de saisie, puis envoie-la avec la flèche **➤**.
3. Le suspect te répond. Lis bien sa réponse : chaque détail peut compter.
4. Passe d'un suspect à l'autre pour comparer leurs versions et repérer les contradictions.

Quelques exemples de questions qui fonctionnent bien :

- Where were you at 9 pm?
- What were you doing when you heard the scream?
- Had you seen the victim before dinner?
- Who were you with all evening?
- How did you feel about Lord Edward?

Pour que le suspect te comprenne, écris une vraie phrase ou une vraie question, avec au moins un verbe ou un mot interrogatif (what, where, when, who, why, how, did, were, had…). Si ta question est trop courte ou pas en anglais, l'application te le signale avec un conseil, par exemple « Please write a full sentence or question. »

Les suspects réagissent aussi aux salutations, aux questions sur leurs sentiments ou à une accusation directe (« I think you killed him! »). En revanche, ils ne répondent pas aux questions sans rapport avec l'enquête, comme leur âge ou leurs loisirs.

## Remplir la fiche d'enquête (Worksheet)

La fiche **Murder Investigation**, conçue pour la 3e, accompagne l'enquête. Elle contient :

- un **rappel de grammaire** : past continuous (« I was playing cards when… », une action en cours à un moment du passé) et past perfect (« He had left before I arrived. », une action terminée avant une autre action passée) ;
- un espace pour les **suspects** et les **notes d'interrogatoire** ;
- le **verdict final** : le coupable, l'arme, la pièce, l'heure, et une justification à rédiger en utilisant le past continuous et le past perfect.

Appuie sur **Print** pour l'imprimer, et sur **← Back** pour revenir à l'enquête.

## Bon à savoir

L'application ne donne pas la solution et ne valide pas le verdict : c'est l'élève qui tranche sur sa fiche, et l'enseignant qui corrige. Les interrogatoires ne sont pas enregistrés : il faut noter les indices importants sur la fiche au fur et à mesure.

Les suspects répondent grâce à des mots-clés, pas grâce à une intelligence artificielle. Si une réponse semble à côté, il suffit souvent de reformuler la question plus simplement, avec des mots comme where, when, who ou what were you doing.

## Conseils d'utilisation

**Pour les élèves.** Commence par demander à chaque suspect où il était et ce qu'il faisait au moment du crime. Note les réponses sur ta fiche, puis cherche les contradictions : qui n'a pas d'alibi ? Qui dit avoir été avec quelqu'un qui affirme le contraire ? Pour ton verdict, justifie avec des phrases comme « She was walking in the garden when… » ou « He had left the library before… ».

**En classe.** L'enquête fonctionne très bien en binômes ou en groupes de trois : chaque groupe interroge les suspects, puis défend son verdict devant la classe. On peut aussi répartir les suspects entre les groupes, qui mettent ensuite leurs indices en commun. C'est une manière motivante de réinvestir le past continuous et le past perfect après une séance de grammaire.

**Pour prolonger.** Les élèves peuvent rédiger le compte rendu de l'inspecteur, jouer la scène finale des aveux, ou imaginer l'interrogatoire d'un huitième suspect.
</script>

<script type="text/markdown" id="tuto-swipe-ton-brevet">
## C'est quoi, Swipe ton brevet ?

Swipe ton brevet est un compagnon de révision du brevet pour les élèves de 3e, présenté comme un fil de vidéos courtes : on fait défiler des cartes, une par écran, dans toutes les matières. Fiches de cours, quiz, méthodes, conseils et pièges à éviter s'enchaînent, et l'application garde de côté ce qu'il faut revoir.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, idéalement sur téléphone.

Elle rassemble 365 cartes réparties en dix matières : français, maths, histoire, géographie, EMC, physique-chimie, SVT, technologie, oral et méthode. Les cartes sont de six types :

| Type | Ce que c'est | Nombre |
| --- | --- | --- |
| Quiz | Une question à choix multiple, corrigée tout de suite | 165 |
| Fiche | L'essentiel d'une notion, en quelques lignes | 149 |
| Méthode | Comment s'y prendre pour une épreuve ou un exercice | 27 |
| Conseil | Une astuce pour réviser ou passer l'épreuve | 13 |
| Piège | Une erreur classique à ne pas commettre | 9 |
| Repères | Les dates à savoir par cœur | 2 |

Elle s'organise en quatre onglets : **Fil**, **Explorer**, **Épreuves** et **Moi**.

## Premiers pas

1. Ouvre l'adresse sur ton téléphone. Pour la retrouver comme une vraie appli, ajoute-la à ton écran d'accueil :
   - iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil » ;
   - Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».
2. Tu arrives sur le **Fil** : fais défiler les cartes vers le haut, une à une.
3. La barre du bas permet de passer d'un onglet à l'autre : **Fil**, **Explorer**, **Épreuves** et **Moi**.
4. Le bouton lune ou soleil, en haut, bascule entre l'ambiance nuit et l'ambiance jour.

## Faire défiler le Fil

Le Fil présente une carte par écran. En haut, des étiquettes permettent de choisir une matière, ou de tout garder. Chaque carte affiche son type (Fiche, Quiz, Méthode, Conseil, Piège ou Repères), un titre accrocheur comme « Pythagore en 15 secondes » ou « Leur ou leurs ? Le piège classique », puis l'essentiel en quelques lignes.

Sur le côté de chaque carte, trois boutons :

| Bouton | À quoi il sert |
| --- | --- |
| ❤ J'aime | Garder une trace des cartes que tu as trouvées utiles |
| 🔖 À revoir | Mettre la carte de côté pour la réviser plus tard |
| Partager | Copier ou envoyer la carte à quelqu'un |

**Les quiz** se jouent directement dans le fil : touche ta réponse, et la correction s'affiche aussitôt avec une courte explication. Une erreur envoie automatiquement la carte dans « À revoir ».

## Chercher une notion (onglet Explorer)

Tape un mot dans la recherche (par exemple « Thalès », « subordonnée » ou « guerre froide ») ou filtre par matière. Chaque carte indique si elle est **✓ acquise** ou **à revoir**. Touche une carte pour l'ouvrir en grand.

## Connaître ses épreuves (onglet Épreuves)

Un compte à rebours indique le nombre de jours avant la première épreuve écrite. En dessous, une fiche par épreuve : français, mathématiques, histoire-géographie et EMC, sciences, et oral. Chaque fiche donne la date, la durée, le coefficient, les différentes parties avec leurs points et leur durée conseillée, les étapes pour bien gérer son temps, et les pièges classiques à éviter.

## S'entraîner et réviser (onglet Moi)

**Le défi chrono.** Choisis une matière, ou toutes les matières, puis appuie sur **Lancer le défi** : 10 questions, 20 secondes chacune. Il faut 8 bonnes réponses sur 10 pour valider la matière. Chaque erreur part dans « À revoir ». Le bloc **Matières validées** montre ton meilleur score dans chacune.

**La révision du jour.** Les cartes « À revoir » reviennent à intervalles de plus en plus espacés : le lendemain, puis après 3, 7, 15 et 30 jours. Appuie sur **Réviser les cartes du jour**, dis à voix haute ou écris ce que tu sais sur la notion, retourne la carte, puis indique si tu la savais. Les cartes réussies s'espacent, les autres reviennent le lendemain.

**Ta progression.** Chaque carte vue, chaque bonne réponse et chaque défi te rapportent des XP. Les niveaux, inspirés des réseaux sociaux, vont de « Nouveau compte » à « Légende du brevet », en passant par « Premier post », « Petit créateur », « En tendance », « Certifié » et « Viral ». Une série de jours d'affilée t'encourage à revenir un peu chaque jour.

## Bon à savoir

Ta progression (XP, niveau, série de jours, cartes aimées, cartes à revoir, défis validés) est enregistrée automatiquement dans le navigateur de ton téléphone. Elle ne suit pas si tu changes d'appareil ou si tu effaces les données de navigation. Il n'y a pas de compte, et rien n'est envoyé sur internet.

Les cartes sont des rappels courts, pensés pour réviser vite et souvent. Elles ne remplacent ni le cours ni les annales : pour bien te préparer, entraîne-toi aussi sur de vrais sujets de brevet. Et vérifie toujours les dates des épreuves avec ton collège, qui te communiquera le calendrier officiel.

## Conseils d'utilisation

**Pour les élèves.** Dix minutes par jour valent mieux qu'une soirée entière la veille. Commence chaque session par la **révision du jour**, puis fais défiler le fil dans la matière que tu veux renforcer. Mets dans « À revoir » tout ce qui te paraît flou, même si tu as bien répondu au quiz. Avant chaque épreuve, relis sa fiche dans l'onglet **Épreuves** pour savoir exactement à quoi t'attendre.

**En classe.** Une carte projetée en début d'heure fait un bon rituel de réactivation, et le défi chrono peut se jouer collectivement, la classe votant pour chaque réponse. L'onglet Épreuves est utile pour présenter le déroulé du brevet aux élèves, et les cartes Méthode pour préparer une épreuve blanche.

**En équipe.** Comme toutes les matières sont couvertes, l'application peut être présentée par le professeur principal ou en réunion d'équipe pédagogique, pour que chaque collègue renvoie les élèves vers les cartes de sa discipline.

**À la maison.** Les familles peuvent jouer au défi chrono avec leur enfant, ou lui demander d'expliquer une carte à voix haute : c'est l'une des meilleures façons de vérifier qu'une notion est vraiment comprise.
</script>

<script type="text/markdown" id="tuto-swipe-ton-english">

Swipe ton English est la déclinaison anglaise de Swipe ton brevet : une appli de révision pour le collège, de la 6e à la 3e, présentée comme un fil de vidéos courtes. On fait défiler des cartes, une par écran, adaptées à sa classe : fiches, quiz, méthodes, pièges à éviter, avec la prononciation des mots en anglais.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, idéalement sur téléphone.

Elle rassemble 633 cartes, réparties par niveau (6e, 5e, 4e, 3e) et en sept thèmes :

| Thème | Ce qu'on y trouve | Cartes |
| --- | --- | --- |
| Vocabulaire | Les mots et expressions du programme | 199 |
| Grammaire | Les temps, les structures, les règles | 187 |
| Culture | Les repères culturels du monde anglophone | 130 |
| Prononciation | Les sons, l'accent, l'intonation | 42 |

Les cartes sont des fiches (295), des quiz (276), des méthodes (46), des pièges (9), des repères (5) et des conseils (2). L'application s'organise en quatre onglets : **Fil**, **Explorer**, **Évals** et **Moi**.

## Premiers pas

1. Ouvre l'adresse sur ton téléphone, puis ajoute-la à ton écran d'accueil pour la retrouver comme une vraie appli :
   - iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil » ;
   - Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».
2. Au premier lancement, choisis **ta classe** : 6e, 5e, 4e ou 3e. Les cartes, les évaluations et le niveau visé s'adaptent à ce choix.
3. Tu peux aussi ajouter les **années d'avant**, pour revoir ce que tu as appris les années précédentes, ou rester sur ta seule classe.
4. La barre du bas permet de passer d'un onglet à l'autre : **Fil**, **Explorer**, **Évals** et **Moi**.

Tu pourras changer de classe à tout moment, depuis l'onglet **Moi**.

## Faire défiler le Fil

Le Fil présente une carte par écran, adaptée à ta classe. En haut, des étiquettes permettent de choisir un thème (Grammaire, Vocabulaire, Prononciation, Culture, Comprendre, S'exprimer, Méthode), ou de tout garder. Les mots en anglais peuvent être écoutés avec une voix anglaise.

Sur le côté de chaque carte, trois boutons :

| Bouton | À quoi il sert |
| --- | --- |
| ❤ J'aime | Garder une trace des cartes que tu as trouvées utiles |
| 🔖 À revoir | Mettre la carte de côté pour la réviser plus tard |
| Partager | Copier ou envoyer la carte à quelqu'un |

Les **quiz** se jouent directement dans le fil, avec la correction et une courte explication. Une erreur envoie la carte dans « À revoir ». Quand tu as vu toutes les cartes de ta classe, le fil recommence avec celles que tu n'as pas encore comprises.

## Chercher une notion (onglet Explorer)

Tape un mot (par exemple « present perfect », « irregular verbs » ou « Thanksgiving ») ou filtre par thème. Chaque carte indique si elle est **✓ acquise** ou **à revoir**.

## Se préparer aux évaluations (onglet Évals)

L'onglet rappelle le niveau visé en fin d'année pour ta classe (par exemple A1+ en 6e), puis présente les formats d'évaluation, un par activité langagière :

| Évaluation | Durée d'entraînement |
| --- | --- |
| Compréhension de l'oral | 25 min |
| Compréhension de l'écrit | 30 min |
| Expression écrite | 35 min |
| Prendre la parole en continu | 15 min |
| Interaction orale | 15 min |
| Médiation | 20 min |
| Oral du brevet, partie en anglais (3e) | 15 min |

Pour chacune : ce qu'on attend de toi, les étapes de la méthode, les erreurs qui coûtent des points, et un bouton **Lancer le chrono d'entraînement** qui te guide partie par partie (par exemple pour la compréhension de l'oral : découvrir le document, première écoute, prise de notes, détails, compte rendu). Un compte à rebours indique le nombre de jours avant les vacances d'été, ou avant le brevet en 3e.

## S'entraîner et suivre ses progrès (onglet Moi)

**Le défi chrono.** 10 questions de 20 secondes sur le programme de ta classe. Il faut 8 bonnes réponses sur 10 pour valider. Chaque erreur part dans « À revoir ».

**La révision du jour.** Les cartes « À revoir » reviennent le lendemain, puis après 3, 7, 15 et 30 jours si tu les réussis. Avant de retourner une carte, dis à voix haute ou écris ce que tu sais.

**Ton profil.** Choisis un pseudo, suis tes XP et ton niveau (de « Nouveau compte » à « Légende de l'anglais »), ta série de jours d'affilée et le nombre de cartes acquises. Tu peux aussi **te positionner** dans chaque activité langagière, de l'A1 au B1+, pour voir où tu en es par rapport au niveau visé.

**Les réglages.** Change de classe, ajoute ou retire les années d'avant, choisis l'accent de la voix et sa vitesse, active une police adaptée à la dyslexie, agrandis le texte, et bascule entre l'ambiance jour et l'ambiance nuit.

## Bon à savoir

Ta progression (classe, pseudo, XP, cartes aimées et à revoir, défis, positionnement, réglages) est enregistrée automatiquement dans le navigateur de ton téléphone. Elle ne suit pas si tu changes d'appareil ou si tu effaces les données de navigation. Il n'y a pas de compte, et rien n'est envoyé sur internet.

La voix anglaise est celle installée sur ton appareil : son accent et sa qualité peuvent varier d'un téléphone à l'autre. Si aucune voix anglaise n'est disponible, l'écoute ne fonctionne pas, mais tout le reste oui.

## Conseils d'utilisation

**Pour les élèves.** Quelques minutes par jour suffisent : commence par la révision du jour, puis fais défiler le fil dans le thème que tu veux renforcer. Écoute les mots à voix haute et répète-les. Avant une évaluation, ouvre sa fiche dans l'onglet **Évals** et fais un entraînement avec le chrono pour apprendre à gérer ton temps.

**En classe.** Une carte projetée en début de cours fait un bon rituel de réactivation, et le défi chrono peut se jouer collectivement. Les fiches de l'onglet Évals aident à présenter le format d'une évaluation avant de la faire passer, et le chrono d'entraînement peut rythmer une séance de préparation. Le positionnement dans les activités langagières ouvre aussi un échange sur les progrès de chacun.

**Avec les années d'avant.** Activer les années précédentes est utile en début d'année, ou pour un élève qui a des lacunes : il retrouve les bases sans changer d'outil.

**À la maison.** Les familles peuvent jouer au défi chrono avec leur enfant, ou lui demander d'expliquer une carte en français : pas besoin de parler anglais pour aider.

<script type="text/markdown" id="tuto-the-english-sequence">
## C'est quoi, The English Sequence ?

The English Sequence (« Tea · Toast · Teaching ») est un atelier propulsé par l'intelligence artificielle pour les professeurs d'anglais du collège et du lycée. On choisit son niveau, ses axes culturels, ses activités langagières et sa tâche finale, et l'IA propose une séquence complète : objectifs, séances détaillées, tâches intermédiaires, tâche finale et critères d'évaluation. Un second outil génère une planification annuelle en progression spiralaire.

L'application est gratuite et fonctionne dans le navigateur. Elle s'organise en cinq pages :

| Page | Ce qu'on y trouve |
| --- | --- |
| Atelier | Le générateur de séquences |
| Année | Le générateur de planification annuelle, en progression spiralaire |
| Bibliothèque | Six séquences modèles, de la 6e à la terminale, pour s'inspirer |
| Programmes | Les axes culturels et les niveaux CECRL visés, niveau par niveau |
| À propos | Le fonctionnement de l'outil, ses références et ses limites |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur : tu arrives sur l'**Atelier**.
2. Le menu du haut donne accès aux cinq pages : **Atelier**, **Année**, **Bibliothèque**, **Programmes** et **À propos**.
3. Si tu découvres l'outil, commence par parcourir la **Bibliothèque** : elle montre à quoi ressemble une séquence, avec son axe, son nombre de séances et sa tâche finale.

Une connexion internet est nécessaire : les séquences sont générées en ligne par l'intelligence artificielle.

## Générer une séquence (page Atelier)

Le formulaire se remplit de haut en bas. Presque toutes les rubriques acceptent plusieurs choix.

| Rubrique | Ce que tu choisis |
| --- | --- |
| Niveau(x) | De la 6e à la terminale. Le niveau CECRL visé s'affiche selon le niveau et le statut de la langue (LVA, LVB…) |
| Durée | La longueur de la séquence |
| Axes culturels | Les axes du programme pour le niveau choisi |
| Thème ou notion précise | Une ou plusieurs notions, séparées par des virgules |
| Activités langagières prioritaires | CO, CE, EOC, EOI, EE, médiation |
| Type(s) de tâche finale | Écrite, créative, orale, interaction, audiovisuelle, médiation, projet collaboratif, eTwinning… |
| Supports souhaités | Presse, extrait littéraire, discours, documentaire, film, série, chanson, image, podcast, BD, réseaux sociaux… |
| 🎲 Modalités de travail | Binômes, groupes, jigsaw, think-pair-share, îlots, ateliers tournants, classe inversée, projet… |
| Compétences psychosociales | Empathie, coopération, pensée critique, confiance en soi… |
| Parcours éducatifs | Avenir, santé, citoyen, PEAC |
| Contraintes spécifiques | Facultatif : tout ce que l'IA doit prendre en compte (nombre d'heures, matériel, profil de la classe…) |

Appuie ensuite sur **Générer la séquence**. L'IA propose une séquence complète : objectifs, séances détaillées, tâches intermédiaires, tâche finale et critères d'évaluation. Tu peux ensuite l'adapter, l'imprimer ou l'exporter en PDF.

Astuce : plus tes choix sont précis (une notion claire, une ou deux activités langagières prioritaires, une seule tâche finale), plus la proposition sera cohérente. Les contraintes spécifiques permettent de décrire ta classe en quelques mots, sans jamais nommer d'élève.

## Planifier l'année (page Année)

Cet outil génère une progression annuelle dite « spiralaire » : chaque fait de langue, champ lexical et phénomène phonologique est introduit à un moment précis, puis repris plusieurs fois dans des contextes nouveaux, de façon de plus en plus complexe.

1. Choisis le niveau, le statut de la langue, le niveau CECRL de départ et le niveau visé.
2. Indique le nombre de séquences de l'année.
3. Coche les axes culturels à couvrir. L'application conseille de tous les sélectionner pour une couverture annuelle complète.
4. Ajoute si tu le souhaites un fil rouge annuel et tes priorités ou contraintes.
5. Appuie sur **Générer la planification annuelle**.

## S'inspirer (page Bibliothèque)

La Bibliothèque propose six séquences modèles, avec leur niveau CECRL, leur axe, leur nombre de séances et leur tâche finale : A Day at a British School (6e-5e), Around the World in 80 Days (4e-3e), Voices of the Civil Rights Movement (3e-seconde), Fake News & Digital Citizens (seconde-première), Welcome to the Dystopia (première-terminale) et Can Machines Be Moral? (terminale).

## Ce qu'il faut savoir

**Les séquences sont produites par une IA.** L'application le rappelle elle-même : ce sont des points de départ, pas des fiches officielles. Relis chaque proposition, vérifie que les supports cités existent et sont adaptés à ton public, et ajuste les modalités et l'évaluation à ta classe.

**Vérifie les références aux programmes.** Pour le collège, la page Programmes reprend les axes culturels et les niveaux CECRL des programmes de 2025. Pour le lycée, compare toujours les axes proposés avec les programmes officiels publiés sur Éduscol avant de t'en servir dans une progression.

**Tes choix sont envoyés à un service d'IA en ligne** pour produire la séquence. N'écris jamais de nom d'élève ou d'informations personnelles dans les contraintes spécifiques : décris la classe de façon générale (« classe hétérogène de 4e, deux élèves dys »).

## Conseils d'utilisation

**Partir de sa propre idée.** Le plus efficace est d'avoir déjà en tête l'axe, la notion et la tâche finale, puis de laisser l'IA proposer un déroulé. On compare ensuite avec ce qu'on aurait fait soi-même, et on garde le meilleur des deux.

**Générer plusieurs propositions.** Changer un seul paramètre (le type de tâche finale, les supports, la modalité de travail) permet d'obtenir des variantes et de choisir celle qui convient le mieux à la classe.

**Pour les stagiaires et leurs tuteurs.** Une séquence générée peut devenir un support d'analyse : est-elle cohérente avec la tâche finale ? Les tâches intermédiaires y préparent-elles vraiment ? Les supports sont-ils accessibles au niveau visé ? C'est aussi une bonne occasion de développer un regard critique sur les propositions d'une IA.

**En début d'année.** La page Année peut servir de base pour construire sa progression, à confronter ensuite aux programmes officiels et aux choix de l'équipe disciplinaire.
</script>

<script type="text/markdown" id="tuto-verb-dojo">
## C'est quoi, Verb Dojo ?

Verb Dojo t'aide à maîtriser les verbes irréguliers anglais, comme un entraînement d'arts martiaux : tu comprends la règle, tu t'entraînes, et tu progresses de niveau en niveau. L'application contient 92 verbes irréguliers, avec leur traduction et leur prononciation.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle s'organise en six onglets :

| Onglet | À quoi il sert |
| --- | --- |
| 🏠 Accueil | Ton niveau, tes XP, ta série de jours et des raccourcis vers les activités |
| 📖 Règles | Comprendre les trois formes d'un verbe et les quatre familles |
| 📋 Liste | Les 92 verbes, avec recherche, filtre par famille et prononciation |
| 🧠 Memory | Retrouver les paires de cartes |
| 🎯 Quiz | Cinq modes d'entraînement |
| 🏆 Progression | Ton niveau, tes résultats par famille et tes badges |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Sur l'**Accueil**, trois boutons te lancent directement : **🎯 Lancer un quiz**, **🧠 Jouer au memory** et **📖 Voir les règles**. Si c'est la première fois, commence par les règles.
3. Les onglets en haut de l'écran te permettent de passer d'une activité à l'autre à tout moment.
4. En haut à droite, tu vois toujours ton niveau, tes XP et ta série de jours (🔥).

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

Ta progression est enregistrée automatiquement sur ton appareil. Utilise toujours le même appareil et le même navigateur pour la retrouver.

## Comprendre la règle (onglet Règles)

Un verbe irrégulier a trois formes à connaître :

- **V1, la base** : au présent et après will, can, to… (I go, to go, I will go).
- **V2, le prétérit** : pour une action terminée dans le passé (Yesterday, I went to school).
- **V3, le participe passé** : avec have / has (present perfect) et à la voix passive (I have never gone there).

Pour retenir plus facilement, l'application range les verbes en quatre familles, selon les formes qui se ressemblent :

| Famille | Ce qui se passe | Exemple | Nombre de verbes |
| --- | --- | --- | --- |
| AAA | Les 3 formes sont identiques | cut – cut – cut | 12 |
| ABA | La base et le participe passé sont identiques | come – came – come | 3 |
| ABB | Le prétérit et le participe passé sont identiques | buy – bought – bought | 40 |
| ABC | Les 3 formes sont toutes différentes | go – went – gone | 37 |

Astuce : apprends les verbes par famille plutôt que dans l'ordre alphabétique, et répète-les à voix haute, en rythme : « go, went, gone ».

## Consulter les verbes (onglet Liste)

La liste affiche les 92 verbes avec leurs trois formes et leur traduction.

- Tape un mot dans la barre de recherche pour trouver un verbe en anglais ou en français.
- Utilise les filtres pour n'afficher qu'une famille (AAA, ABA, ABB ou ABC).
- Appuie sur 🔊 pour entendre la prononciation.

## Jouer au memory (onglet Memory)

1. Choisis la taille de la grille : **6**, **8** ou **12 paires**.
2. Retourne deux cartes : il faut associer un verbe de base à sa paire prétérit / participe passé.
3. Si les deux cartes vont ensemble, elles restent visibles. Sinon, elles se retournent : essaie de te souvenir de leur place.
4. Quand la grille est terminée, ton nombre de coups et d'erreurs s'affiche. **🔄 Nouvelle partie** relance une grille.

Chaque paire trouvée rapporte 5 XP, une grille terminée 15 XP de plus, et une grille sans aucune erreur encore 15 XP de bonus (« Mémoire parfaite 💎 »).

## S'entraîner (onglet Quiz)

Choisis un mode d'entraînement. Les questions s'enchaînent toutes seules, avec la correction immédiate.

| Mode | Ce que tu fais | XP par bonne réponse |
| --- | --- | --- |
| QCM Prétérit | Choisir le prétérit d'un verbe parmi quatre propositions | 10 |
| QCM Participe | Choisir le participe passé parmi quatre propositions | 10 |
| Texte à trous (passé) | Compléter « Yesterday, She ___ (to go) » avec le prétérit, puis **Valider** | 10 |
| Texte à trous (perfect) | Compléter « She has never ___ (to go) before » avec le participe passé | 10 |
| Saisie libre | Écrire toi-même le prétérit et le participe passé d'un verbe | 15 |

En cas d'erreur, la bonne réponse s'affiche : lis-la bien avant la question suivante. Pour le verbe be, was et were sont acceptés au prétérit.

## Suivre sa progression (onglet Progression)

Toutes les 100 XP, tu passes au niveau supérieur. L'onglet **Progression** affiche ton niveau, les XP qu'il te manque pour le suivant, ton nombre de quiz réussis et tes bonnes réponses dans chaque famille.

Tu peux aussi débloquer des badges :

| Badge | Comment l'obtenir |
| --- | --- |
| 🌱 Premier pas | Faire un premier quiz ou un premier memory |
| ⭐ 🌟 🏆 100, 500, 1000 XP | Atteindre ce nombre de points |
| 🎯 25 et 75 bonnes réponses | Accumuler des bonnes réponses au quiz |
| 🔵 🟢 🟠 🟣 Maître AAA, ABA, ABB, ABC | Réussir de nombreuses questions dans une même famille |
| 🧠 Mémoire d'élite | Terminer 3 grilles de memory |
| 💎 Mémoire parfaite | Terminer une grille sans aucune erreur |
| 🔥 Série de 3 et de 7 jours | T'entraîner plusieurs jours d'affilée |

Attention : le bouton **🗑️ Réinitialiser ma progression** efface définitivement tes XP, ton niveau et tes badges. L'application te demande de confirmer avant.

## Conseils d'utilisation

**Pour les élèves.** Mieux vaut 10 minutes par jour qu'une heure la veille du contrôle. Commence par une famille, par exemple les AAA, puis passe aux ABB et aux ABC. Alterne les modes : le memory pour découvrir, les QCM pour reconnaître, la saisie libre pour vérifier que tu sais vraiment.

**En classe.** En début de cours, quelques minutes de QCM ou de texte à trous projetés au tableau font un bon rituel de réactivation. On peut aussi organiser un défi memory en binômes, ou demander aux élèves de viser un badge de famille pour la semaine.

**À la maison.** Les parents peuvent faire réciter les verbes avec la liste et le bouton 🔊, sans avoir besoin de parler anglais, ou regarder avec l'enfant les badges qu'il a débloqués.

**À savoir.** Aucune donnée n'est envoyée sur internet : tout reste dans le navigateur de l'appareil. Si l'élève change d'appareil ou efface les données de navigation, sa progression ne suit pas.
</script>

<script type="text/markdown" id="tuto-verbetes">
## C'est quoi, Verbêtes ?

Verbêtes transforme la conjugaison française en jeu de cartes à collectionner. Chaque verbe est une créature, une **Verbête**, qu'on obtient dans des boosters, qu'on fait évoluer en la conjuguant correctement, et qu'on envoie en combat. Un labo de grammaire fait aussi travailler la nature des mots, et un grimoire rassemble les règles et les astuces.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle rassemble 58 verbes, des plus réguliers aux plus irréguliers (être, avoir, aller, faire, prendre, s'asseoir…), répartis en quatre types selon leur groupe :

| Type | Verbes | Exemples |
| --- | --- | --- |
| ⭐ Astre | Être et avoir | être, avoir |
| Braise | 1er groupe | chanter, manger, appeler, envoyer |
| Sève | 2e groupe | finir, choisir, grandir |
| Cristal | 3e groupe | aller, faire, prendre, voir, peindre |

Chaque carte a aussi une rareté : Commune, Rare, Épique ou Légendaire.

L'application s'adapte à la classe :

| Classe | Ce qu'on travaille |
| --- | --- |
| 6e | Présent, imparfait, futur, passé composé, impératif, passé simple aux 3es personnes ; cinq natures de mots |
| 5e | En plus : plus-que-parfait, conditionnel, passé simple à toutes les personnes ; adverbe et préposition |
| 4e | En plus : subjonctif présent ; tous les verbes ; les huit natures |
| 3e | Révision complète |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Écris ton prénom ou un pseudo, choisis ta classe, puis ta première Verbête parmi trois : chanter, finir ou prendre.
3. Tu commences avec 10 gouttes d'encre 💧, de quoi ouvrir ton premier booster.
4. En haut, les onglets permettent de naviguer : **🗂️ Classeur**, **🎯 Entraîne**, **⚔️ Combat**, **🖍️ Labo** et **📖 Grimoire**. Le bouton ⚙️ ouvre les réglages.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Collectionner (onglet Classeur)

Le classeur rassemble toutes les cartes de ta classe : celles que tu possèdes, et des emplacements vides pour celles qu'il te reste à trouver. Filtre-les par type ou n'affiche que les tiennes. Avec 10 gouttes d'encre 💧, ouvre un **booster** de 3 cartes : retourne-les une à une pour découvrir tes nouvelles Verbêtes. Un doublon te rapporte des points d'expérience pour la carte.

Touche une carte pour voir sa fiche : son groupe, son auxiliaire, son participe passé, sa rareté, ses forces et faiblesses en combat, et son **pouvoir mnémo**, une astuce pour retenir sa conjugaison. Par exemple, pour être : « vous êtes » comme « vous faites » et « vous dites », les seuls en -tes.

## Faire évoluer ses cartes (onglet Entraîne)

Choisis les temps à travailler et les verbes (tous ceux de ta classe ou seulement tes cartes), puis conjugue : la personne est affichée, tu écris la forme. Chaque bonne réponse rapporte une goutte d'encre 💧 et fait progresser la carte :

| Stade | Quand |
| --- | --- |
| Base | Dès que tu obtiens la carte |
| Évolution | À 10 réussites : la créature change d'apparence |
| Maître | À 25 réussites : la carte devient holographique |

À la fin de la série, un bilan te dit où tu en es et te renvoie, si besoin, vers les pouvoirs mnémo du Grimoire.

## Combattre (onglet Combat)

Choisis une équipe de 3 cartes, puis affronte un adversaire de plus en plus fort : Noa, élève de 6e et joueur du dimanche, Inès, cheffe du club lecture, ou le Professeur Plume, maître des conjugaisons. Tu peux aussi jouer à deux sur le même appareil. Pour attaquer, il faut conjuguer correctement le verbe demandé, au temps et à la personne indiqués. Les types comptent : Braise est forte contre Sève, Sève contre Cristal, et Cristal contre Braise. En cas de doute, une **potion mnémo** donne un indice.

## Le labo de grammaire (onglet Labo)

Dans le Labo, des phrases s'affichent : colorie chaque mot selon sa nature. Choisis un crayon (nom, verbe, déterminant, adjectif, pronom, puis adverbe, préposition et conjonction selon ta classe), puis touche les mots. Chaque nature a son astuce, par exemple pour le nom : « Je peux mettre un déterminant devant ». Les mots grisés sont pour les classes suivantes.

## Les règles (onglet Grimoire)

Le Grimoire rassemble, temps par temps, la règle à retenir, des astuces et les pièges classiques. Par exemple, pour le présent : avec tu, toujours un s, sauf tu peux, tu veux, tu vaux. Pour l'imparfait : le radical de « nous » au présent, plus ais, ais, ait, ions, iez, aient.

## Réglages et sauvegarde

Le bouton ⚙️ permet de changer de classe, de choisir précisément les temps à travailler, d'activer ou non le passé simple limité aux 3es personnes, d'activer le **mode lecture facilitée**, et de régler l'aide aux accents : automatique, toujours visibles, derrière un bouton, ou masquée. Tu y retrouves aussi tes statistiques : bonnes réponses, combats gagnés, phrases du Labo réussies.

Ta collection et tes réglages sont enregistrés automatiquement dans le navigateur de ton appareil. Ils ne suivent pas si tu changes d'appareil ou si tu effaces les données de navigation, et rien n'est envoyé sur internet.

## Conseils d'utilisation

**Pour les élèves.** Entraîne-toi un peu chaque jour sur un ou deux temps à la fois, plutôt que tout mélanger. Avant de répondre, pense au pouvoir mnémo de la carte. Et quand tu te trompes, va relire la page du temps dans le Grimoire : les pièges y sont expliqués.

**En classe.** Les combats à deux sur un même appareil font un bon moment de révision en binômes, et un combat contre le Professeur Plume peut se mener collectivement au tableau. Le Labo se prête bien à un rituel de grammaire en début d'heure. On peut adapter les temps travaillés dans les réglages pour coller à la séquence en cours.

**À la maison.** L'élève peut s'entraîner en autonomie, et les familles retrouvent dans le Grimoire les règles et les astuces pour l'accompagner.
</script>
