    border: 3px solid var(--navy);
    cursor: pointer;
  }
  .btn-rouge { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-bleu { background: #fff; color: var(--navy); }
  .btn-rouge:hover { background: #B71C18; border-color: #B71C18; }
  .btn-bleu:hover { background: var(--tile); }
  .vide {
    padding: 26px;
    border: 3px dashed var(--rule);
    border-radius: 16px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 50px;
  }

  /* ---------- Archives ---------- */
  .archives { list-style: none; margin: 0 0 50px; padding: 0 0 0 24px; border-left: 8px solid var(--line); }
  .archives > li { position: relative; margin-bottom: 26px; }
  .archives > li::before {
    content: "";
    position: absolute;
    left: -42px; top: 6px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 6px solid var(--navy);
  }
  .archives h3 { margin: 0 0 6px; font-family: "Kalam", "Comic Sans MS", cursive; font-size: 1.3rem; color: var(--navy); }
  .archives ul { margin: 0; padding-left: 20px; }

  /* ---------- Lecture d'un article ---------- */
  .retour { display: inline-block; margin: 26px 0 0; font-weight: 700; }
  article.lecture { max-width: 760px; margin: 0 auto 60px; }
  .lecture-tete { display: flex; align-items: center; gap: 18px; margin: 22px 0 18px; }
  .lecture-tete img { width: 120px; flex: none; }
  article.lecture h1 {
    font-family: "Kalam", "Comic Sans MS", cursive;
    font-weight: 700;
    font-size: clamp(1.8rem, 4.6vw, 2.5rem);
    line-height: 1.2;
    margin: 0 0 18px;
    color: var(--navy-deep);
  }
  article.lecture h2 {
    font-family: "Kalam", "Comic Sans MS", cursive;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--navy);
    margin: 32px 0 8px;
    padding-left: 16px;
    border-left: 8px solid var(--rubrique-couleur, var(--line));
  }
  article.lecture p { margin: 0 0 16px; }
  .integration { margin: 22px 0 26px; }
  .integration-cadre { position: relative; width: 100%; height: 780px; max-height: 80vh; border: 3px solid var(--navy); border-radius: 14px; overflow: hidden; background: var(--tile); }
  .integration-cadre iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .integration figcaption { margin-top: 8px; font-size: 0.92rem; }
  @media (max-width: 520px) { .integration-cadre { height: 70vh; } }
  .separateur { border: 0; height: 8px; margin: 30px 0 22px; background: repeating-linear-gradient(90deg, var(--red) 0 40px, transparent 40px 52px, var(--navy) 52px 92px, transparent 92px 104px); border-radius: 4px; }
  .liens { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .liens .btn { white-space: normal; text-align: left; }
  .btn-tuto { background: #FFD329; border-color: #FFD329; color: var(--navy-deep); }
  .btn-tuto:hover { background: #F2C200; border-color: #F2C200; }
  article.tuto h3 { font-family: "Kalam", "Comic Sans MS", cursive; font-size: 1.25rem; color: var(--navy); margin: 22px 0 6px; }
  article.tuto ol, article.tuto ul { margin: 0 0 16px; padding-left: 28px; }
  article.tuto li { margin-bottom: 6px; }
  article.tuto li > ul, article.tuto li > ol { margin: 6px 0 0; }
  article.tuto code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.92em; background: var(--tile); padding: 1px 6px; border-radius: 4px; }
  .tableau { overflow-x: auto; margin: 0 0 18px; border: 2px solid var(--rule); border-radius: 12px; }
  .tableau table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
  .tableau th { background: var(--navy); color: #fff; text-align: left; padding: 9px 12px; font-weight: 700; }
  .tableau td { padding: 8px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
  .tableau tbody tr:nth-child(even) td { background: var(--tile); }
  .panneau {
    margin-top: 34px;
    padding: 22px 24px;
    border-radius: 16px;
    background: var(--navy);
    color: #fff;
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }
  .panneau .roundel { border-color: var(--red); }
  .panneau .roundel::after { background: #fff; }
  .panneau-texte { flex: 1; min-width: 220px; }
  .panneau p { margin: 0 0 12px; font-weight: 700; font-size: 1.1rem; }
  .panneau .btn-bleu { border-color: #fff; }
  .partage { font-size: 0.9rem; min-height: 1.4em; margin: 10px 0 0 !important; font-weight: 400 !important; }

  .accueil-flottant {
    position: fixed;
    right: 18px; bottom: 18px;
    z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--navy);
    border: 6px solid var(--red);
    color: #fff;
    text-decoration: none;
    font-size: 0.7rem;
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(16, 41, 122, .3);
  }
  .accueil-flottant[hidden] { display: none; }
  .accueil-flottant svg { width: 26px; height: 26px; }
  .accueil-flottant:hover { background: var(--navy-deep); }
  footer.site {
    background: var(--navy);
    color: #fff;
    padding: 24px 0 30px;
    font-size: 0.92rem;
  }
  footer.site a { color: #fff; }

  @media (max-width: 520px) {
    body { font-size: 17px; }
    .cartes { grid-template-columns: 1fr; }
    .carte { padding: 16px 16px 20px; }
    .lecture-tete img { width: 88px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rubriques img { transition: none; }
    .rubriques button:hover img { transform: none; }
  }
  @media print {
    .hero, .rubriques, .iconbar, .search, .actions, .retour, footer.site, .accueil-flottant { display: none !important; }
    .panneau { display: none !important; }
    .tableau { overflow: visible; border: 1px solid #999; }
    .tableau th { background: #eee !important; color: #000; }
    article.lecture { max-width: none; }
  }

/* BROT2YOU V5 : HABILLAGE FANTASY — CONTENU ET ROUTEUR CONSERVÉS */
:root {--navy:#123c91;--navy-deep:#102e70;--red:#ec653d;--ink:#182b55;--muted:#556a89;--paper:#f6f3ff;--tile:#fff9e9;--rule:#e1d4bb;--focus:#ffdb46;--line:#2877db}
body {background:linear-gradient(180deg,#e5f5ff 0%,#f5f0ff 38%,#fff8e9 100%); background-attachment:fixed;}
header {background:linear-gradient(#dbf4ff,#fff9ec);box-shadow:0 8px 25px #1a4b8d20;}
.hero {background:#bde8ff;overflow:hidden;border-bottom:5px solid #e7b65e;}
.hero img {display:block;width:100%;max-width:1600px;height:auto;aspect-ratio:16/9;object-fit:contain;object-position:center;margin:auto;}
header .wrap {max-width:1320px;}
.rubriques {gap:12px;padding:22px 0 15px;}
.rubriques button {border:2px solid #e9c779;background:linear-gradient(#fffef5,#ffedca);border-radius:19px;padding:8px 4px 12px;box-shadow:0 5px 0 #d8a84c,0 9px 20px #294f8522;transition:transform .15s ease;}
.rubriques button:hover {transform:translateY(-3px);}
.rubriques button[aria-pressed="true"] {background:#fff3c1;box-shadow:0 5px 0 #c68e2c,0 0 0 3px #ffd650;}
.vignette-label {background:#1d4d9b;border-radius:7px;clip-path:none;transform:none;font-family:inherit;font-weight:800;}
.iconbar {background:linear-gradient(180deg,#3375d3,#123e9b);border:3px solid #f2c46b;border-radius:20px;box-shadow:0 5px 0 #b8893b,0 9px 22px #1c438e3a; padding:6px 8px;margin:8px 0 22px;}
.iconbar a,.iconbar button {color:#fff !important;font-weight:800;border-radius:12px;}
.iconbar a:hover,.iconbar button:hover,.iconbar [aria-current="page"],.iconbar [aria-expanded="true"] {background:linear-gradient(#ffe878,#ffb82c) !important;color:#143674 !important;}
.iconbar li + li::before {background:#87b7ef;}
.search input {border:2px solid #e3b957;border-radius:18px;background:#fffdf7;padding:12px 16px;}
main.wrap {max-width:1320px;padding-top:30px;padding-bottom:40px;}
.cartes {gap:22px;}
.carte {background:linear-gradient(160deg,#fffef9,#fff5dd);border:2px solid #eac36f;border-radius:22px;box-shadow:0 6px 0 #d5a757,0 12px 26px #24477b21;overflow:hidden;transition:transform .15s ease;}
.carte:hover {transform:translateY(-3px);}
.carte h2 a {color:#183d8b;}
.btn {border-radius:13px;box-shadow:0 3px 0 #b58b45;font-weight:800;}
.btn-rouge {background:linear-gradient(#ffdf69,#ffb82c);border-color:#d79b37;color:#183a7c;}
.btn-bleu {background:#fff;border-color:#b4c7e9;color:#183d8b;}
.btn-tuto {background:linear-gradient(#ffe87a,#ffcf3c);border-color:#d9a03a;}
footer.site {background:#173d85;color:white;border-top:5px solid #e5b958;}
@media(max-width:700px){.hero img {aspect-ratio:16/9;object-fit:contain;object-position:center;}.rubriques{gap:8px;padding:14px 0}.rubriques li{flex:0 0 calc(33.333% - 6px)}.rubriques button{border-radius:14px}.iconbar{border-radius:14px;margin:10px 0 16px}.carte{border-radius:18px}main.wrap{padding-top:20px}}
@media(prefers-reduced-motion:reduce){.carte,.rubriques button{transition:none}}

</style>

  // Anciennes rubriques regroupées : un article qui les utilise encore
  // est rangé automatiquement dans la nouvelle rubrique.
  var ALIAS_RUBRIQUES = { outils: "apps", conseils: "classe", reflexions: "classe" };

  // « rubrique » peut être un texte ("apps") ou une liste (["ia", "classe"]) :
  // la première rubrique de la liste est la rubrique principale de l'article.
  function rubriquesDe(a) {
    var brut = a.rubrique;
    var liste = Object.prototype.toString.call(brut) === "[object Array]" ? brut : [brut];
    var res = [];
    for (var i = 0; i < liste.length; i++) {
      var id = String(liste[i] || "");
      if (ALIAS_RUBRIQUES.hasOwnProperty(id)) id = ALIAS_RUBRIQUES[id];
      if (id && res.indexOf(id) === -1) res.push(id);
    }
    return res;
  }

  function rubriqueDe(a) {
    return rubriquesDe(a)[0] || "";

  /* ---------- Outils ---------- */
  function echapper(txt) {
    return String(txt === undefined || txt === null ? "" : txt)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function urlSure(url) { return /^https?:\/\//i.test(url || "") ? url : ""; }
  function emailSur(m) { return /^[^@\s"<>]+@[^@\s"<>]+\.[^@\s"<>]+$/.test(m || "") ? m : ""; }
  function enrichir(txt) {
    var h = echapper(txt);
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function (m, t, u) {
      return '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>";
    });
    return h;
  }
  function sansAccents(txt) {
    var s = String(txt || "").toLowerCase();
    if (s.normalize) s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    return s;
  }
  function formaterDate(iso) {
    var p = String(iso || "").split("-");
    var mois = p.length === 3 ? MOIS[parseInt(p[1], 10) - 1] : null;
    return mois ? parseInt(p[2], 10) + " " + mois + " " + p[0] : echapper(iso);
  }
  function trier(liste) {
    return liste.slice().sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });
  }
  function rubrique(id) {
    for (var i = 0; i < RUBRIQUES.length; i++) if (RUBRIQUES[i].id === id) return RUBRIQUES[i];
    return null;
  }
  function compter(id) {
    var n = 0;
    for (var i = 0; i < articles.length; i++) if (rubriquesDe(articles[i]).indexOf(id) !== -1) n++;
    return n;
  }
  function iconeArticle(a) {
    var v = String(a.icone || "");
    if (!v) return "";
    if (ICONES_APPS.hasOwnProperty(v)) return ICONES_APPS[v];
    if (/^(https?:\/\/|images\/|\.\/)[^"'<>\s()]+$/i.test(v)) return v;
    return "";
  }

  function svg(nom) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONES[nom] + "</svg>";
  }

  /* ---------- En-tête : rubriques et icônes ---------- */
  function construireRubriques(actif) {
    var h = "";
    for (var i = 0; i < RUBRIQUES.length; i++) {
      var r = RUBRIQUES[i];
      var n = articles ? compter(r.id) : 0;
      var etiquette = r.nom + (n ? ", " + n + " article" + (n > 1 ? "s" : "") : ", pas encore d'article");
      h += '<li><button type="button" data-rubrique="' + r.id + '" aria-pressed="' + (actif === r.id) + '" aria-label="' + echapper(etiquette) + '" style="--rubrique-couleur:' + r.couleur + '">';
      if (r.img) h += '<img src="' + r.img + '" alt="" width="200" height="197">';
      else h += '<span class="vignette"><img src="' + r.vignette + '" alt="" width="200" height="197"><span class="vignette-label" aria-hidden="true">' + echapper(r.court || r.nom) + "</span></span>";
      if (n) h += '<span class="compte" aria-hidden="true">' + n + "</span>";
      h += "</button></li>";
    }
    rubriquesEl.innerHTML = h;
    var b = rubriquesEl.querySelectorAll("button");
    for (var j = 0; j < b.length; j++) {
      b[j].addEventListener("click", function () {
        var id = this.getAttribute("data-rubrique");
        aller(routeCourante === "#/rubrique/" + id ? "#/" : "#/rubrique/" + id);
      });
    }
  }

  function construireIcones(page) {
    var items = [
      { cle: "accueil", nom: "Accueil", href: "#/" },
      { cle: "recherche", nom: "Rechercher", bouton: true },
      { cle: "archives", nom: "Archives", href: "#/archives" }
    ];
    if (urlSure(reglages.hubUrl)) items.push({ cle: "hub", nom: "Les apps", href: reglages.hubUrl, externe: true });
    if (emailSur(reglages.email)) items.push({ cle: "email", nom: "Contact", href: "mailto:" + reglages.email });
    if (urlSure(reglages.instagram)) items.push({ cle: "instagram", nom: "Instagram", href: reglages.instagram, externe: true });
    if (urlSure(reglages.youtube)) items.push({ cle: "youtube", nom: "YouTube", href: reglages.youtube, externe: true });
    if (urlSure(reglages.x)) items.push({ cle: "x", nom: "X", href: reglages.x, externe: true });

    var h = "";
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += "<li>";
      if (it.bouton) {
        h += '<button type="button" id="btn-recherche" aria-controls="search" aria-expanded="' + (!searchEl.hidden) + '">' + svg(it.cle) + "<span>" + it.nom + "</span></button>";
      } else {
        var courant = (page === it.cle) ? ' aria-current="page"' : "";

        h += '<a href="' + echapper(it.href) + '"' + courant + ext + ">" + svg(it.cle) + "<span>" + it.nom + "</span></a>";

      } else {
        searchInput.value = "";
        recherche = "";
        router();
      }
    });
  }

  /* ---------- Vues ---------- */

  function boutonApp(a, classe) {

  }

  function carte(a) {
    var r = rubrique(rubriqueDe(a)) || RUBRIQUES[0];
    var lien = "#/" + encodeURIComponent(a.id);
    var h = '<li class="carte" style="--rubrique-couleur:' + r.couleur + '">';

    h += '<div class="carte-tete">' + (ico ? '<img class="avatar avatar-app" src="' + echapper(ico) + '" alt="" width="62" height="62">' : '<span class="avatar" style="background-image:url(' + (r.img || r.vignette) + ')" aria-hidden="true"></span>') + '<div>';

  function vueListe(idRubrique) {
    var r = idRubrique ? rubrique(idRubrique) : null;
    var liste = trier(articles);
    if (r) liste = liste.filter(function (a) { return rubriquesDe(a).indexOf(r.id) !== -1; });
    if (recherche) {
      var q = sansAccents(recherche);
      liste = liste.filter(function (a) {
        return sansAccents([a.titre, a.resume, a.appNom, (a.contenu || []).join(" ")].join(" ")).indexOf(q) !== -1;
      });
    }
    var titre = r ? r.nom : (recherche ? "Résultats de recherche" : "Derniers articles");
    var h = titreStation(titre, r ? r.couleur : null);

      else if (r) h += '<p class="vide">Pas encore d\'article dans la rubrique ' + echapper(r.nom) + '. <a href="#/">Voir tous les articles</a></p>';
      else h += '<p class="vide">Aucun article pour le moment.</p>';

    }

    document.title = (r ? r.nom + " | " : "") + (reglages.titre || "BROT2YOU");
  }

  function vueArchives() {
    var liste = trier(articles);
    var groupes = [], cle = null;
    for (var i = 0; i < liste.length; i++) {
      var p = String(liste[i].date || "").split("-");

      if (k !== cle) { groupes.push({ nom: k, items: [] }); cle = k; }
      groupes[groupes.length - 1].items.push(liste[i]);

  /* ---------- Tutos ---------- */
  function tutoDe(a) {
    var el = document.getElementById("tuto-" + a.id);

    return t.replace(/\s/g, "") ? t : "";
  }

  function boutonTuto(a, classe) {

    var ext = urlSure(a.tutoUrl);
    if (ext) return '<a class="btn ' + classe + '" href="' + echapper(ext) + '" target="_blank" rel="noopener"><span aria-hidden="true">📘</span> Tuto</a>';
    return "";
  }

  function mdLigne(txt) {
    var h = echapper(txt);
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function (m, t, u) {
      return '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>";
    });
    return h;
  }

  function mdCellules(ligne) {
    var l = ligne.replace(/^\s*\|/, "").replace(/\|\s*$/, "");
    return l.split("|");
  }

  function mdListe(items, i, niveau) {
    var type = items[i].type;
    var tag = type === "ol" ? "ol" : "ul";
    var h = "<" + tag + ">";
    while (i < items.length && items[i].niveau >= niveau) {
      if (items[i].niveau > niveau) {
        var sous = mdListe(items, i, items[i].niveau);
        h = h.replace(/<\/li>$/, sous.html + "</li>");
        i = sous.i;
        continue;
      }
      if (items[i].type !== type) break;
      h += "<li>" + mdLigne(items[i].texte) + "</li>";
      i++;
    }
    return { html: h + "</" + tag + ">", i: i };
  }

  function markdown(texte) {
    var lignes = String(texte).replace(/\r/g, "").split("\n");
    var h = "", para = [], i = 0, m;
    function fermerPara() {
      if (para.length) { h += "<p>" + mdLigne(para.join(" ")) + "</p>"; para = []; }
    }
    while (i < lignes.length) {
      var l = lignes[i];
      if (/^\s*$/.test(l)) { fermerPara(); i++; continue; }
      if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) {
        fermerPara();
        var n = Math.min(Math.max(m[1].length, 2), 4);
        h += "<h" + n + ">" + mdLigne(m[2]) + "</h" + n + ">";
        i++; continue;
      }
      if (/^\s*\|/.test(l) && i + 1 < lignes.length && /^\s*\|?\s*:?-{3,}/.test(lignes[i + 1])) {
        fermerPara();
        var tete = mdCellules(l);
        h += '<div class="tableau"><table><thead><tr>';
        for (var c = 0; c < tete.length; c++) h += "<th>" + mdLigne(tete[c].replace(/^\s+|\s+$/g, "")) + "</th>";
        h += "</tr></thead><tbody>";
        i += 2;
        while (i < lignes.length && /^\s*\|/.test(lignes[i])) {
          var cel = mdCellules(lignes[i]);
          h += "<tr>";
          for (var d = 0; d < cel.length; d++) h += "<td>" + mdLigne(cel[d].replace(/^\s+|\s+$/g, "")) + "</td>";
          h += "</tr>";
          i++;
        }
        h += "</tbody></table></div>";
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
        fermerPara();
        var items = [];
        while (i < lignes.length && (m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lignes[i]))) {
          items.push({ niveau: m[1].length >= 2 ? 1 : 0, type: /\d/.test(m[2]) ? "ol" : "ul", texte: m[3] });
          i++;
        }
        var pos = 0;
        while (pos < items.length) {
          var res = mdListe(items, pos, items[pos].niveau);
          h += res.html;
          pos = res.i;
        }
        continue;
      }
      para.push(l.replace(/^\s+|\s+$/g, ""));
      i++;
    }
    fermerPara();
    return h;
  }

  function vueTuto(a) {
    var r = rubrique(rubriqueDe(a)) || RUBRIQUES[0];
    var ico = iconeArticle(a);
    var nom = a.appNom || a.titre;
    var h = '<a class="retour" href="#/' + encodeURIComponent(a.id) + '">← Retour à l\'article</a>';
    h += '<article class="lecture tuto" style="--rubrique-couleur:' + r.couleur + '">';
    h += '<div class="lecture-tete">' + (ico ? '<img class="icone-app" src="' + echapper(ico) + '" alt="" width="120" height="120">' : '<img src="' + (r.img || r.vignette) + '" alt="" width="200" height="197">') + "<div>";
    h += '<span class="etiquette">📘 Tuto</span>';
    h += '<p class="date">Mode d\'emploi pas à pas</p></div></div>';
    h += "<h1>Tuto : " + echapper(nom) + "</h1>";
    h += markdown(tutoDe(a));
    h += '<div class="panneau"><span class="roundel" aria-hidden="true"></span><div class="panneau-texte">';
    h += "<p>" + (urlSure(a.appUrl) ? "Prêt à essayer ?" : "Partager ce tuto :") + "</p>";
    h += '<div class="actions">' + boutonApp(a, "btn-rouge");
    h += '<button type="button" class="btn btn-bleu" id="imprimer">Imprimer le tuto</button>';
    h += '<button type="button" class="btn btn-bleu" id="partager">Copier le lien du tuto</button></div>';
    h += '<p class="partage" id="partage" role="status"></p></div></div>';
    h += "</article>";
    mainEl.innerHTML = h;
    document.getElementById("imprimer").addEventListener("click", function () { window.print(); });
    document.getElementById("partager").addEventListener("click", function () { copier(adresseArticle(a, "tuto/")); });
    document.title = "Tuto : " + nom + " | " + (reglages.titre || "BROT2YOU");
  }

  /* ---------- Contenus intégrés (Pearltrees, YouTube, Genially…) ---------- */
  // Seuls ces sites peuvent être intégrés dans un article.
  var SITES_INTEGRABLES = [
    "www.pearltrees.com", "pearltrees.com",
    "www.youtube-nocookie.com", "www.youtube.com",
    "view.genial.ly", "app.genial.ly",
    "padlet.com", "learningapps.org", "wordwall.net",
    "docs.google.com", "www.canva.com", "h5p.org"
  ];

  function blocIntegration(params) {
    var morceaux = String(params).split("|");
    var url = (morceaux[0] || "").replace(/^\s+|\s+$/g, "");
    var titre = (morceaux[1] || "Contenu intégré").replace(/^\s+|\s+$/g, "");
    var m = /^https:\/\/([^\/?#]+)/i.exec(url);
    if (!m || SITES_INTEGRABLES.indexOf(m[1].toLowerCase()) === -1) {
      return urlSure(url) ? '<p><a href="' + echapper(url) + '" target="_blank" rel="noopener">' + echapper(titre) + "</a></p>" : "";
    }
    var lien = url.replace(/[?&]embed=[^&]*/, "").replace(/[?&]d=[^&]*/, "");
    return '<figure class="integration"><div class="integration-cadre">' +
      '<iframe src="' + echapper(url) + '" title="' + echapper(titre) + '" loading="lazy" allowfullscreen ' +
      'sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-presentation"></iframe></div>' +
      '<figcaption><a href="' + echapper(lien) + '" target="_blank" rel="noopener">↗ Ouvrir « ' + echapper(titre) + ' » dans un nouvel onglet</a></figcaption></figure>';
  }

  function vueArticle(a) {
    var r = rubrique(rubriqueDe(a)) || RUBRIQUES[0];
    var h = '<a class="retour" href="#/">← Tous les articles</a>';
    h += '<article class="lecture" style="--rubrique-couleur:' + r.couleur + '">';
    var icoA = iconeArticle(a);
    h += '<div class="lecture-tete">' + (icoA ? '<img class="icone-app" src="' + echapper(icoA) + '" alt="" width="120" height="120">' : '<img src="' + (r.img || r.vignette) + '" alt="" width="200" height="197">') + '<div>';
    h += '<a class="etiquette" href="#/rubrique/' + r.id + '">' + echapper(r.nom) + "</a>";
    h += '<p class="date">' + formaterDate(a.date) + (reglages.auteur ? ", par " + echapper(reglages.auteur) : "") + "</p></div></div>";
    h += "<h1>" + echapper(a.titre) + "</h1>";
    var c = a.contenu || [];
    for (var i = 0; i < c.length; i++) {
      var ligne = String(c[i]);
      if (ligne.indexOf("## ") === 0) h += "<h2>" + enrichir(ligne.slice(3)) + "</h2>";
      else if (/^\s*-{3,}\s*$/.test(ligne)) h += '<hr class="separateur">';
      else if (ligne.indexOf("@integrer ") === 0) h += blocIntegration(ligne.slice(10));
      else if (ligne.replace(/\s/g, "") !== "") h += "<p>" + enrichir(ligne) + "</p>";
    }
    h += blocLiens(a, r);
    h += '<div class="panneau"><span class="roundel" aria-hidden="true"></span><div class="panneau-texte">';
    h += "<p>" + (urlSure(a.appUrl) ? echapper(a.appNom || "L'application") + " est à tester ici :" : "Partager cet article :") + "</p>";
    h += '<div class="actions">' + boutonApp(a, "btn-rouge");
    h += boutonTuto(a, "btn-bleu");
    h += '<button type="button" class="btn btn-bleu" id="partager">Copier le lien de l\'article</button></div>';
    h += '<p class="partage" id="partage" role="status"></p></div></div>';
    h += "</article>";
    mainEl.innerHTML = h;
    document.getElementById("partager").addEventListener("click", function () { copier(adresseArticle(a)); });
    document.title = a.titre + " | " + (reglages.titre || "BROT2YOU");
  }

  function urlLien(u) {
    u = String(u || "");
    if (/^https?:\/\//i.test(u)) return { url: u, fichier: false };
    if (/^[a-z0-9_\-][a-z0-9_\-.\/]*$/i.test(u) && u.indexOf("..") === -1) return { url: u, fichier: true };
    return null;
  }

  function blocLiens(a, r) {
    var l = a.liens || [];
    var h = "";
    for (var i = 0; i < l.length; i++) {
      var v = urlLien(l[i] && l[i].url);
      if (!v) continue;
      var texte = echapper(l[i].texte || l[i].url);
      if (v.fichier) h += '<li><a class="btn btn-bleu" href="' + echapper(v.url) + '" download><span aria-hidden="true">⬇</span> ' + texte + "</a></li>";
      else h += '<li><a class="btn btn-bleu" href="' + echapper(v.url) + '" target="_blank" rel="noopener"><span aria-hidden="true">↗</span> ' + texte + "</a></li>";
    }
    if (!h) return "";
    var titre = r.id === "ressources" ? "À télécharger" : (r.id === "liens" ? "Les liens" : "Pour aller plus loin");
    return "<h2>" + titre + '</h2><ul class="liens">' + h + "</ul>";
  }

  function adresseArticle(a, prefixe) {
    var base = "";
    try { base = window.location.href.split("#")[0]; } catch (e) { base = ""; }
    if (!/^https?:/i.test(base)) base = "https://brot2you.github.io/articles/";
    return base + "#/" + (prefixe || "") + encodeURIComponent(a.id);
  }

  function copier(texte) {
    var msg = document.getElementById("partage");
    function ok() { msg.textContent = "Lien copié. Tu peux le coller dans un message ou sur un réseau social."; }
    function secours() {
      var zone = document.createElement("textarea");
      zone.value = texte;
      zone.setAttribute("readonly", "");
      zone.style.position = "absolute";
      zone.style.left = "-9999px";
      document.body.appendChild(zone);
      zone.select();
      var reussi = false;
      try { reussi = document.execCommand("copy"); } catch (e) { reussi = false; }
      document.body.removeChild(zone);
      if (reussi) ok(); else msg.textContent = "Copie impossible ici. Lien de l'article : " + texte;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texte).then(ok, secours);
    else secours();
  }

  function trouver(id) {
    for (var i = 0; i < articles.length; i++) if (articles[i].id === id) return articles[i];
    return null;
  }

  /* ---------- Routeur ---------- */
  var premierAffichage = true;
  var routeCourante = lireHash();

  function lireHash() {
    var h = "";
    try { h = window.location.hash || ""; } catch (e) { h = ""; }
    return h.indexOf("#/") === 0 ? h : "#/";
  }

  // Navigation interne : ne dépend pas des liens « # » du navigateur,
  // qui peuvent être bloqués dans certains aperçus ou cadres intégrés.
  function aller(route) {
    routeCourante = route || "#/";
    try {
      if (window.location.hash !== routeCourante && window.history && window.history.pushState) {
        window.history.pushState(null, "", routeCourante);
      }
    } catch (e) { /* adresse non modifiable ici : l'affichage change quand même */ }
    router();
  }

  function surNavigationNavigateur() {
    var r = lireHash();
    if (r !== routeCourante) { routeCourante = r; router(); }
  }

  document.addEventListener("click", function (ev) {
    if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    var el = ev.target;
    while (el && el !== document) {
      if (el.tagName === "A") break;
      el = el.parentNode;
    }
    if (!el || el === document) return;
    var href = el.getAttribute("href") || "";
    if (href === "#" || href.indexOf("#/") === 0) {
      ev.preventDefault();
      aller(href === "#" ? "#/" : href);
    }
  });

  function router() {
    if (articles === null) {
      construireIcones("");
      mainEl.innerHTML = '<p class="vide">Les articles ne peuvent pas s\'afficher : le bloc « articles » contient une erreur de format. Vérifie les virgules entre les blocs et les guillemets autour de chaque texte.</p>';
      return;
    }
    var hash = routeCourante;
    var page = "", rubActive = null;
    if (hash === "#/" || hash === "#" || hash === "") {
      page = recherche ? "" : "accueil";
      vueListe(null);
    } else if (hash === "#/archives") {
      page = "archives";
      vueArchives();
    } else if (hash.indexOf("#/rubrique/") === 0) {
      rubActive = decodeURIComponent(hash.slice(11));
      if (rubrique(rubActive)) vueListe(rubActive);
      else { rubActive = null; vueListe(null); }
    } else if (hash.indexOf("#/tuto/") === 0) {
      var at = trouver(decodeURIComponent(hash.slice(7)));
      if (at && tutoDe(at)) { rubActive = rubriqueDe(at); vueTuto(at); }
      else mainEl.innerHTML = '<a class="retour" href="#/">← Tous les articles</a><p class="vide">Ce tuto n\'existe pas ou a changé d\'adresse.</p>';
    } else if (hash.indexOf("#/") === 0) {
      var a = trouver(decodeURIComponent(hash.slice(2)));
      if (a) { rubActive = rubriqueDe(a); vueArticle(a); }
      else mainEl.innerHTML = '<a class="retour" href="#/">← Tous les articles</a><p class="vide">Cet article n\'existe pas ou a changé d\'adresse.</p>';
    } else {
      page = "accueil";
      vueListe(null);
    }
    construireRubriques(rubActive);
    construireIcones(page);
    document.getElementById("accueil-flottant").hidden = (hash === "#/" || hash === "#" || hash === "");
    if (!premierAffichage) {
      if (recherche && !searchEl.hidden) {
        searchInput.focus();
      } else {
        if (hash === "#/") {
          window.scrollTo(0, 0);
        } else if (hash.indexOf("#/rubrique/") !== 0) {
          var haut = mainEl.getBoundingClientRect().top + (window.pageYOffset || 0) - 10;
          window.scrollTo(0, Math.max(0, haut));
        }
        try { mainEl.focus({ preventScroll: true }); } catch (e) { mainEl.focus(); }
      }
    }
    premierAffichage = false;
  }

  var minuterie = null;
  searchInput.addEventListener("input", function () {
    var val = this.value;
    clearTimeout(minuterie);
    minuterie = setTimeout(function () {
      recherche = val.replace(/^\s+|\s+$/g, "");
      if (routeCourante !== "#/") {
        aller("#/");
      } else {
        router();
        searchInput.focus();
      }
    }, 200);
  });

  document.getElementById("footer").innerHTML =
    "Applications gratuites, sans inscription ni collecte de données. Un projet BROT2YOU.";

  window.addEventListener("hashchange", surNavigationNavigateur);
  window.addEventListener("popstate", surNavigationNavigateur);
  router();
})();
</script>
</body>
</html>
