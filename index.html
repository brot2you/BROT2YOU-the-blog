<script type="text/markdown" id="tuto-arbre-des-devoirs">
## C'est quoi, L'arbre des devoirs ?

L'arbre des devoirs t'aide quand tu ne sais pas comment t'y prendre pour un devoir d'anglais. Tu réponds à deux questions simples, et l'application te propose une stratégie et des conseils concrets pour avancer seul(e).

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle est classée par activité langagière, comme en cours :

| Branche | Ton devoir consiste à… |
| --- | --- |
| 🎧 CO | Comprendre un audio ou une vidéo |
| 📖 CE | Lire et comprendre un texte |
| ✍️ EE | Rédiger un texte |
| 🎤 EOC | Parler seul(e) : exposé, présentation, description d'image |
| 💬 EOI | Parler à quelqu'un : dialogue, échange |
| 🔄 Médiation | Expliquer, résumer ou transmettre un message |
| 🆘 SOS | Tu es complètement bloqué(e) |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Garde ta consigne de devoir sous les yeux : tu en auras besoin pour répondre aux questions.
3. L'arbre se lit de haut en bas. Chaque réponse que tu donnes s'ajoute au chemin, avec une coche ✓, pour que tu voies toujours où tu en es.
4. Deux boutons t'aident à naviguer : **← Étape précédente** pour revenir sur ton dernier choix, et **Recommencer** pour repartir du début.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Suivre l'arbre pas à pas

1. **Étape 1 : choisis ton activité.** L'application te demande : « Quelle activité langagière correspond à ton devoir ? ». Relis ta consigne : dois-tu écouter, lire, écrire, parler seul(e), dialoguer ou transmettre un message ? Appuie sur la branche qui correspond.
2. **Étape 2 : précise ta situation.** Choisis ce qui décrit le mieux où tu en es. Par exemple, pour un texte à rédiger : « Tu n'as pas encore commencé », « Tu es bloqué(e) au milieu d'une phrase », « Tu as fini, il faut te relire » ou « Ton texte est correct, tu veux l'améliorer ».
3. **Lis « Ce que tu peux faire ».** L'application affiche le nom de la stratégie, puis une liste d'actions concrètes à suivre dans l'ordre, et enfin une phrase à retenir.
4. **Applique les conseils** directement sur ton devoir, un par un.

Si tu t'es trompé(e) de situation, appuie sur **← Étape précédente**. Quand tu passes à une autre partie du devoir (par exemple de la rédaction à la relecture), reviens dans l'arbre et choisis ta nouvelle situation.

La branche 🆘 SOS mène directement aux conseils, sans deuxième question.

## Toutes les situations et leurs stratégies

L'arbre propose 24 situations, chacune associée à une stratégie nommée. Ce tableau permet de repérer d'un coup d'œil celle qui te concerne.

| Branche | Ta situation | Stratégie proposée |
| --- | --- | --- |
| 🎧 CO | Première écoute du document | Compréhension globale avant compréhension détaillée |
| 🎧 CO | Répondre à des questions précises | Écoute sélective (repérage ciblé) |
| 🎧 CO | Tu ne reconnais pas certains mots | Tolérance à l'incompréhension partielle |
| 🎧 CO | Prendre des notes en écoutant | Prise de notes sélective |
| 📖 CE | Découverte du texte | Anticipation par les indices paratextuels |
| 📖 CE | Répondre à des questions de compréhension | Lecture de repérage (balayage ciblé) |
| 📖 CE | Beaucoup de mots inconnus | Inférence lexicale par le contexte |
| 📖 CE | Donner ton avis, interpréter | Lecture inférentielle |
| ✍️ EE | Tu n'as pas encore commencé | Analyse de la consigne et planification |
| ✍️ EE | Bloqué(e) au milieu d'une phrase | Simplification et reformulation |
| ✍️ EE | Te relire | Révision ciblée (un point à la fois) |
| ✍️ EE | Améliorer un texte correct | Enrichissement lexical et syntaxique |
| 🎤 EOC | Préparer un exposé | Planification par mots-clés |
| 🎤 EOC | T'enregistrer (audio, vidéo) | Entraînement par répétitions successives |
| 🎤 EOC | Le trac, la peur de parler | Gestion de l'anxiété langagière |
| 🎤 EOC | Décrire une image | Description structurée |
| 🎤 EOC | Analyser une œuvre d'art | Décrire, interpréter, contextualiser |
| 🎤 EOC | Présenter une image à l'oral | Structuration de la présentation orale |
| 💬 EOI | Préparer un dialogue, un jeu de rôle | Anticipation des échanges |
| 💬 EOI | Réagir à l'oral en classe | Réaction immédiate et prise de risque |
| 💬 EOI | Tu ne comprends pas ce qu'on te dit | Stratégies de négociation du sens |
| 🔄 Médiation | Résumer ou expliquer un document | Reformulation de l'essentiel |
| 🔄 Médiation | Transmettre un message d'une langue à l'autre | Traduction fonctionnelle |
| 🆘 SOS | Complètement bloqué(e) | Avant d'abandonner |

## Deux exemples de parcours

**Léa doit écrire un email à son correspondant anglais.** Elle choisit ✍️ EE, puis « Tu n'as pas encore commencé ». L'arbre lui propose l'analyse de la consigne et la planification : surligner qui écrit, à qui, pourquoi et avec quel temps, noter ses idées en français en quelques mots, les classer, puis chercher 6 à 8 mots utiles avant de rédiger. Une fois son email terminé, elle revient dans l'arbre et choisit « Tu as fini, il faut te relire » pour vérifier le -s de la 3e personne, les majuscules et la consigne.

**Tom doit répondre à des questions sur une vidéo, mais il ne comprend pas tout.** Il choisit 🎧 CO, puis « Tu ne reconnais pas certains mots ». L'arbre lui rappelle qu'il est normal de ne pas tout comprendre, et lui conseille de s'appuyer sur les mots connus autour, les mots transparents et le ton de la voix. Il revient ensuite à « Tu dois répondre à des questions précises » : lire toutes les questions avant de réécouter, puis chercher une information à la fois.

## Pour les enseignants et les familles

**En classe.** Une présentation de 10 minutes suffit : projeter l'arbre, partir d'un vrai devoir de la semaine et faire choisir la branche aux élèves. On peut ensuite noter le sigle de l'activité (CO, CE, EE, EOC, EOI, Médiation) à côté de chaque consigne dans le cahier de textes, pour qu'ils sachent où entrer dans l'arbre.

**En accompagnement.** En devoirs faits ou en AP, l'outil aide l'adulte à guider sans faire à la place : on demande à l'élève quelle situation correspond à son blocage, puis on l'aide à appliquer les conseils un par un.

**À la maison.** Pas besoin de parler anglais pour aider : les conseils sont en français. Les parents peuvent simplement demander à l'enfant quelle stratégie il a choisie et vérifier qu'il suit les étapes.

**À savoir.** L'application n'enregistre rien et ne demande aucune donnée. Elle ne remplace pas le cours : elle donne une méthode pour se mettre au travail.
</script>

<script type="text/markdown" id="tuto-boite-outils-stagiaires">
## C'est quoi, la Boîte à outils du stagiaire ?

La Boîte à outils du stagiaire est un guide de survie dans l'Éducation nationale. Elle rassemble les sigles à connaître, les interlocuteurs de l'établissement, des sites utiles et des solutions concrètes aux difficultés les plus courantes de l'année de stage. Elle est pensée pour un professeur d'anglais stagiaire, mais elle sert à toute l'équipe : néo-titulaires, contractuels, tuteurs.

L'application est gratuite, sans inscription, et aucune donnée saisie n'est envoyée nulle part. Elle fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle s'organise en quatre onglets :

| Onglet | Ce qu'on y trouve |
| --- | --- |
| Abréviations | 93 sigles décodés et expliqués (DNB, CPE, PPMS, LSU, PAP, AESH…) |
| Acteurs de l'établissement | 21 interlocuteurs : leur rôle, quand les solliciter, quoi leur apporter |
| Sites utiles | 27 ressources institutionnelles, académiques, pédagogiques et numériques |
| Problèmes & solutions | 17 situations difficiles de l'année de stage, avec des pistes concrètes |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. En haut, un compteur rappelle le contenu du dossier : sigles, interlocuteurs, ressources et situations traitées.
3. Choisis un onglet : **Abréviations**, **Acteurs de l'établissement**, **Sites utiles** ou **Problèmes & solutions**.
4. Utilise la barre de recherche : elle s'adapte à l'onglet ouvert et filtre le contenu au fur et à mesure que tu tapes.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil pour l'avoir toujours sous la main, en salle des profs comme en conseil de classe :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Décoder un sigle (onglet Abréviations)

Les 93 sigles sont rangés en huit catégories :

- Diplômes, examens et certifications
- Structures et instances
- Personnels et carrière
- Numérique et vie scolaire
- Handicap et inclusion
- Programmes et dispositifs pédagogiques
- Sécurité et vie de l'établissement
- Réforme de la formation des enseignants (M2E, 2026)

Pour chaque sigle, tu trouves sa forme complète et une courte explication. Par exemple : **CFG**, Certificat de Formation Générale, le diplôme de substitution au DNB pour les élèves de SEGPA ou d'ULIS. Tape le sigle entendu en réunion dans la barre de recherche (CPE, PPMS, LSU…) pour le retrouver tout de suite.

## Savoir à qui s'adresser (onglet Acteurs de l'établissement)

Chaque fiche présente un interlocuteur, du chef d'établissement à l'IA-IPR d'anglais, en passant par le CPE, l'AESH, l'infirmier scolaire, le PsyEN, le référent harcèlement ou le tuteur de terrain. Elle répond à trois questions :

| Rubrique | Ce qu'elle t'apprend |
| --- | --- |
| Rôle | Ce que fait cette personne dans l'établissement |
| Quand le/la solliciter | Les situations où c'est la bonne personne à contacter |
| Quoi apporter / demander | Comment préparer ta démarche pour qu'elle soit efficace |

Astuce : la recherche fonctionne aussi par situation. Tape « harcèlement », « absence » ou « handicap » pour trouver la bonne personne.

## Trouver une ressource (onglet Sites utiles)

Les 27 sites sont classés en quatre groupes : institutionnel national (Éduscol, Bulletin officiel, Légifrance, Canopé…), académique et local, ressources pédagogiques pour l'anglais, et outils numériques pratiques. Chaque lien est accompagné d'une phrase qui explique à quoi il sert, et s'ouvre dans un nouvel onglet.

## Résoudre une difficulté (onglet Problèmes & solutions)

Cet onglet rassemble 17 situations vécues par beaucoup de stagiaires, formulées à la première personne : « Je perds l'autorité sur une classe », « Je ne sais pas comment noter ou évaluer », « Je vais être inspecté(e) et je ne sais pas à quoi m'attendre », « Un parent d'élève me met en difficulté », « Je me sens isolé(e) et découragé(e) »…

Touche une situation pour l'ouvrir. Tu y trouves une description des signes qui peuvent t'alerter, puis une liste de solutions concrètes, numérotées, à essayer dans l'ordre. Touche à nouveau le titre pour refermer la fiche.

## Bon à savoir

La Boîte à outils est un dossier de consultation : il n'y a rien à remplir, et aucune donnée n'est enregistrée ni envoyée. Tu peux l'ouvrir à tout moment, sans compte.

Les usages, les sigles et l'organisation varient d'un établissement et d'une académie à l'autre. Le dossier donne des repères généraux : en cas de doute, vérifie toujours auprès de ta direction, de ton tuteur ou du rectorat.

## Conseils d'utilisation

**Pour les stagiaires.** Garde la Boîte à outils sur ton téléphone : elle est utile en réunion, quand un sigle tombe sans explication, ou avant de contacter quelqu'un pour la première fois. Quand une difficulté s'installe, ouvre la fiche correspondante dans Problèmes & solutions, puis parles-en à ton tuteur : les fiches ne remplacent pas un échange avec un collègue.

**Pour les tuteurs.** Le dossier peut servir de support lors des premiers rendez-vous avec le stagiaire : faire le tour des acteurs de l'établissement, repérer ensemble les sigles qui reviendront souvent, ou partir d'une fiche Problèmes & solutions pour lancer un échange sur une situation vécue.

**Pour les formateurs et l'équipe.** Les néo-titulaires, les contractuels ou les collègues qui arrivent dans l'établissement y trouveront aussi des repères. Le dossier peut être présenté lors d'une réunion d'accueil en début d'année.

**À savoir.** Les informations sont des repères généraux, à jour au moment de leur rédaction, notamment sur la réforme de la formation des enseignants (M2E, 2026). Les textes officiels et les consignes de l'établissement restent la référence.
</script>

<script type="text/markdown" id="tuto-books-of-heroes">
## C'est quoi, Books of Heroes ?

Books of Heroes, ce sont des livres dont **tu es le héros**, entièrement en anglais. Tu lis une page, puis tu choisis ce que fait ton personnage : tes choix décident de la suite, et de la fin de l'histoire. Chaque livre a plusieurs fins à découvrir.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Les 16 livres sont rangés sur quatre étagères, une par niveau :

| Étagère | Niveau | Exemples de livres |
| --- | --- | --- |
| 6e | A1 : présent simple, vocabulaire courant | The Treasure of Raven Island, Quest for the Dragon's Egg |
| 5e | A1/A2 : impératif, prétérit simple | Lost in London, The Sword of the Frost King |
| 4e | A2/B1 : prétérit, comparatifs, modaux | The Vanishing Painting, The Silent Hives |
| 3e | B1 : conditionnel, voix passive, modaux | 2050: The Last Vote, The Deepfake |

On y trouve des enquêtes, des aventures, de la fantasy, et pour les plus grands des histoires qui font réfléchir : une IA qui dirige une ville, une fausse vidéo virale, le partage de l'eau…

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Sur l'accueil, tu vois tes XP, le nombre de fins découvertes et tes badges, puis la bibliothèque avec ses quatre étagères.
3. Choisis l'étagère de ton niveau, puis appuie sur un livre. Sa fiche indique le titre en français, le résumé, la durée de lecture (de 11 à 18 minutes) et le nombre de fins que tu as déjà trouvées.
4. Appuie sur **Commencer la lecture**. Si tu as déjà commencé ce livre, tu peux **Continuer la lecture** ou **Recommencer depuis le début**.
5. À tout moment, **← Bibliothèque** te ramène à la liste des livres.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

Ta progression et tes réglages sont enregistrés automatiquement sur ton appareil.

## Lire un livre

1. **Lis la page.** Une barre en haut montre ton avancée dans l'histoire.
2. **Touche les mots soulignés** si tu ne les comprends pas : une bulle s'ouvre avec une explication simple en anglais et un emoji pour t'aider (par exemple island : « a piece of land completely surrounded by water » 🏝). Touche à nouveau pour la fermer.
3. **Écoute si tu veux** : le bouton **🔊 Écouter** lit la page à voix haute, avec un accent britannique.
4. **Fais ton choix** parmi les boutons en bas de la page (par exemple « Go into the dark forest » ou « Go into the sea cave »). L'histoire continue selon ta décision.

Astuce : avant de choisir, relis bien les deux possibilités. Elles ne mènent pas du tout au même endroit !

## Découvrir les fins

Quand ton aventure se termine, l'écran **THE END** affiche le titre de ta fin en anglais et en français, et son type :

| Type de fin | Emoji |
| --- | --- |
| Meilleure fin | 🏆 |
| Bonne fin | 🌟 |
| Fin neutre | 🧭 |
| Fin amusante | 😅 |
| Fin difficile | 🌊 |

Chaque nouvelle fin rapporte des XP (de 30 à 150 selon la fin). Une fin déjà découverte ne rapporte plus rien : pour gagner davantage, il faut faire d'autres choix ! L'écran indique aussi combien de fins tu as trouvées dans ce livre. Appuie sur **Recommencer ce livre** pour tenter un autre chemin, ou sur **Retour à la bibliothèque** pour changer de livre.

## Adapter la lecture (bouton DYS)

Le bouton **DYS**, en haut de l'écran, ouvre un panneau de réglages pour lire plus confortablement. Tes choix sont gardés pour les prochaines fois.

| Réglage | Effet |
| --- | --- |
| Taille du texte | Quatre tailles, de A- à A++ |
| Police DYS (Lexend) | Une police plus facile à lire |
| Espacement des lettres | Plus d'espace entre les lettres |
| Interligne aéré | Plus d'espace entre les lignes |
| Fond de lecture | Un fond coloré (crème, bleu, jaune ou gris) moins éblouissant |
| Contraste élevé | Des couleurs plus marquées |
| Lecture facilitée | Le début des mots en gras, pour guider l'œil |
| 🔊 Lire cette page à voix haute | La lecture audio de la page en cours |

## Suivre sa progression

L'accueil affiche ton total d'XP, le nombre de fins découvertes et tes badges. Tu en gagnes un pour ton premier livre, un autre quand tu as commencé deux livres, et un badge spécial chaque fois que tu as trouvé **toutes les fins** d'un livre. La fiche de chaque livre rappelle combien de fins il te reste à découvrir.

## Conseils d'utilisation

**Pour les élèves.** Commence par un livre de ton étagère : il est fait pour ton niveau. Ne cherche pas à tout traduire : comprends l'idée générale, et touche les mots soulignés seulement quand ils t'empêchent de choisir. Une fois une fin trouvée, recommence le livre et tente l'autre chemin !

**En classe.** On peut lire un livre collectivement au tableau : la classe vote à chaque choix, en justifiant en anglais (« I think we should… because… »). En groupes, chaque équipe peut chercher une fin différente puis la raconter aux autres. Les livres de 3e, sur l'IA, les deepfakes ou le partage de l'eau, se prêtent bien à un débat après la lecture.

**À la maison.** Lire un livre ensemble est un bon moment en famille : le bouton 🔊 lit l'histoire en anglais, et les titres et résumés sont en français.

**À savoir.** Aucune donnée n'est envoyée sur internet : tout reste dans le navigateur de l'appareil. Si l'élève change d'appareil ou efface les données de navigation, ses fins découvertes et ses XP ne suivent pas.
</script>

<script type="text/markdown" id="tuto-carnet-de-suivi">
## C'est quoi, le Carnet de Suivi ?

Le Carnet de Suivi — Participation & Groupe est la version numérique des fiches papier d'autoévaluation et d'inter-évaluation en cours d'anglais. Il permet d'enregistrer les autoévaluations individuelles des élèves et l'évaluation de leurs travaux de groupe, puis de suivre l'évolution de chaque élève au fil de l'année, avec un graphique et un historique complet.

L'application est gratuite, sans inscription, et tout reste enregistré sur l'appareil.

Elle s'organise en cinq onglets :

| Onglet | Ce qu'on y fait |
| --- | --- |
| 📋 Classes | Créer ses classes et y ajouter les élèves |
| 📝 Nouvelle autoéval | Saisir l'autoévaluation d'un élève, sa réflexion et le retour du professeur |
| 🤝 Travail de groupe | Évaluer un travail de groupe, membre par membre, avec un bilan collectif |
| 📈 Suivi élève | Voir la progression d'un élève et imprimer son bilan |
| 💾 Sauvegarde | Exporter, restaurer ou réinitialiser les données |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Dans **📋 Classes**, crée une classe en lui donnant un nom (par exemple « 5e A »).
3. Ajoute les élèves : un par un, ou tous d'un coup en collant la liste, un nom par ligne.
4. Ta classe est prête : tu peux passer aux autoévaluations et aux travaux de groupe.

Tu peux créer autant de classes que tu veux. Supprimer un élève ou une classe efface aussi tout son historique, après confirmation.

## Saisir une autoévaluation

1. Dans **📝 Nouvelle autoéval**, choisis la classe, l'élève et la date. Si un objectif avait été fixé la fois précédente, un rappel s'affiche.
2. Reporte les réponses de l'élève pour chacun des six critères, sur une échelle **Jamais / Parfois / Souvent / Toujours** :
   - J'écoute les consignes et les autres élèves ;
   - Je participe volontairement en classe ;
   - Je m'exprime en anglais, même incertain(e) ;
   - Je respecte les autres et les règles ;
   - Je travaille sérieusement, seul(e) et en groupe ;
   - J'ose me tromper et j'essaie de progresser.
3. Complète la **réflexion de l'élève** : ce qu'il ou elle fait bien, ce qu'il ou elle veut améliorer, et son objectif pour les prochaines séances.
4. Ajoute ton **feedback** : un point fort observé et un objectif.
5. Appuie sur **Enregistrer**. Un score en pourcentage est calculé.

## Évaluer un travail de groupe

1. Dans **🤝 Travail de groupe**, choisis la classe, la date et le sujet du travail (par exemple « Exposé sur Londres »).
2. Sélectionne les membres du groupe, au moins deux.
3. Pour chaque membre, note de 0 à 4 les cinq critères :
   - A présenté ou défendu son travail ;
   - A écouté les idées des autres ;
   - A aidé un camarade ;
   - A coopéré pour le travail commun ;
   - A participé en anglais.
4. Remplis le **bilan de groupe** : ce qui a bien fonctionné, ce qui a été difficile, et ce qu'il faudra faire différemment la prochaine fois.
5. Appuie sur **Enregistrer** : l'évaluation est ajoutée au suivi de chaque membre du groupe.

## Suivre un élève

Dans **📈 Suivi élève**, choisis une classe puis un élève. Tu vois sa moyenne en autoévaluation et en travail de groupe, et dès qu'il y a au moins deux évaluations, un **graphique** de son évolution. En dessous, l'**historique complet** reprend chaque autoévaluation et chaque travail de groupe, avec ses points forts et ses objectifs. Le bouton d'impression produit un bilan de l'élève, pratique pour un conseil de classe ou un rendez-vous avec la famille.

## Sauvegarder et protéger les données

L'onglet **💾 Sauvegarde** permet de :

- **télécharger une sauvegarde** (.json) de toutes les classes et évaluations ;
- **restaurer** une sauvegarde, par exemple sur un autre ordinateur (attention : cela remplace toutes les données actuelles) ;
- **tout réinitialiser** en fin d'année (action irréversible, demandée deux fois).

Les données restent dans le navigateur de l'appareil utilisé : pense à faire une sauvegarde régulièrement. Si le message « Erreur de sauvegarde (stockage plein ?) » apparaît, exporte tes données puis supprime les classes des années précédentes.

Les autoévaluations et les observations concernent des élèves identifiables : utilise l'outil sur un appareil protégé, garde les sauvegardes en lieu sûr, et rédige les retours avec bienveillance, comme on le ferait sur une fiche papier remise à l'élève.

## Conseils d'utilisation

**Garder le papier pour les élèves.** Les élèves peuvent continuer à remplir leur fiche papier en fin de séance : l'outil sert surtout à reporter leurs réponses et à garder une trace de l'évolution sur l'année, sans perdre les fiches.

**Faire vivre les objectifs.** Le rappel de l'objectif fixé la fois précédente est un bon point de départ pour un court échange avec l'élève : l'a-t-il atteint ? Que se fixe-t-il maintenant ? C'est ce qui donne tout son sens à l'autoévaluation.

**Utiliser le bilan de groupe.** Après un travail collectif, prendre deux minutes avec le groupe pour remplir le bilan (ce qui a marché, ce qui a été difficile, ce qu'on changera) aide les élèves à progresser dans leur manière de coopérer.

**Préparer les conseils de classe.** Le suivi élève et sa version imprimable donnent des éléments concrets sur la participation et l'investissement dans le travail de groupe, en complément des résultats scolaires.
</script>

<script type="text/markdown" id="tuto-case-files">
## C'est quoi, Case Files ?

Case Files te transforme en détective : 15 enquêtes en anglais, sous forme d'énigmes logiques. Pour chaque affaire, tu lis l'histoire et les indices, puis tu remplis une grille pour découvrir qui était où, et ce qui l'a trahi. C'est une façon de lire l'anglais de près, en raisonnant, comme dans un Cluedo. L'application est pensée pour le niveau 3e.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Les enquêtes sont de plus en plus difficiles :

| Enquêtes | Niveau | Suspects |
| --- | --- | --- |
| 1 et 6 | Warm-up (échauffement) | 3 |
| 2 et 7 | Easy | 3 |
| 3 et 8 | Medium | 4 |
| 4 et 9 | Medium-Hard | 4 |
| 5 et 10 | Hard | 5 |
| 11 à 14 | Cluedo Edition | 6 |
| 15 | Hardest (la dernière enquête) | 6 |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. La page d'accueil affiche les 15 enquêtes, avec leur numéro, leur titre, leur niveau et leur nombre de suspects. En haut, un compteur indique combien d'enquêtes tu as déjà résolues.
3. Appuie sur une enquête pour l'ouvrir. Commence par la première : elle sert d'échauffement.
4. Pour revenir à la liste, appuie sur **← Back to Case Files**.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

Les enquêtes résolues sont enregistrées automatiquement sur ton appareil, et cochées dans la liste.

## Mener une enquête

1. **Lis l'histoire** (« The Case »). Elle présente les suspects et ce que tu dois découvrir : par exemple, où chacun se cachait et quel objet l'a trahi. Appuie sur **🔊 Read Story** pour l'écouter en anglais.
2. **Lis les indices** (« Clues »). Chaque phrase te donne une information. Tu peux aussi les écouter avec **🔊 Read Clues**.
3. **Remplis la grille.** Chaque ligne correspond à un suspect, chaque colonne à un lieu ou à un objet. Touche une case :
   - une fois pour mettre ✓ (oui, c'est lui) ;
   - deux fois pour mettre ✗ (non, ce n'est pas lui) ;
   - une troisième fois pour vider la case.
4. **Vérifie** avec **Check Solution**. Si tout est juste, le message « Case closed! Well done, detective. » s'affiche et l'enquête est cochée dans la liste. Sinon, « Not quite » t'invite à relire les indices.

Les boutons **Reset Grid** et **Reveal Solution** permettent de vider la grille ou de voir la solution. La solution ne se débloque qu'une fois toutes les cases remplies : impossible de tricher avant d'avoir vraiment cherché !

## La méthode du détective

Une grille de logique se résout pas à pas. Voici comment t'y prendre :

1. **Commence par les indices directs**, comme « Ryan was doing homework. » : mets tout de suite un ✓ dans la bonne case.
2. **Élimine.** Dès que tu as un ✓, mets des ✗ dans le reste de la ligne et de la colonne : un suspect ne peut être qu'à un seul endroit, et chaque endroit n'accueille qu'un seul suspect.
3. **Utilise les indices négatifs**, comme « Marvin wasn't hiding under the bed. » : mets un ✗.
4. **Relie les indices entre eux**, comme « Whoever was in the library was painting a poster. » : ce qui est vrai pour le lieu est vrai pour l'activité.
5. **Quand il ne reste qu'une case vide** dans une ligne, c'est forcément la bonne réponse.

Astuce : lis chaque indice plusieurs fois. Les petits mots comptent beaucoup, comme wasn't, didn't, whoever ou and.

## Adapter l'affichage (Reading Settings)

Le bouton **⚙ Reading Settings** permet d'adapter la lecture à tes besoins. Tes choix sont gardés pour les prochaines fois.

| Réglage | Effet |
| --- | --- |
| Dyslexia-friendly font | Une police plus facile à lire |
| Larger text | Un texte plus grand |
| Extra letter & line spacing | Plus d'espace entre les lettres et les lignes |
| Cream reading background | Un fond crème, moins éblouissant |
| Bionic reading | Le début de chaque mot en gras, pour guider l'œil |

## Suivre sa progression

Le compteur en haut de la liste indique combien d'enquêtes tu as résolues, et chaque affaire réussie est cochée. Ta progression est enregistrée dans le navigateur de ton appareil : utilise toujours le même appareil pour la retrouver.

## Conseils d'utilisation

**Pour les élèves.** Prends ton temps : une enquête se résout avec la tête, pas avec la vitesse. Garde un brouillon à côté si tu veux noter tes déductions. Si tu bloques, relis les indices un par un en te demandant ce que chacun t'apprend vraiment.

**En classe.** Les enquêtes se prêtent bien au travail en binômes : chaque élève doit justifier ses ✓ et ses ✗ à l'oral, en anglais si possible (« It can't be Grace because… »). On peut projeter une enquête au tableau pour montrer la méthode, puis laisser les groupes avancer à leur rythme. Les cinq premières enquêtes conviennent pour commencer, les éditions Cluedo pour les élèves qui veulent un défi.

**À la maison.** Les enquêtes peuvent se faire en famille. Les boutons 🔊 lisent l'histoire et les indices en anglais, ce qui aide à comprendre la prononciation même sans parler anglais.

**À savoir.** Aucune donnée n'est envoyée sur internet : tout reste dans le navigateur de l'appareil. Les enquêtes sont entièrement en anglais, avec du vocabulaire du quotidien et de l'école.
</script>

<script type="text/markdown" id="tuto-class-manager">
## C'est quoi, Class Manager ?

Class Manager est un outil de gestion de classe tout-en-un : suivi de la participation et du comportement, tampons de compétences, maisons ou équipes, plan de classe intelligent, groupes aléatoires, roue de tirage et écran à projeter. Il s'inspire de l'outil Classe Active de Charlie Rollo (It's English O'Clock).

L'application est gratuite et sans inscription. Toutes les données restent sur l'appareil : rien n'est transmis à un serveur.

Elle s'organise en huit onglets :

| Onglet | Ce qu'on y fait |
| --- | --- |
| 🎒 Élèves | Importer la classe, noter les absents, attribuer des points |
| 📋 Fiches individuelles | Voir le détail d'un élève : points, passeport de compétences, avatar, notes |
| 🏠 Maisons | Répartir les élèves en équipes et attribuer des points collectifs |
| 🏆 Classement | Les classements et le graphique d'évolution des points |
| 🪑 Plan de classe | Disposer les tables et placer les élèves, à la main ou automatiquement |
| 🎲 Groupes & Roue | Former des groupes, faire un Jigsaw, tirer au sort |
| 📺 Écran classe | Une vue grand écran à projeter |
| ⚙️ Réglages | Personnaliser l'outil, sauvegarder, synchroniser, changer de période |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur, sur l'ordinateur de la classe ou ta tablette.
2. Pour découvrir l'outil sans rien saisir, appuie sur **Charger la classe démo** : une classe fictive de 5e, avec ses équipes et un historique de points, s'installe.
3. Pour ta vraie classe, ouvre **Importer une liste** dans l'onglet 🎒 Élèves. Trois formats sont reconnus automatiquement :
   - une ligne par élève, « Prénom Nom » ;
   - un export CSV de Pronote (virgules, points-virgules ou tabulations) ;
   - un copier-coller depuis Excel ou Google Sheets.
4. Appuie sur **Importer la liste**. Dans ⚙️ Réglages, donne un nom à la classe.

Class Manager gère une classe à la fois. Pour plusieurs classes, la sauvegarde permet de passer de l'une à l'autre (voir plus bas).

## Au quotidien : élèves, fiches et points

**🎒 Élèves.** Chaque élève a sa carte. Coche les absents du jour, puis attribue des points en un clic grâce au catalogue d'actions :

| Actions positives | Actions négatives |
| --- | --- |
| Participation, Efforts, Aide aux camarades, Autonomie, Travail en équipe, Excellent travail | Bavardages, Manque de matériel, Non-respect des consignes, Manque de travail, Perturbation du cours |

**📋 Fiches individuelles.** Touche un élève pour ouvrir sa fiche : ses points, ses **actions rapides**, son **avatar**, son **passeport de compétences** et des **notes** (observations, objectifs, rendez-vous parents…). Le passeport réunit des tampons à attribuer : Ponctualité, Participation active, Travail soigné, Coopération, Progrès notable, Créativité, Esprit d'équipe, Objectif atteint. Toutes les fiches peuvent être imprimées.

**🏠 Maisons.** Quatre équipes sont proposées (Rouge, Bleue, Verte, Jaune), et tu peux en créer d'autres avec leur couleur. Répartis les élèves, puis attribue des points à toute une équipe d'un coup.

**🏆 Classement.** Les classements des élèves et des maisons, et un **graphique d'évolution des points**, à afficher pour la classe entière, un élève ou une maison. Il faut au moins deux journées avec des points pour que la courbe apparaisse.

## Organiser la classe : plan, groupes et écran

**🪑 Plan de classe.** Ajoute des tables (simple, double, îlot de 3 ou de 4, table ronde), place les élèves par glisser-déposer, et indique les contraintes :

- les élèves à mettre **au premier rang** ;
- les élèves **à réunir** ou **à séparer** ;
- les élèves accompagnés par un **AESH**, pour garder une place à côté.

Le **placement intelligent** dispose ensuite la classe en respectant au mieux ces contraintes, et signale celles qu'il n'a pas pu tenir.

**🎲 Groupes & Roue.** Forme des **groupes aléatoires** ou par équipe, prépare une **Classe Puzzle (Jigsaw)**, et fais tourner la **roue de tirage** sur les élèves présents ou sur les groupes. Des boutons copient aussi la liste pour l'utiliser dans les outils de La Digitale (Roue, Groupes, Digiscreen).

**📺 Écran classe.** Une vue pensée pour le vidéoprojecteur : branche l'ordinateur, puis appuie sur **⛶ Plein écran**.

## Réglages, sauvegarde et données

Dans **⚙️ Réglages**, tu peux :

- renommer la classe ;
- créer tes propres **tampons** de compétences ;
- personnaliser le **catalogue d'actions** : nom, type (positif ou négatif) et nombre de points ;
- lancer une **nouvelle période** (un nouveau trimestre, par exemple) pour repartir de zéro côté points tout en gardant l'historique ;
- **réinitialiser** toute la classe (action irréversible, demandée deux fois).

**Synchroniser entre appareils.** Il n'y a pas de compte : pour retrouver ta classe sur un autre ordinateur, utilise **⬇️ Exporter la sauvegarde (.json)**, puis **⬆️ Importer une sauvegarde** sur l'autre appareil. C'est aussi la façon de gérer plusieurs classes : un fichier de sauvegarde par classe.

**Protéger les données.** Les noms, les notes et les observations sur les élèves sont des données personnelles. Utilise l'outil sur un appareil protégé, reste factuel dans les notes (une famille peut demander à les consulter), et garde les fichiers de sauvegarde en lieu sûr. Sur l'écran projeté, pense à n'afficher que ce que tu souhaites montrer à toute la classe.

## Conseils d'utilisation

**Valoriser plus que sanctionner.** Le catalogue contient des actions négatives, mais l'outil prend tout son sens quand il sert surtout à rendre visibles les efforts, l'entraide et les progrès. Les tampons du passeport de compétences sont parfaits pour ça.

**Jouer collectif avec les maisons.** Les points d'équipe encouragent la coopération : chacun contribue au score de sa maison. Un classement affiché de temps en temps, plutôt qu'en permanence, garde l'élan sans créer de pression.

**Gagner du temps en séance.** La roue de tirage et les groupes aléatoires évitent les discussions sur qui passe ou qui travaille avec qui. Le placement intelligent permet de préparer un plan de classe qui tient compte des besoins de chacun, en quelques secondes.

**Préparer les bilans.** Les notes et le graphique d'évolution aident à préparer un conseil de classe ou un rendez-vous avec une famille, avec des éléments concrets sur l'investissement de l'élève dans la durée.
</script>

<script type="text/markdown" id="tuto-cognicoach">
## C'est quoi, CogniCoach ?

CogniCoach t'aide à apprendre avec méthode, en t'appuyant sur ce que les sciences cognitives savent de la mémoire : se tester plutôt que relire, revoir à intervalles réguliers, travailler peu de notions à la fois. Tu y ajoutes ce que tu dois retenir (vocabulaire, définitions, règles), puis l'application te fait réviser avec des quiz, des flashcards, des dictées et des exercices, et te dit quand revoir chaque notion.

L'application est gratuite et sans inscription. Tout reste sur ton appareil : aucune donnée n'est envoyée sur internet.

Elle propose deux espaces :

| Espace | Pour qui | Ce qu'on y trouve |
| --- | --- | --- |
| 🎓 Élève | Les élèves, de la 6e à la terminale | Notions à réviser, séance guidée, outils de travail, planning, conseils |
| 📋 Enseignant | Les professeurs de langues | Stratégies, apports de la recherche, grille d'observation, activités clés en main, références |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur, sur ordinateur, tablette ou téléphone.
2. Choisis ton profil : **Je suis élève** ou **Je suis enseignant·e**.
3. Écris ton prénom, choisis ta classe, puis appuie sur **Commencer →**.
4. Tu arrives sur ton tableau de bord : tes points d'expérience (XP), les révisions à faire aujourd'hui, et tous les outils de travail.
5. Commence par **📝 Mes notions** : tant que tu n'as rien ajouté, les exercices n'ont rien à te faire réviser.

En haut de l'écran, les boutons **🎓 Élève** et **📋 Enseignant** permettent de passer d'un espace à l'autre. Dans chaque outil, **← Retour** ramène au tableau de bord.

Ton travail est enregistré automatiquement sur ton appareil. Utilise toujours le même appareil et le même navigateur pour retrouver tes notions et ton planning.

## Ajouter ses notions

1. Ouvre **📝 Mes notions**, puis appuie sur **+ Ajouter**.
2. Indique la **matière** (par exemple : Anglais).
3. Écris tes notions, **une par ligne**, en séparant la question et la réponse par une barre verticale `|`. Par exemple :
   - `to borrow | emprunter`
   - `went | prétérit de go`
   - `however | cependant`
4. Appuie sur **Ajouter**.

Si une ligne n'a pas de `|`, elle est ignorée. Sur clavier français, la barre s'obtient avec **AltGr + 6** sur PC, ou **Alt + Maj + L** sur Mac.

## La séance guidée (10 minutes)

C'est l'outil à utiliser en priorité. Il prend au hasard jusqu'à 7 de tes notions et te fait passer par trois étapes :

1. **Rappel** : lis attentivement les notions affichées.
2. **Quiz** : pour chaque question, choisis la bonne réponse parmi quatre propositions. Tu sais tout de suite si c'est juste, et sinon, la bonne réponse s'affiche.
3. **Bilan** : ton score, les XP gagnés, et les dates de tes prochaines révisions (dans 1, 3, 7 et 14 jours). Termine en évaluant honnêtement ta maîtrise : **Pas encore**, **En progrès** ou **Bien maîtrisé**.

Chaque bonne réponse rapporte 5 XP, avec un bonus de 20 XP si tu obtiens au moins 80 %.

## Les autres outils de travail

**🃏 Flashcards audio.** Lis le recto, essaie de répondre dans ta tête, puis touche la carte pour la retourner. Choisis la langue de la voix (anglais, français, espagnol, allemand ou italien) et écoute la prononciation, normalement ou lentement.

**🎧 Dictée.** L'application prononce un mot de tes notions : écris-le dans la zone de réponse, puis vérifie. Tu peux le réécouter, ou l'écouter lentement. Une série compte jusqu'à 8 mots.

**🔗 Matching.** Relie chaque terme à sa définition, sur une série de 6 paires tirées de tes notions.

**✍️ Production écrite.** Des exercices guidés en anglais : compléter une phrase, passer à la voix passive, traduire, écrire avec although ou despite… Lis la consigne et l'indice, écris ta réponse, puis compare-la avec l'élément attendu.

## Le planning de révisions

CogniCoach utilise la **répétition espacée** : revoir une notion plusieurs fois, en espaçant de plus en plus les révisions, plutôt que tout réviser d'un coup la veille. Après chaque séance, l'application programme tes prochaines révisions à J+1, J+3, J+7, J+14, puis J+30.

- Sur le tableau de bord, **⏰ Révisions à faire aujourd'hui** t'indique ce qui t'attend. Appuie sur **Go** pour t'y mettre.
- **📅 Mon planning** affiche, pour chaque matière, le nombre de séances faites, la date de la prochaine révision et son statut : en retard, aujourd'hui ou à venir.

Astuce : 10 minutes par jour suffisent. Fais ta séance guidée le jour prévu, même si tu as l'impression de connaître : c'est justement ce qui ancre les notions durablement.

## Les conseils et stratégies

**💡 Conseils & stratégies** rassemble de courtes fiches pour mieux apprendre : mémoriser, comprendre un audio, lire un texte, écrire, parler. Chaque conseil s'accompagne d'un exemple concret à essayer, comme cacher sa leçon et écrire ce dont on se souvient, ou répéter une phrase entendue en imitant l'intonation.

## L'espace enseignant

L'espace **📋 Enseignant** rassemble des ressources pour l'enseignement des langues, réparties en six onglets :

| Onglet | Contenu |
| --- | --- |
| 🧠 Stratégies | Les grands principes des sciences cognitives (répétition espacée, effet test, charge cognitive, élaboration, métacognition, entrelacement), avec leur niveau de robustesse et une application en classe |
| 🌐 Acquisition L2 | Repères sur l'apprentissage d'une langue : input compréhensible, filtre affectif, vocabulaire fréquent, rencontres répétées, production |
| 📋 CO/CE/PE/PO | Des pistes pour chaque activité langagière |
| 👁 Grille obs. | Une grille pour observer si les élèves mettent en œuvre les bonnes stratégies |
| ⚡ Activités | Des activités prêtes à l'emploi : retrieval practice en début de cours, ticket de sortie, input flooding, dictogloss, think-pair-share, shadowing, 4/3/2… avec leur difficulté de mise en place |
| 📚 Références | Les travaux de recherche cités |

## Conseils d'utilisation

**Pour les élèves.** Ajoute tes notions le jour du cours, juste après la leçon. Fais une séance guidée par jour quand des révisions sont prévues, et sois honnête dans ton autoévaluation : c'est elle qui t'aide à savoir ce qu'il reste à travailler.

**En classe.** Une première séance d'environ 20 minutes suffit : créer son profil, saisir ensemble 5 à 7 notions de la séquence, puis faire une séance guidée. On peut ensuite donner la liste des notions de chaque leçon au format `terme | réponse`, à copier directement dans l'application.

**À la maison.** Les parents peuvent demander à l'enfant de leur montrer son planning, ou lui faire une dictée avec l'application. Les conseils sont en français.

**À savoir.** Aucune donnée n'est envoyée sur internet : tout reste dans le navigateur de l'appareil. Si l'élève change d'appareil ou efface les données de navigation, ses notions et son planning ne suivent pas.
</script>

<script type="text/markdown" id="tuto-culture-corner">
## C'est quoi, Culture Corner ?

Culture Corner est une bibliothèque de ressources culturelles anglophones pour la classe d'anglais : près de 1 150 documents authentiques (articles de presse, films, œuvres d'art et de littérature, podcasts, chansons, séries), classés selon les axes culturels des programmes du BO 2025, de la 6e à la terminale.

L'application est gratuite, sans inscription, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone. Elle propose deux profils :

| Profil | Pour qui | Ce qu'on y trouve |
| --- | --- | --- |
| Élève | Les élèves, du collège au lycée | Explorer les ressources, lire leur présentation et ouvrir le document |
| Prof | Les enseignants d'anglais | Tout ce que voit l'élève, plus une suggestion d'exploitation pédagogique pour chaque ressource et la possibilité d'ajouter ses propres ressources |

Les ressources viennent surtout du Royaume-Uni et des États-Unis, mais aussi d'Irlande, d'Australie, de Nouvelle-Zélande, d'Afrique du Sud, du Canada, du Nigeria ou d'Inde.

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Choisis ton profil : **Je suis élève** ou le profil enseignant.
3. Tu arrives sur la bibliothèque. En haut, l'étiquette **ÉLÈVE** ou **PROF** rappelle ton profil.
4. Pour passer d'un profil à l'autre, appuie sur **Changer de profil**.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Trouver une ressource

La barre du haut permet de combiner plusieurs filtres. Le nombre de ressources trouvées s'affiche juste en dessous.

| Filtre | Ce qu'il permet |
| --- | --- |
| 🔍 Recherche | Chercher un titre, un mot-clé ou un thème (par exemple : climate, Banksy, identity) |
| Type | Musique, Cinéma, Presse, Podcast, Art & Lit ou Séries |
| Niveau de classe | De la 6e à la terminale |
| Axe | Les axes culturels du programme pour le niveau choisi (par exemple « Le Royaume-Uni » en 5e, ou « Art et pouvoir » au lycée) |
| Niveau CECRL | A1-A2, B1-B2 ou C1-C2 |

Astuce : choisis d'abord le niveau de classe, puis l'axe. La liste des axes s'adapte automatiquement au niveau.

## Consulter la fiche d'une ressource

Touche une ressource pour ouvrir sa fiche. Tu y trouves son type, son titre, son pays et son année, son niveau CECRL, le niveau de classe, l'axe du programme, une courte présentation et des mots-clés. Le bouton principal ouvre le document original (vidéo, article, podcast…) dans un nouvel onglet.

## La suggestion d'exploitation (profil Prof)

En profil enseignant, chaque fiche propose en plus une **📋 Suggestion d'exploitation pédagogique**, adaptée au type de document et à son niveau :

- **🎯 Objectifs** : culturel, communicatif et linguistique.
- **📋 Mise en œuvre** en trois étapes : anticiper avant le document, vérifier avec une stratégie outillée, réinvestir.
- **🔧 Consignes guidées** en anglais, une par étape.
- **📖 Lexique clé** à partir des mots-clés de la ressource.
- **Tâche finale suggérée** et pistes de **différenciation** (étayage et enrichissement).

Ces suggestions sont des points de départ : à toi de les adapter à ta classe et à ta séquence.

## Ajouter ses propres ressources (profil Prof)

Tu as trouvé une vidéo, un article ou une chanson qui manque ? Tu peux l'ajouter à ta bibliothèque.

1. Appuie sur **+ Ajouter** en haut de l'écran.
2. Remplis la fiche : titre, type, niveau, axe du programme, pays (sous forme de drapeau emoji), année, niveau CECRL, lien, description et mots-clés. Le titre, le lien et la description sont obligatoires.
3. Appuie sur **Ajouter une ressource**.

Ta ressource apparaît dans la bibliothèque avec une étiquette spéciale, et le compteur indique combien de ressources tu as ajoutées. Elle reçoit aussi sa suggestion d'exploitation. Pour la retirer, ouvre sa fiche et appuie sur **Supprimer**.

À savoir : tes ressources ajoutées sont enregistrées dans le navigateur de ton appareil. Elles ne sont visibles que sur cet appareil, et ne sont pas partagées avec tes élèves ni avec tes collègues.

## Conseils d'utilisation

**Pour les enseignants.** Au moment de construire une séquence, filtre par niveau et par axe pour trouver rapidement des documents qui s'y rattachent, puis appuie-toi sur la suggestion d'exploitation pour préparer tes étapes. Pense à vérifier chaque document avant de le montrer en classe : extrait choisi, durée, et disponibilité du lien, qui peut changer avec le temps.

**En classe.** On peut laisser les élèves explorer un axe en autonomie et choisir une ressource à présenter à la classe, en exposé ou en binôme. Les filtres CECRL aident à orienter chacun vers des documents à sa portée.

**Pour les élèves et à la maison.** Le profil élève permet de découvrir des chansons, des films, des séries ou des podcasts en anglais selon ses goûts, pour pratiquer en dehors du cours.

**À savoir.** L'application ne demande aucune inscription. Les ressources sont des liens vers des sites extérieurs (YouTube, BBC, The Guardian, TED…), qui ont leurs propres conditions d'utilisation : certains contenus peuvent nécessiter un abonnement ou ne plus être disponibles.
</script>

<script type="text/markdown" id="tuto-didactics-ai-coach">
## C'est quoi, Didactics AI Coach ?

Didactics AI Coach (« Didactique Anglais — Compagnon MEEF ») est un assistant conversationnel spécialisé en didactique de l'anglais, pensé pour les étudiants de MEEF 1 et 2. Il permet de poser ses questions sur les programmes du collège et du lycée, de réfléchir à la construction d'une séance ou d'une séquence, et de préparer les concours (CAPES).

L'application est gratuite et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone. Ses réponses sont produites par une intelligence artificielle (Lovable AI).

Elle est organisée par espaces de travail :

| Espace | Pour quoi faire |
| --- | --- |
| Collège · 6ème | Les programmes et la didactique du cycle 3 |
| Collège · 5e — 4e — 3e | Les programmes et la didactique du cycle 4 |
| Lycée · Seconde | Le programme de seconde |
| Lycée · 1ère — Terminale | Le cycle terminal |
| Concours · Préparation concours | La préparation aux épreuves du CAPES |
| Chat libre | Toute autre question de didactique |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Dans le menu, choisis l'espace qui correspond à ta question : un niveau de collège ou de lycée, la préparation au concours, ou le **Chat libre**.
3. Sur la page d'accueil, des **suggestions** de questions te donnent des idées pour démarrer : appuie sur l'une d'elles, ou écris ta propre question.
4. Pour repartir de zéro sur un autre sujet, appuie sur **+ Nouvelle conversation**.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Bien utiliser l'assistant

Plus ta question est précise, plus la réponse sera utile. Donne le contexte : le niveau de classe, l'axe ou la thématique du programme, l'activité langagière visée, la durée de la séance, et ce que tu as déjà prévu.

| Au lieu de… | Essaie plutôt… |
| --- | --- |
| « Une séance sur la nourriture » | « Je prépare une séance de 55 minutes en 5e sur la nourriture, axe « Le quotidien ». Je veux travailler la compréhension de l'oral. Propose-moi une démarche en trois étapes. » |
| « C'est quoi la tâche finale ? » | « Explique-moi la différence entre tâche finale et activité de production, avec un exemple pour une séquence de 3e. » |
| « Aide-moi pour le concours » | « Je prépare l'épreuve de didactique du CAPES. Pose-moi des questions comme un jury, à partir d'un document sur le Royaume-Uni. » |

N'hésite pas à poursuivre la conversation : demande une variante, une différenciation pour des élèves en difficulté, une version plus courte, ou une justification didactique de chaque étape.

Quelques idées d'usages :

- vérifier ce que disent les programmes pour un niveau donné ;
- construire ou critiquer le déroulé d'une séance ;
- trouver des pistes de différenciation ;
- préparer un entretien ou un oral de concours en se faisant interroger ;
- reformuler une notion de didactique (progression spiralaire, tâche intermédiaire, évaluation positive…).

## Ce qu'il faut savoir

**L'IA peut se tromper.** L'application le rappelle elle-même : vérifie toujours les références aux programmes officiels sur Éduscol et dans le Bulletin officiel, en particulier les citations et les numéros de textes. L'assistant est un partenaire de réflexion, pas une source officielle.

**Tes messages sont envoyés à un service d'intelligence artificielle** pour produire les réponses. Contrairement aux applications BROT2YOU hébergées sur GitHub, l'outil ne fonctionne donc pas uniquement dans ton navigateur. N'y écris jamais d'informations personnelles : pas de nom d'élève, de collègue ou d'établissement, pas de situation identifiable.

**Une conversation ne remplace pas la formation.** Les propositions de l'assistant sont des pistes à discuter avec ton tuteur ou ton formateur, et à adapter à tes élèves.

## Conseils d'utilisation

**Pour les étudiants MEEF et les stagiaires.** Utilise l'assistant pour préparer, pas pour remplacer ton travail : formule d'abord ta propre idée de séance, puis demande-lui de la critiquer ou de l'enrichir. Garde une trace des réponses utiles, et vérifie chaque référence au programme avant de l'utiliser dans un écrit ou à l'oral.

**Pour les tuteurs et les formateurs.** L'outil peut servir de point de départ à un échange : le stagiaire présente une proposition de l'assistant, et on en discute ensemble (est-elle adaptée à la classe ? cohérente avec les programmes ? réaliste en 55 minutes ?). C'est aussi une bonne occasion de travailler l'esprit critique face aux réponses d'une IA.

**Pour la préparation au concours.** L'espace dédié permet de s'entraîner à formuler des analyses et à répondre à des questions de type jury, en complément des annales et des rapports de jury.
</script>

<script type="text/markdown" id="tuto-didalangues">
## C'est quoi, DidaLangues ?

DidaLangues est une bibliothèque de fiches de didactique des langues : les concepts, les démarches, les activités langagières, les outils numériques, la mise en œuvre en classe, les formes de travail et les grands auteurs de référence (Tricot, Roussel, Meirieu, Krashen, Ellis, Puren…). Elle s'adresse aux étudiants MEEF, aux stagiaires, aux formateurs et à tous les enseignants de langues qui veulent clarifier une notion ou trouver une idée pour la classe.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone.

Elle rassemble 190 fiches réparties en sept rubriques :

| Rubrique | Contenu | Fiches |
| --- | --- | --- |
| 📖 Glossaire | Les concepts fondamentaux : didactique, compétences, cognition, évaluation, acquisition, phonologie, grammaire, lexique… | 109 |
| 🧭 Démarches | Les approches et méthodes, de l'audio-oral à l'actionnel (approche communicative, TBLT, EMILE, projets…) | 14 |
| 🎯 Activités langagières | La didactique propre à chaque activité du CECRL | 8 |
| 💡 Innovations & TICE | IA générative, classe inversée, podcasting, eTwinning, corpus, jeux sérieux… | 14 |
| ⚙️ Mise en œuvre | Des fiches pratiques : tâche finale, évaluation de l'oral, séquence, hétérogénéité… | 19 |
| 👥 Formes de travail | Binômes, îlots, tutorat, ateliers tournants, simulation globale… | 11 |
| 📚 Publications & auteurs | Ouvrages et articles de référence, résumés et mis en perspective | 15 |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. L'**Accueil** affiche le nombre de fiches de chaque rubrique, puis une carte par rubrique avec ses grandes catégories. Touche une carte pour ouvrir la rubrique.
3. Sur ordinateur, le menu **Navigation** à gauche permet de passer d'une rubrique à l'autre. Sur téléphone, une barre en bas de l'écran donne accès à l'Accueil, au Glossaire, aux Activités, aux TICE et aux Auteurs.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Parcourir une rubrique

Chaque rubrique présente ses fiches sous forme de cartes : la catégorie, le titre, un résumé en une phrase et des mots-clés. En haut, des étiquettes permettent de filtrer par catégorie. Par exemple, dans le Glossaire : **Tous**, Didactique, Compétences, Cognition, Évaluation, Acquisition, Phonologie, Grammaire, Lexique, Affect, Culture.

## Lire une fiche

Touche une carte pour ouvrir la fiche complète. Elle rappelle sa rubrique et sa catégorie, puis développe la notion : définition, explications, exemples pour la classe d'anglais et mots-clés associés. Par exemple, la fiche « Accentuation lexicale et phrastique » explique pourquoi le word stress change le sens des mots (a REcord / to reCORD) et comment le travailler.

Pour fermer la fiche, touche la croix ✕, touche en dehors de la fiche, ou appuie sur la touche Échap.

## Chercher dans toutes les fiches

La barre de recherche, en haut de l'écran, cherche dans les 190 fiches à la fois : titres, résumés, contenus et mots-clés. Les résultats indiquent leur nombre et les rubriques d'où ils viennent. Appuie sur **Effacer** pour revenir à l'accueil.

Astuce : la recherche est idéale pour retrouver une notion entendue en formation ou lue dans un texte officiel : « tâche finale », « médiation », « input », « différenciation », « Krashen »…

## Bon à savoir

DidaLangues est un outil de consultation : il n'y a pas de compte, rien à remplir, et aucune donnée n'est enregistrée ni envoyée. Toutes les fiches sont contenues dans la page, ce qui la rend rapide à ouvrir.

Les fiches sont des synthèses : elles donnent des repères et des pistes, mais ne remplacent pas la lecture des ouvrages cités ni les textes officiels (programmes et BO), qui restent la référence.

## Conseils d'utilisation

**Pour les étudiants MEEF et les stagiaires.** Utilise le Glossaire pour clarifier une notion avant un cours ou un écrit, puis les fiches **Mise en œuvre** pour la transposer en classe. Pour le mémoire ou le concours, la rubrique **Publications & auteurs** donne une première entrée dans les ouvrages de référence, avant de les lire.

**Pour les tuteurs et les formateurs.** Une fiche peut servir de support à un échange : on lit ensemble la notion, puis on cherche comment elle se traduit dans une séance observée. Les fiches **Formes de travail** et **Mise en œuvre** donnent des pistes concrètes à proposer après une observation.

**Pour tous les enseignants de langues.** La recherche permet de retrouver rapidement une notion ou une idée d'activité. Les fiches sont rédigées pour l'anglais, mais la plupart des concepts valent pour toutes les langues vivantes.
</script>

<script type="text/markdown" id="tuto-dys-college">
## C'est quoi, DysCollège ?

DysCollège aide les enseignants à accompagner les élèves présentant un trouble dys ou un trouble de l'attention. On choisit un trouble, puis une discipline, et l'application affiche aussitôt des conseils concrets pour la classe. Elle propose aussi un outil pour adapter la mise en forme d'un texte (consigne, énoncé, extrait) en quelques secondes.

L'application est gratuite et sans inscription. Elle n'utilise aucune IA : les conseils sont tirés de cinq sources de référence (Golliet, Peneveyre, Willig pour l'AFPA, le guide LFZ Zurich, Ducos-Filippi chez ESF), et chaque conseil indique sa source.

Elle couvre huit troubles :

| Trouble | Domaine concerné |
| --- | --- |
| 📖 Dyslexie | Lecture, déchiffrage |
| ✍️ Dysorthographie | Orthographe, copie |
| 💬 Dysphasie | Langage oral |
| ✋ Dyspraxie | Gestes, espace |
| ✏️ Dysgraphie | Geste graphique |
| 🧩 Fonctions exécutives | Planification, mémoire |
| ⚡ TDA/H | Attention, agitation |
| 🔢 Dyscalculie | Nombres, calcul |

Et huit contextes : conseils généraux, français, langues vivantes, mathématiques-physique-SVT, musique, arts plastiques, EPS et histoire-géographie.

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Sur l'accueil, choisis le trouble qui t'intéresse (étape **1. Quel trouble ?**).
3. Choisis ensuite le contexte (étape **2. Dans quel contexte ?**) : les conseils généraux ou ta discipline.
4. Pour revenir à l'étape précédente, appuie sur **‹ Retour** en haut de l'écran.

La barre du bas permet d'aller à tout moment vers l'**Accueil**, l'outil **Adapter**, la **Recherche**, les **Fiches** de principes universels, ou **Plus** pour retrouver la liste de tous les troubles.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Lire les conseils

Une fois le trouble et le contexte choisis, les conseils s'affichent par blocs thématiques (par exemple « Comprendre », puis des pistes d'adaptation). Chaque conseil est court et concret, et se termine par sa source : Willig, LFZ, Golliet, Peneveyre ou Ducos-Filippi. Par exemple, pour la dyslexie : un élève dyslexique ne peut pas écrire et écouter en même temps, et recopier un texte au tableau lui demande trois tâches à la fois, sans l'aider à mémoriser.

En bas de la page, deux encarts complètent les conseils : les **principes universels**, valables dans toutes les disciplines, et la **mise en forme recommandée** des documents. Au total, l'application rassemble plus de 350 conseils.

## Adapter un texte (outil Adapter)

Cet outil transforme la présentation d'un texte en direct.

1. Ouvre **✨ Adapter mon texte**, depuis l'accueil ou la barre du bas.
2. Colle ton texte dans la zone **Ton texte original** : une consigne, une dictée, un énoncé, un extrait…
3. Règle les **options de présentation** :

| Option | Choix possibles |
| --- | --- |
| Police | OpenDyslexic, Lexend, Andika, Comic Sans MS, Arial, Verdana, Tahoma, Century Gothic |
| Taille | 12-14 pt, 14-16 pt ou 16-18 pt |
| Interligne | 1,5 (recommandé), 1,8 ou 2 |
| Fond | Blanc, crème (anti-éblouissement) ou bleu très pâle |
| Mise en forme | Mots-clés en gras, découpage syllabique en couleurs, numérotation des lignes, alignement à gauche |

4. L'**aperçu adapté** se met à jour à chaque réglage.
5. Appuie sur **📋 Copier le texte adapté** pour le coller ailleurs, ou sur **🖨️ Imprimer** pour obtenir une version papier.

L'encart **💡 Pourquoi ces choix ?** explique chaque recommandation et sa source : police sans empattement, alignement à gauche jamais justifié, fond légèrement coloré, mots-clés en gras, syllabes en couleurs alternées.

## Chercher un conseil (Recherche)

La **🔍 Recherche libre** fouille dans tous les conseils, tous troubles et toutes disciplines confondus. Tape au moins deux lettres (par exemple « dictée », « tableau », « consigne », « temps ») : les résultats indiquent le trouble et la discipline de chaque conseil.

## Les fiches de principes universels

L'onglet **Fiches** rassemble les grands principes à garder en tête pour tous les élèves à besoins particuliers, par exemple les cinq principes clés du guide LFZ Zurich : évolutivité, encouragement, acceptation, différence et coordination entre enseignants, famille et thérapeutes. On y trouve aussi la méthode multisensorielle de Golliet (combiner le visuel, l'auditif et le kinesthésique).

## Bon à savoir

DysCollège ne demande aucun compte et n'enregistre rien : les textes collés dans l'outil Adapter restent dans ton navigateur et disparaissent quand tu fermes la page. Pense donc à copier ou imprimer ton texte adapté avant de partir.

Les conseils sont des pistes générales tirées des sources citées. Ils ne remplacent pas le PAP, le PPS ou les préconisations des professionnels qui suivent l'élève (orthophoniste, ergothérapeute, médecin scolaire), qui restent la référence pour chaque situation.

## Conseils d'utilisation

**Pour les enseignants.** Quand un PAP ou un PPS arrive, ouvre le trouble concerné dans ta discipline pour repérer quelques adaptations simples à mettre en place dès le cours suivant. Avant une évaluation, passe tes consignes et tes énoncés dans l'outil Adapter : quelques réglages suffisent souvent à rendre un document bien plus lisible, pour l'élève dys comme pour toute la classe.

**En conseil pédagogique ou en équipe.** L'application peut servir de base commune pour harmoniser les adaptations entre disciplines : chacun retrouve les conseils propres à sa matière, à partir des mêmes sources. Les fiches de principes universels sont un bon support pour une réunion d'équipe ou une formation.

**Pour les stagiaires et les étudiants MEEF.** C'est une porte d'entrée rapide pour comprendre les différents troubles et leurs conséquences en classe, avec des références à approfondir.

**À savoir.** Les adaptations se construisent toujours avec l'élève, sa famille et les professionnels qui le suivent : ce qui fonctionne pour un élève ne convient pas forcément à un autre.
</script>

<script type="text/markdown" id="tuto-dyscompagnon">
## C'est quoi, DysCompagnon ?

DysCompagnon est une boîte à outils pour les professeurs de collège qui accompagnent des élèves dys ou présentant un TDAH. Elle réunit quatre outils : une bibliothèque de fiches conseils, un adaptateur de texte, un assistant IA spécialisé et un carnet de suivi des élèves.

L'application est gratuite et fonctionne dans le navigateur, sur ordinateur, tablette ou téléphone. Elle ne remplace ni un bilan, ni un PAP ou un PPS.

| Outil | Ce qu'il permet |
| --- | --- |
| Fiches conseils | 27 fiches actionnables, filtrables par trouble, par catégorie et par délai de mise en place |
| Adaptateur de texte | Reformater un texte en quelques secondes : police, taille, espacements, fond, syllabes colorées |
| Assistant IA | Poser une question pédagogique et obtenir des pistes d'adaptation |
| Mes élèves | Noter les aménagements de chaque élève et suivre ses progrès |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. Le menu en haut donne accès aux cinq pages : **Accueil**, **Fiches conseils**, **Adaptateur de texte**, **Assistant IA** et **Mes élèves**.
3. Depuis l'accueil, les boutons **Explorer les fiches** et **Adapter un texte** mènent directement aux deux outils les plus utilisés.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Les fiches conseils

La bibliothèque rassemble 27 fiches, synthétisées à partir de guides officiels et de ressources d'enseignants de terrain. Deux filtres permettent de trouver la bonne :

- **par trouble** : dyslexie, dysorthographie, dyspraxie, dyscalculie, dysphasie, TDAH, ou « tous troubles dys » ;
- **par catégorie** : aménagements en classe, évaluations et devoirs, lecture et écrit, langues vivantes, mathématiques, outils et numérique, posture enseignante, organisation et méthodologie.

Chaque fiche indique aussi son délai de mise en place : **Immédiat**, **Court terme** ou **Sur l'année**. Pratique pour repérer ce qu'on peut changer dès demain (formuler des consignes courtes, éviter la double tâche, oraliser les consignes) et ce qui se construit dans la durée (différenciation, collaboration avec les familles). Appuie sur **Lire** pour ouvrir une fiche. Les fiches sont imprimables.

Pour les professeurs de langues, plusieurs fiches sont dédiées : adapter l'anglais pour les élèves dyslexiques, approche multisensorielle des langues étrangères, limiter la confusion des mots et des sons, soutenir l'expression orale des élèves dysphasiques.

## L'adaptateur de texte

1. Colle ton texte dans la zone **Texte à adapter**.
2. Règle l'affichage : police (Atkinson Hyperlegible, Lexend, OpenDyslexic ou Arial), taille, interligne, espacement des lettres et des mots, couleur de fond, et syllabes colorées.
3. L'**aperçu adapté** s'affiche à côté du texte d'origine, pour comparer.
4. Appuie sur **Copier** pour récupérer le texte adapté.

Astuce de l'application : Atkinson Hyperlegible, interligne 1,8 et espacement des mots de 0,15 offrent un confort de lecture maximal.

## L'assistant IA

Pose une question concrète sur une situation de classe. Quelques exemples proposés par l'application :

- « Comment adapter une évaluation d'histoire pour un élève dyslexique de 5e ? »
- « Quels outils numériques pour un élève dyspraxique en cours de maths ? »
- « Comment gérer un élève TDAH qui perturbe la classe ? »
- « Idées pour faciliter l'apprentissage de l'anglais à un élève dys ? »

Précise le niveau, la discipline et le type de difficulté pour obtenir des pistes adaptées, mais jamais le nom de l'élève (voir plus bas).

## Mes élèves

Cette page permet de créer une fiche par élève avec **Nouvel élève**, pour noter ses troubles, ses aménagements et des notes de progression. Les fiches sont enregistrées localement, sur l'appareil utilisé.

## Protéger les données des élèves

Les troubles et les aménagements d'un élève sont des informations de santé, particulièrement sensibles. Quelques règles simples :

- **Dans l'assistant IA, ne donne jamais le nom ni aucun détail permettant de reconnaître un élève.** Tes questions sont envoyées à un service d'intelligence artificielle en ligne pour produire les réponses. Décris la situation de façon générale : « un élève dyslexique de 5e », pas son prénom.
- **Dans Mes élèves, utilise des initiales ou un pseudonyme.** Les fiches restent sur l'appareil, mais toute personne qui l'utilise peut les voir. Évite de remplir ces fiches sur un ordinateur partagé (salle des profs, CDI), et vérifie que cet usage est compatible avec les consignes de ton établissement.
- **Les fiches élèves ne suivent pas** si tu changes d'appareil ou si tu effaces les données de ton navigateur.

## Les limites de l'outil

L'assistant IA peut se tromper : l'application le rappelle elle-même. Ses réponses sont des pistes à vérifier et à adapter. Les fiches donnent des repères généraux. Dans tous les cas, le PAP ou le PPS de l'élève, et les préconisations des professionnels qui le suivent, restent la référence.

## Conseils d'utilisation

**Pour démarrer.** Filtre les fiches sur le délai « Immédiat » : tu trouveras des adaptations simples à mettre en place dès le prochain cours, comme raccourcir les consignes, oraliser les supports ou éviter de demander d'écouter et d'écrire en même temps.

**Avant une évaluation.** Passe tes consignes et tes textes dans l'adaptateur. Une police plus lisible et un interligne plus grand profitent souvent à toute la classe, et pas seulement à l'élève dys.

**Face à une situation particulière.** L'assistant IA peut t'aider à trouver des idées, à condition de décrire la situation sans identifier l'élève. Confronte ensuite ses propositions aux fiches et au PAP ou PPS.

**En équipe.** Les fiches peuvent servir de support commun en conseil pédagogique ou lors d'une équipe éducative, pour harmoniser les adaptations entre disciplines, en lien avec la famille et les professionnels qui suivent l'élève.
</script>

<script type="text/markdown" id="tuto-evars-companion">
## C'est quoi, EVARS Companion ?

EVARS Companion aide les professeurs d'anglais de collège à croiser deux programmes : les axes culturels du programme d'anglais (BO 2025) et les objectifs de l'éducation à la vie affective et relationnelle, et à la sexualité (EVARS, programme de février 2025). Pour chaque croisement, l'outil propose un dossier pédagogique prêt à adapter : une activité de 45 minutes, une séquence, des idées de supports ou une tâche d'évaluation.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne entièrement hors ligne, dans le navigateur.

Pour chaque niveau, trois objectifs EVARS sont proposés, un par axe du programme :

| Niveau | Corps | Relation | Société |
| --- | --- | --- | --- |
| 6e (A1 → A1+) | Comprendre les changements de son corps | Entrer en relation avec les autres | Trouver sa place dans un groupe |
| 5e (A1+ → A2) | Développer librement sa personnalité | Choisir ses relations | Distinguer vie publique et vie privée |
| 4e (A1+ → A2+) | La sexualité comme réalité complexe | Compréhension critique des relations | Représentations de la sexualité |
| 3e | Bonheur, émotions et sexualité | Relation réciproque et égalitaire | Sexualité et droits humains |

Ces objectifs se croisent avec les 23 axes culturels du programme d'anglais, de « Personnes et personnages » en 6e à « L'Irlande » en 4e : soit 69 dossiers différents.

## Premiers pas

1. Ouvre l'adresse dans ton navigateur. Une fois la page chargée, elle fonctionne même sans connexion.
2. Dans la colonne de gauche, choisis le **Niveau** : 6e, 5e, 4e ou 3e.
3. Choisis ensuite le **Type d'activité**, c'est-à-dire le format de travail : discussion guidée, analyse de document, production créative ou jeu de rôle.
4. La partie centrale affiche alors les axes du programme d'anglais et les objectifs EVARS du niveau choisi.

Sur téléphone, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Générer un dossier pédagogique

1. Dans **📚 Axe BO anglais**, choisis l'axe culturel de ta séquence (par exemple « Sport et société » ou « Le Royaume-Uni »).
2. Dans **💬 Objectif EVARS**, choisis l'objectif à travailler. Chacun porte une étiquette de couleur : Corps, Relation ou Société.
3. Le **✦ Générateur de séquence** s'active. Choisis ce que tu veux obtenir :

| Choix | Ce que contient le dossier |
| --- | --- |
| Activité 45 min | Contexte, objectifs, déroulé minuté de la séance dans le format choisi, consignes en anglais |
| Séquence 3-4 séances | Contexte, objectifs, organisation séance par séance (découverte, approfondissement, production, bilan), supports |
| Supports | Contexte, idées de documents à exploiter, consignes en anglais |
| Évaluation | Contexte, objectifs, tâche sommative adaptée au niveau, exemple de consigne en anglais, critères d'évaluation |

4. Appuie sur **✦ Générer le dossier pédagogique**.

Le dossier rappelle en en-tête le niveau, le niveau CECRL visé, l'axe, l'objectif EVARS et le format. Il se termine toujours par un encadré **⚠️ Points de vigilance pédagogique**, propre à chaque croisement : à lire attentivement avant de mener la séance.

## Récupérer le dossier

- **🖨 Imprimer** pour une version papier ou un PDF.
- **⎘ Copier** pour coller le texte dans ton traitement de texte ou ton cahier de textes, et l'adapter.

## Bon à savoir

EVARS Companion fonctionne entièrement hors ligne : aucune IA, aucun compte, et rien n'est enregistré ni envoyé. Les dossiers sont rédigés à l'avance pour chaque croisement entre un axe du programme d'anglais et un objectif EVARS. Ils ne sont pas conservés : pense à imprimer ou copier ton dossier avant de fermer la page.

Les dossiers sont des propositions de départ. Ils sont à relire et à adapter à ta classe, à l'âge et à la maturité des élèves, et au cadre fixé par ton établissement pour l'EVARS.

## Conseils d'utilisation

**Partir de sa séquence d'anglais.** Le plus simple est de choisir l'axe culturel que tu travailles déjà avec ta classe, puis de regarder quel objectif EVARS s'y rattache naturellement. L'EVARS vient alors enrichir la séquence, sans être plaquée.

**Lire les points de vigilance avant la séance.** Ces sujets touchent à l'intime : poser un cadre clair dès le début (respect de la parole de chacun, droit de ne pas s'exprimer, pas de témoignage personnel exigé), et rester attentif aux réactions des élèves.

**Travailler en équipe.** L'EVARS est un projet d'établissement. Il est utile d'en parler avec le CPE, l'infirmier ou l'infirmière scolaire et les collègues qui interviennent sur le même niveau, pour articuler les séances et savoir vers qui orienter un élève qui aurait besoin d'en parler.

**Choisir le bon format.** La discussion guidée et l'analyse de document conviennent bien pour ouvrir un thème ; la production créative et le jeu de rôle permettent aux élèves de s'exprimer à travers un personnage, ce qui protège leur intimité.
</script>

<script type="text/markdown" id="tuto-fabrique-de-seances">
## C'est quoi, l'Atelier de Fabrique de Séances ?

L'Atelier de Fabrique de Séances est un « bureau d'études pédagogique » pour les professeurs d'anglais de collège. Il rassemble une grande banque d'activités et de modalités de travail, classées par compétence, par moment de séance et par niveau, ainsi qu'un constructeur pour assembler et minuter une séance dynamique en quelques clics.

L'application est gratuite, sans inscription ni collecte de données, et fonctionne dans le navigateur.

Elle s'organise en sept onglets :

| Onglet | Ce qu'on y trouve |
| --- | --- |
| 📐 Constructeur | Le canevas pour assembler, minuter et enregistrer une séance |
| 🧩 Modalités de travail | 16 façons d'organiser la classe : binômes, îlots, jigsaw, world café, débat mouvant, escape game… |
| 🎲 Banque d'activités | 264 activités : compréhension et expression orales et écrites, interaction, médiation, jeux, théâtre |
| 🏫 Classe flexible & autonome | 18 leviers : coin lecture, plan de travail, ceintures de compétences, choice board, cercles de lecture… |
| 🧭 Phases de cours | 13 phases pour structurer une séance, du rituel d'entrée au rituel de sortie |
| 📊 Compétences par niveau | La progression indicative CECRL des 6 activités langagières, de la 6e à la 3e |
| 🗂 Mes séances | Les séances enregistrées, l'import et l'export |

## Premiers pas

1. Ouvre l'adresse dans ton navigateur.
2. L'application s'ouvre sur le **📐 Constructeur**. Les onglets du haut donnent accès aux banques de ressources.
3. Si c'est ta première visite, fais d'abord un tour dans **🧭 Phases de cours** pour découvrir la trame de séance proposée, puis reviens au Constructeur.

Sur téléphone ou tablette, tu peux ajouter l'application à ton écran d'accueil :

- iPhone (Safari) : bouton Partager, puis « Sur l'écran d'accueil ».
- Android (Chrome) : menu ⋮, puis « Ajouter à l'écran d'accueil ».

## Construire une séance (onglet Constructeur)

1. **Renseigne l'en-tête** : titre de la séance, niveau (6e, 5e, 4e, 3e ou tous niveaux) et durée cible en minutes.
2. **Écris tes objectifs** : objectif communicatif ou pragmatique 🎯, objectif linguistique 🔤 et objectif culturel 🌍.
3. **Active les phases** dont tu as besoin dans le canevas. Les 13 phases vont du rituel d'entrée au rituel de sortie, en passant par la réactivation, la mise en contexte, la découverte, la compréhension, l'injection lexicale, la conceptualisation, l'entraînement et la production. Toutes ne sont pas nécessaires à chaque séance. **✅ Tout activer** et **⬜ Tout désactiver** font gagner du temps.
4. **Choisis une activité pour chaque phase.** L'application en propose une, adaptée au moment de la séance et au niveau. Tu peux la changer, chercher une activité précise avec **Remplacer l'activité d'une phase par une recherche précise**, ou écrire ta propre activité (titre et déroulé).
5. **Vérifie le minutage** : chaque activité affiche sa durée indicative, à comparer avec ta durée cible.

Pour aller vite, **🎲 Générer une proposition** construit une séance complète en un clic, que tu peux ensuite ajuster. **🔄 Réinitialiser** retire toutes les activités choisies et les redistribue au hasard.

## Puiser dans les banques

**🎲 Banque d'activités.** Les 264 activités sont classées par compétence : compréhension de l'oral et de l'écrit, expression orale en continu et en interaction, expression écrite, médiation, jeux et théâtre. Chaque fiche indique le moment de séance, les niveaux, la durée, la modalité de travail, le matériel, le déroulé, et une piste de **dynamisation**. Par exemple, l'écoute active avec grille de repérage peut devenir un bingo à cocher.

**🧩 Modalités de travail.** 16 façons d'organiser la classe, de la classe entière au projet de groupe long, en passant par les ateliers tournants, le jigsaw, le speed dating pédagogique ou le tournoi par équipes.

**🏫 Classe flexible & autonome.** 18 dispositifs d'organisation de l'espace, d'autonomie et de différenciation, à combiner avec les activités : coin lecture, plan de travail individualisé, ceintures de compétences, protocole « 3 avant moi », cercles de lecture… Plusieurs sont pensés pour la lecture suivie d'une œuvre longue, quel que soit le livre.

**🧭 Phases de cours.** Pour chaque phase : son objectif, la part de temps conseillée, des points de vigilance, les modalités adaptées et des exemples d'activités.

**📊 Compétences par niveau.** Une synthèse indicative de la progression CECRL, de la 6e à la 3e, pour les 6 activités langagières : à ajuster selon le profil réel de chaque classe.

## Enregistrer, imprimer, partager

Une séance doit comporter au moins une phase active avec une activité pour être enregistrée, imprimée ou exportée.

- **💾 Enregistrer cette séance** la range dans l'onglet **🗂 Mes séances**, où tu peux la recharger ou la supprimer.
- **🖨 Imprimer / PDF** produit une fiche de séance à garder dans ton classeur ou à partager avec ton tuteur.
- **⬇ Exporter JSON** crée un petit fichier contenant la séance. Avec **⬆ Importer un fichier JSON**, dans Mes séances, tu peux la récupérer sur un autre ordinateur ou l'échanger avec un collègue.

À savoir : les séances enregistrées restent dans le navigateur de l'appareil utilisé. Pour les conserver durablement ou changer d'ordinateur, exporte-les en JSON ou imprime-les en PDF.

## Conseils d'utilisation
